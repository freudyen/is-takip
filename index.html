/* --- sıralama ------------------------------------------------------------ */
function sortBy(list){
  var arr = list.slice();
  if(sortMode === 'prio'){
    arr.sort(function(a, b){
      var d = (b.priority || 0) - (a.priority || 0);
      if(d) return d;
      return dueRank(a) - dueRank(b);
    });
  } else if(sortMode === 'due'){
    arr.sort(function(a, b){ var d = dueRank(a) - dueRank(b); return d || (b.priority || 0) - (a.priority || 0); });
  }
  return arr;
}
function dueRank(o){ return isDayKey(o.due) ? keyToDate(o.due).getTime() : 8640000000000; }
/* Elle sıralama: hedef, aynı kümedeki (örn. iki açık madde arasında
   tamamlanmış bir madde varsa onu atlayarak) görünür komşudur. */
function neighborIndex(arr, i, delta, sameFn){
  var j = i + delta;
  while(j >= 0 && j < arr.length && sameFn && !sameFn(arr[j], arr[i])) j += delta;
  return (j >= 0 && j < arr.length) ? j : -1;
}
function moveInArray(arr, id, delta, sameFn){
  var i = arr.findIndex(function(x){ return x.id === id; });
  if(i < 0) return false;
  var j = neighborIndex(arr, i, delta, sameFn);
  if(j < 0) return false;
  var x = arr.splice(i, 1)[0];
  arr.splice(j, 0, x);
  return true;
}
function canMove(arr, id, delta, sameFn){
  if(sortMode !== 'manual') return false;          /* sıralama otomatikken taşıma anlamsız */
  var i = arr.findIndex(function(x){ return x.id === id; });
  return i >= 0 && neighborIndex(arr, i, delta, sameFn) >= 0;
}
function sameVisibility(a, b){ return (!a.archived) === (!b.archived); }
function sameItemGroup(a, b){ return !!a.done === !!b.done && (!a.archived) === (!b.archived); }

/* --- çöp kutusu (30 gün) ------------------------------------------------- */
var KIND_LABEL = { project:'Proje', task:'İş', item:'Madde', reminder:'Hatırlatma', weekly:'Haftalık plan', alarm:'Hatırlatıcı', leaveday:'İzin günü', ledger:'İzin hareketi', note:'Not' };
function trashPush(kind, label, data, loc){
  if(!Array.isArray(state.trash)) state.trash = [];
  var entry = { id: uid(), at: Date.now(), kind: kind, label: snip(label, 90), data: clone(data), loc: loc || {} };
  state.trash.unshift(entry);
  return entry;
}
function deletedToast(entry, extra){
  toast((KIND_LABEL[entry.kind] || 'Kayıt') + ' silindi: ' + entry.label + (extra ? ' (' + extra + ')' : ''), {
    actionLabel:'↩ Geri al',
    action: function(){ restoreTrash(entry.id, true); }
  });
}
function restoreTrash(id, quiet){
  var i = state.trash.findIndex(function(t){ return t.id === id; });
  if(i < 0) return;
  var e = state.trash[i], ok = true, where = '';
  function ins(arr, idx, val){ arr.splice(Math.min(Math.max(num(idx, arr.length), 0), arr.length), 0, val); }
  if(e.kind === 'project') ins(state.projects, e.loc.index, e.data);
  else if(e.kind === 'task'){
    var p = findProject(e.loc.pid);
    if(p) ins(p.tasks, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu proje artık yok.'; }
  } else if(e.kind === 'item'){
    var t = findTask(e.loc.pid, e.loc.tid);
    if(t) ins(t.items, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu iş artık yok.'; }
  } else if(e.kind === 'reminder'){
    var pr = findProject(e.loc.pid);
    if(pr) ins(pr.reminders, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu proje artık yok.'; }
  } else if(e.kind === 'weekly'){
    if(!state.weekly[e.loc.weekKey]) state.weekly[e.loc.weekKey] = [];
    ins(state.weekly[e.loc.weekKey], e.loc.index, e.data);
  } else if(e.kind === 'alarm') state.alarms.push(e.data);
  else if(e.kind === 'leaveday'){
    state.leave.days[e.data.key] = e.data.value;
    if(e.data.note) state.leave.notes[e.data.key] = e.data.note;
  } else if(e.kind === 'ledger') state.leave.ledger.push(e.data);
  else if(e.kind === 'note') ins(noteList(), e.loc.index, e.data);
  if(!ok){ toast('Geri yüklenemedi. ' + where, { bad:true }); return; }
  state.trash.splice(i, 1);
  commit();
  if(!quiet) toast('Geri yüklendi: ' + e.label);
}
function purgeTrash(id){
  state.trash = state.trash.filter(function(t){ return t.id !== id; });
  commit();
}
function emptyTrash(){
  if(!state.trash.length) return;
  if(!confirm('Çöp kutusundaki ' + state.trash.length + ' kayıt kalıcı olarak silinsin mi?\n\nBu işlem geri alınamaz.')) return;
  state.trash = [];
  commit();
  toast('Çöp kutusu boşaltıldı.');
}

/* --- izin defteri -------------------------------------------------------- */
function leaveData(){
  if(!state.leave || typeof state.leave !== 'object') state.leave = { days:{}, notes:{}, ledger:[], adjust:0 };
  if(!state.leave.days || typeof state.leave.days !== 'object') state.leave.days = {};
  if(!state.leave.notes || typeof state.leave.notes !== 'object') state.leave.notes = {};
  if(!Array.isArray(state.leave.ledger)) state.leave.ledger = [];
  return state.leave;
}
function leaveEarned(){
  var L = leaveData(), s = 0;
  Object.keys(L.days).forEach(function(k){ s += num(L.days[k] && L.days[k].amount, 1); });
  return round2(s);
}
function leaveLedgerSum(){
  return round2(leaveData().ledger.reduce(function(a, e){ return a + num(e.amount, 0); }, 0));
}
function leaveUsed(){
  return round2(-leaveData().ledger.filter(function(e){ return e.amount < 0; }).reduce(function(a, e){ return a + e.amount; }, 0));
}
function leaveTotal(){ return round2(leaveEarned() + leaveLedgerSum()); }
function markLeaveDay(key, type, amount){
  var L = leaveData();
  L.days[key] = { type: type, amount: round2(amount > 0 ? amount : 1) };
  commit();
}
function removeLeaveDay(key){
  var L = leaveData();
  if(!L.days[key]) return;
  var e = trashPush('leaveday', fmtDay(key), { key:key, value: L.days[key], note: L.notes[key] || '' }, {});
  delete L.days[key]; delete L.notes[key];
  commit();
  deletedToast(e);
}
function addLeaveEntry(kind, amount, note, at){
  var L = leaveData();
  var e = { id: uid(), kind: kind, amount: round2(amount), at: at || todayKey(), createdAt: Date.now() };
  if(str(note).trim()) e.note = str(note).trim();
  L.ledger.push(e);
  commit();
  return e;
}

  var i = L.ledger.findIndex(function(x){ return x.id === id; });
  if(i < 0) return;
  var e = trashPush('ledger', (L.ledger[i].amount > 0 ? '+' : '') + fmtNum(L.ledger[i].amount) + ' gün', L.ledger[i], {});
  L.ledger.splice(i, 1);

function noteList(){ if(!Array.isArray(state.notebook)) state.notebook = []; return state.notebook; }
function noteLabel(n){ return n.title || snip(n.body, 60) || 'Başlıksız not'; }
function addNote(title, body){
  title = str(title).trim(); body = str(body).replace(/\s+$/, '').replace(/^\s*\n/, '');
  if(!title && !body.trim()) return;
  var now = Date.now();
  noteList().unshift({ id: uid(), title: title, body: body, createdAt: now, updatedAt: now });

/* --- ajanda (son tarihler) ---------------------------------------------- */
function dueItems(){
  var out = [];
  state.projects.forEach(function(p){
    if(p.archived) return;
    p.tasks.forEach(function(t){
      if(t.archived) return;
      if(isDayKey(t.due) && !taskIsDone(t)) out.push({ p:p, t:t, it:null, due:t.due, text:t.title, kind:'task' });
      t.items.forEach(function(it){
        if(it.archived || it.done || !isDayKey(it.due)) return;
        out.push({ p:p, t:t, it:it, due: it.due, text: it.text, kind:'item' });
      });
    });
  });
  return out.sort(function(a, b){ return keyToDate(a.due) - keyToDate(b.due); });
}
function dueByDay(){
  var m = {};
  dueItems().forEach(function(x){ (m[x.due] = m[x.due] || []).push(x); });
  return m;
}

  else if(drive.on){ cls += ' ok'; msg = '✓ Drive ile eşit' + (drive.lastSync ? ' (son kontrol ' + fmtTime(drive.lastSync) + ')' : '') +

/* Kayıt durumu: { cls, msg, short, nodes }. Her çağrı yeni düğmeler üretir;
   böylece aynı içerik hem üst çubukta hem de geniş ekrandaki yan kartta kullanılır. */
function barParts(){
  var nodes = [];
  var driveMode = drive.on || drive.connecting || drive.needsLogin || !!drive.choice || !!drive.err || driveFlag();
  var dp = driveBarParts();
  var cls, msg, short;

  if(driveMode){
    cls = dp.cls; msg = dp.msg;
    if(drive.err) short = 'Drive hatası';
    else if(drive.choice) short = 'Drive: seçim bekliyor';
    else if(drive.working || drive.connecting) short = 'Drive: işlem sürüyor…';
    else if(drive.needsLogin) short = 'Drive: giriş gerekli';
    else if(drive.on && drive.offline) short = 'Drive: bağlantı bekleniyor';
    else if(drive.on && driveDirty()) short = 'Drive ile eşitleniyor…';
    else if(drive.on) short = 'Drive ile eşit';
    else if(driveFlag() && !driveClientId()) short = 'Drive: ayar eksik';
    else short = 'Drive bağlı değil';
    nodes = nodes.concat(dp.btns);
  } else {
    cls = 'status';
    if(saveError){ cls += ' err'; msg = '⚠ ' + saveError; short = 'Kayıt hatası'; }
    else if(canWrite && !dirty){ cls += ' ok'; msg = '✓ Veriler ' + (jsonHandle && jsonHandle.name ? '"' + jsonHandle.name + '" dosyasına' : 'JSON dosyasına') + ' otomatik kaydediliyor.'; short = 'Dosyaya kaydedildi'; }
    else if(canWrite && dirty){ cls += ' warn'; msg = '● JSON dosyasına yazılıyor…'; short = 'Dosyaya yazılıyor…'; }
    else if(dirty){ cls += ' warn'; msg = '● Değişiklikler bu cihazda saklandı; kalıcı kayıt için dosyaya ya da Drive\'a bağlanın.'; short = 'Yalnızca bu cihazda'; }
    else if(needsPermission){ cls += ' warn'; msg = 'Hatırlanan ' + (jsonHandle ? 'dosya: "' + (jsonHandle.name || 'JSON') + '"' : 'klasör: "' + (folderHandle && folderHandle.name || '') + '"') + ' — sayfada herhangi bir yere tıklayınca izin istenecek.'; short = 'Kayıt izni gerekli'; }
    else if(!hasFS){ msg = 'Bu tarayıcı yerel dosyaya yazmayı desteklemiyor; veriler bu cihazda saklanıyor. Kalıcı kayıt için Google Drive\'a bağlanın.'; short = 'Yalnızca bu cihazda'; }
    else { msg = 'Veriler bu cihazda saklanıyor. Kalıcı kayıt için Drive\'a, bir dosyaya ya da klasöre bağlanın.'; short = 'Yalnızca bu cihazda'; }

    nodes = nodes.concat(dp.btns);
    if(hasFS && !canWrite && !needsPermission){
      nodes.push(el('button', { class:'small', text:'📄 Yeni JSON Oluştur', onclick: createNewJsonFile }));
      nodes.push(el('button', { class:'small', text:'🔗 Varolan JSON\'a Bağlan', onclick: connectExistingJsonFile }));
      nodes.push(el('button', { class:'small', text:'📁 Klasöre Bağlan (' + AUTO_NAME + ' otomatik)', title:'Bu HTML dosyasının bulunduğu klasörü seçin; içindeki ' + AUTO_NAME + ' her açılışta kendiliğinden bağlanır', onclick: connectFolder }));
    }
    if(needsPermission){
      nodes.push(el('button', { class:'primary small', text:'🔓 Otomatik Kaydı Etkinleştir', onclick: enablePermission }));
    }
  }
  nodes.push(el('button', { class:'small', text:'📥 JSON İçe Aktar (Yükle)', onclick: importJsonFile }));
  nodes.push(el('button', { class:'small', text:'📤 JSON Dışa Aktar (Yedek)', onclick: downloadBackup }));
  if(drive.setup && !drive.on) nodes.push(driveSetupBox());
  if(drive.picker) nodes.push(drivePickerBox());
  return { cls: cls, msg: msg, short: short, nodes: nodes };
}

function renderToday(){
  var root = clear(document.getElementById('todayView'));
  var tk = todayKey(), now = Date.now();

  /* özet kartı: hatırlatıcılar + geciken / bugün biten işler */
  var card = el('div', { class:'tdcard' }, [
    el('div', { class:'tdtitle', text:'Bugün' }),
    el('div', { class:'tdsub', text: fmtDay(tk) })
  ]);
  var next = alarmList().filter(function(a){ return a.at > now; }).sort(function(a, b){ return a.at - b.at; }).slice(0, 4);
  var sec = el('div', { class:'tdsec' }, [ el('h4', { text:'⏰ Sıradaki hatırlatıcılar' }) ]);
  if(!next.length) sec.appendChild(el('div', { class:'empty', text:'Yaklaşan hatırlatıcı yok.' }));
  next.forEach(function(a){
    var k = dayKey(a.at);
    var when = k === tk ? fmtTime(a.at) : (k === shiftKey(tk, 1) ? 'Yarın ' : fmtDayShort(k) + ' ') + fmtTime(a.at);
    sec.appendChild(todayRow(when, a.text, null, function(){ switchTab('alarm'); flashEl(findBySid(a.id)); }));
  });
  card.appendChild(sec);

  var di = dueItems();
  var over = di.filter(function(x){ return dayDiff(x.due, tk) < 0; });
  var today = di.filter(function(x){ return dayDiff(x.due, tk) === 0; });
  function dueSec(title, list, cls){
    var s = el('div', { class:'tdsec' + (cls ? ' ' + cls : '') }, [ el('h4', { text: title + ' (' + list.length + ')' }) ]);
    list.slice(0, 6).forEach(function(x){
      var d = dueInfo(x.due, false);
      s.appendChild(todayRow(null, x.text, cls === 'over' ? d.label : x.p.title, function(){ goDueItem(x); }));
    });
    if(list.length > 6) s.appendChild(todayRow(null, '… ve ' + (list.length - 6) + ' tane daha', null, function(){ switchTab('tasks'); }));
    return s;
  }
  if(over.length) card.appendChild(dueSec('⚠ Geciken', over, 'over'));
  if(today.length) card.appendChild(dueSec('📅 Bugün son gün', today, ''));
  if(!over.length && !today.length) card.appendChild(el('div', { class:'tdok', text:'✓ Geciken ya da bugün biten iş yok.' }));
  root.appendChild(card);

  /* mini takvim: son tarihli ve hatırlatıcılı günler işaretli */
  if(miniY === null){ var n0 = new Date(); miniY = n0.getFullYear(); miniM = n0.getMonth(); }
  var marks = {};
  di.forEach(function(x){ marks[x.due] = (dayDiff(x.due, tk) < 0) ? 'over' : (marks[x.due] || 'has'); });
  alarmList().forEach(function(a){ var k = dayKey(a.at); if(!marks[k]) marks[k] = 'has'; });
  function shiftMonth(d){ miniM += d; if(miniM < 0){ miniM = 11; miniY--; } else if(miniM > 11){ miniM = 0; miniY++; } renderToday(); }
  var grid = el('div', { class:'mcal' });

/* --- sistem bildirimleri ------------------------------------------------- */
var snoozeId = null, snoozeVal = '', snoozeErr = '', lastDueKey = '', lastRenderedAlarmKey = '';
var notified = {};
try { notified = JSON.parse(lsGet('is-takip-notified') || '{}') || {}; } catch(e){ notified = {}; }
function notifyOK(){ return typeof Notification !== 'undefined'; }
function systemNotify(a){
  if(!notifyOK() || Notification.permission !== 'granted') return;
  var key = a.id + ':' + a.at;
  if(notified[key]) return;
  if(document.hasFocus()) return;
  notified[key] = Date.now();
  var keys = Object.keys(notified);
  if(keys.length > 200) keys.slice(0, keys.length - 200).forEach(function(k){ delete notified[k]; });
  lsSet('is-takip-notified', JSON.stringify(notified));
  var title = '⏰ Hatırlatıcı', opts = { body: a.text, tag: a.id, requireInteraction: true, icon:'icon-192.png', badge:'icon-192.png' };
  function fallback(){ try { new Notification(title, { body: a.text, tag: a.id, icon:'icon-192.png' }); } catch(e){} }
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(function(reg){
      if(reg && reg.showNotification) reg.showNotification(title, opts).catch(fallback); else fallback();
    }, fallback);
  } else fallback();
}
function closeNotice(id){
  if(!(navigator.serviceWorker && navigator.serviceWorker.getRegistration)) return;
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(reg && reg.getNotifications) reg.getNotifications({ tag: id }).then(function(l){ l.forEach(function(n){ n.close(); }); });
  }).catch(function(){});
}
function renderAlarmBar(){
  var bar = document.getElementById('alarmBar');
  var due = dueAlarms();
  lastDueKey = due.map(function(a){ return a.id + ':' + a.at; }).join('|');
  clear(bar);
  due.forEach(function(a){
    systemNotify(a);
    var kids = [ el('div', { class:'arow' }, [
      ic('bell'),
      el('span', { class:'atext', text:a.text }),
      el('span', { class:'awhen', text:fmt(a.at) }),
      a.ref ? el('button', { type:'button', class:'small', text:'→ İlgili iş', onclick:function(){ gotoRef(a.ref); } }) : null,
      el('button', { type:'button', class:'primary small', text:'✓ Onayla', onclick:function(){ ackAlarm(a.id); } }),
      el('button', { type:'button', class:'small', text:'10 dk', title:'10 dakika ertele', onclick:function(){ snoozeAlarm(a.id, 10); } }),
      el('button', { type:'button', class:'small', text:'1 sa', title:'1 saat ertele', onclick:function(){ snoozeAlarm(a.id, 60); } }),
      el('button', { type:'button', class:'small', text:'⏱ Ertele…', onclick:function(){
        snoozeId = a.id; snoozeVal = defaultAlarmValue(60); snoozeErr = ''; renderAlarmBar();
        var i = document.querySelector('#alarmBar .dtpick'); if(i) i.focus();
      } })
    ]) ];
    if(snoozeId === a.id){
      var inp = dtInput({ 'aria-label':'Yeni hatırlatma zamanı' });
      inp.value = snoozeVal;
      inp.addEventListener('input', function(){ snoozeVal = inp.value; });
      inp.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ e.preventDefault(); snoozeId = null; renderAlarmBar(); } });
      var err = el('span', { class:'err', text:snoozeErr });
      kids.push(el('form', { onsubmit:function(e){
        e.preventDefault();
        var ts = parseWhen(inp.value);
        if(ts === null){ err.textContent = 'Geçerli bir tarih ve saat girin.'; return; }
        if(ts <= Date.now()){ err.textContent = 'Gelecekte bir zaman girin.'; return; }
        snoozeId = null; closeNotice(a.id); setAlarm(a.id, a.text, ts);
      } }, [
        el('span', { class:'awhen', text:'Yeni zaman:' }), inp,
        el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
        el('button', { type:'button', class:'small', text:'İptal', onclick:function(){ snoozeId = null; renderAlarmBar(); } }),
        err
      ]));
    }
    bar.appendChild(el('div', { class:'alarm' }, kids));
  });
  var over = dueItems().filter(function(x){ return dayDiff(x.due, todayKey()) < 0; }).length;
  document.title = (due.length ? '⏰ (' + due.length + ') ' : (over ? '(' + over + ') ' : '')) + 'İş Takip';
  var tb = document.querySelector('#tabs [data-tab="alarm"]');
  if(tb) tb.textContent = '⏰ Hatırlatıcı' + (due.length ? ' (' + due.length + ')' : '');
}
function alarmTick(){
  var key = dueAlarms().map(function(a){ return a.id + ':' + a.at; }).join('|');
  if(key !== lastDueKey){ renderAlarmBar(); renderSides(); }
  if(tab === 'alarm' && key !== lastRenderedAlarmKey && !editKey) renderAlarms();
}

/* --- ortak satır bileşenleri -------------------------------------------- */
function startEdit(key){ editKey = key; render(); }
function cancelEdit(){ editKey = null; render(); }
function escCancel(e){ if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); } }

function editForm(text, maxlen, onSave){
  var inp = el('input', { type:'text', maxlength:String(maxlen), autocomplete:'off', 'data-edit':'1', 'aria-label':'Metin' });
  inp.value = text;
  inp.addEventListener('keydown', escCancel);
  return el('form', { class:'editform', onsubmit:function(e){
    e.preventDefault(); var v = inp.value.trim(); if(!v) return; editKey = null; onSave(v);
  } }, [
    inp, el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
    el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit })
  ]);

function noteForm(obj){
  var ta = el('textarea', { rows:'3', maxlength:'2000', placeholder:'Notunuzu yazın…', 'data-edit':'1', 'aria-label':'Not' });
  ta.value = obj.note || '';
  function save(){
    var v = ta.value.trim();
    if(v) obj.note = v; else delete obj.note;
    editKey = null; commit();
  }
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
    else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
  });
  var actions = [
    el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
    el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit })
  ];
  if(obj.note) actions.push(el('button', { type:'button', class:'small', text:'Notu Sil', onclick:function(){ delete obj.note; editKey = null; commit(); } }));
  actions.push(el('span', { class:'hintx', text:'Ctrl+Enter ile kaydet' }));
  return el('form', { class:'noteform', onsubmit:function(e){ e.preventDefault(); save(); } }, [ ta, el('div', { class:'noteactions' }, actions) ]);
}
function noteBlock(obj){
  if(editKey === 'n:' + obj.id) return noteForm(obj);

function menu(parts){
  var box = el('div', { class:'menu' });
  parts.forEach(function(p){ if(p) box.appendChild(p); });
  var det = el('details', { class:'rowmenu' }, [
    el('summary', { title:'İşlemler', 'aria-label':'İşlemler', text:'⋯' }), box
  ]);
  /* dar ekranda menüyü görünür alanın içinde tut */
  det.addEventListener('toggle', function(){
    box.style.left = ''; box.style.right = '';
    if(!det.open) return;
    var r = box.getBoundingClientRect();
    if(r.left < 8) { box.style.left = '0'; box.style.right = 'auto'; }
    var r2 = box.getBoundingClientRect();
    if(r2.right > window.innerWidth - 8){ box.style.left = 'auto'; box.style.right = '0'; }
  });
  return det;

/* --- proje hatırlatmaları ------------------------------------------------ */
function remForm(text, btnText, isEdit, onSave, dataKey){
  var attrs = { rows: isEdit ? '3' : '2', maxlength:'1500', autocomplete:'off', 'aria-label':'Hatırlatma',
    placeholder: isEdit ? '' : 'Unutmamam gereken bir şey yaz… (Enter = alt satır)' };
  if(isEdit) attrs['data-edit'] = '1'; else attrs['data-key'] = dataKey;
  var ta = el('textarea', attrs);
  ta.value = text || '';
  function submit(){
    var v = ta.value.replace(/\s+$/, '').replace(/^\s*\n/, '');
    if(!v.trim()) return;
    if(isEdit) editKey = null;
    ta.value = '';
    onSave(v);
  }
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && isEdit){ e.preventDefault(); cancelEdit(); }
    else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); submit(); }
  });
  var btns = [ el('button', { type:'submit', class: isEdit ? 'primary small' : '', text: btnText }) ];
  if(isEdit) btns.push(el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit }));
  btns.push(el('span', { class:'hintx', text:'Enter: alt satır • Ctrl+Enter: ' + btnText.toLowerCase() }));
  return el('form', { class:'remform', onsubmit:function(e){ e.preventDefault(); submit(); } }, [ ta, el('div', { class:'rbtns' }, btns) ]);
}
/* Proje hatırlatmaları: tek satırlık sade liste; ekleme alanı yalnızca
   proje menüsünden "Hatırlatma ekle" seçilince açılır */

      el('button', { type:'button', class:'ib', title:'Hatırlatmayı sil', 'aria-label':'Hatırlatmayı sil', onclick:function(){ deleteReminder(p.id, r.id); } }, [ ic('trash', 's') ])

/* --- ajanda: geciken / bugün / bu hafta --------------------------------- */
function renderAgenda(){
  var box = document.getElementById('agendaBox');
  clear(box);
  if(isWide()) return;                 /* geniş ekranda bu bilgiler sağdaki "Bugün" panelinde */
  var list = dueItems();
  if(!list.length) return;
  var tk = todayKey();
  var over = list.filter(function(x){ return dayDiff(x.due, tk) < 0; });
  var today = list.filter(function(x){ return dayDiff(x.due, tk) === 0; });
  var week = list.filter(function(x){ var d = dayDiff(x.due, tk); return d > 0 && d <= 7; });
  var det = el('details', { class:'agenda' + (over.length ? '' : ' clean') });
  if(over.length || today.length) det.setAttribute('open', '');
  det.appendChild(el('summary', null, [
    el('span', { text: over.length ? '⏳ ' + over.length + ' geciken iş' : '📅 Son tarihli işler' }),
    el('span', { class:'count', text: today.length + ' bugün • ' + week.length + ' bu hafta' })
  ]));
  function sec(title, rows, cls){
    if(!rows.length) return null;
    var ul = el('ul');
    rows.forEach(function(x){
      var d = dueInfo(x.due, false);
      ul.appendChild(el('li', null, [
        prioChip(x.it || x.t),
        el('button', { class:'sitem', style:'flex:1 1 200px;text-align:left;border:0;background:none;padding:4px 0;color:var(--text)',
          text: x.text, title:'Bulunduğu yere git', onclick:function(){ goTask((x.it || x.t).id); } }),
        el('span', { class:'due ' + d.cls, text:'📅 ' + d.label }),
        el('span', { class:'created-tag', text: x.p.title + ' › ' + x.t.title + (x.kind === 'task' ? ' (iş)' : '') })
      ]));
    });
    return el('div', { class:'gsec' }, [ el('h4', { class: cls, text: title }), ul ]);
  }
  det.appendChild(sec('Gecikenler', over) || el('span'));
  det.appendChild(sec('Bugün', today) || el('span'));
  det.appendChild(sec('Önümüzdeki 7 gün', week) || el('span'));
  box.appendChild(det);
}

function statusPill(t, isDone){

function taskSection(p, t){

function projStats(p){
  var s = { open:0, done:0, over:0, mins:0 }, tk = todayKey(), ym = tk.slice(0, 7);
  p.tasks.forEach(function(t){
    if(t.archived && !showArchivedTasks) return;
    t.items.forEach(function(i){
      if(i.archived && !showArchivedTasks) return;
      if(i.done){ s.done++; if(i.minutes && i.doneAt && dayKey(i.doneAt).slice(0, 7) === ym) s.mins += i.minutes; }
      else { s.open++; if(isDayKey(i.due) && dayDiff(i.due, tk) < 0) s.over++; }
    });
  });
  return s;
}
function projectBlock(p, single){

  var vis = sortBy(p.tasks.filter(function(t){ return showArchivedTasks || !t.archived; }));

  if(editKey === 'p:' + p.id){

      projectMenu(p)
    ]);
  }
  var nodes = [ head, el('div', { class:'pmeta' }, [
    el('span', { text: s.open + ' açık' }),
    el('span', { text: s.done + ' tamamlandı' }),
    s.over ? el('span', { class:'over' }, [ ic('clock', 's'), tx(s.over + ' geciken') ]) : null,
    s.mins ? el('span', { title:'Bu ay tamamlanan maddelere girilen çalışma süresi' }, [ ic('clock', 's'), tx('Bu ay ' + fmtMin(s.mins)) ]) : null,
    el('span', { text: vis.length + ' iş' })
  ]) ];
  if(total) nodes.push(el('div', { class:'bar', 'aria-hidden':'true' }, [ el('span', { style:'width:' + Math.round(s.done / total * 100) + '%' }) ]));
  var info = [ noteBlock(p), (remList(p).length || remOpen[p.id]) ? remindersBlock(p) : null ].filter(Boolean);
  if(info.length) nodes.push(el('div', { class:'pinfo' }, info));
  if(!vis.length) nodes.push(el('div', { class:'empty', style:'margin-top:14px', text:'Bu projede henüz iş yok.' }));
  vis.forEach(function(t){ nodes.push(taskSection(p, t)); });

  return el('div', { class:'proj' + (single ? ' single' : ''), 'data-sid': p.id }, nodes);
}

/* --- pano görünümü: işler durumlarına göre sütunlarda ------------------- */
var dragTid = null;
function findTaskById(tid){
  for(var a = 0; a < state.projects.length; a++){
    var p = state.projects[a];
    for(var b = 0; b < p.tasks.length; b++) if(p.tasks[b].id === tid) return { p:p, t:p.tasks[b] };
  }
  return null;
}
function boardCard(p, t, multi){
  var items = t.items.filter(function(i){ return showArchivedTasks || !i.archived; });
  var done = items.filter(function(i){ return i.done; }).length, tk = todayKey();
  var over = items.filter(function(i){ return !i.done && isDayKey(i.due) && dayDiff(i.due, tk) < 0; }).length;
  var urgent = items.filter(function(i){ return !i.done && i.priority === 2; }).length;
  var isDone = taskIsDone(t);
  var card = el('div', { class:'bcard', draggable: isDone ? null : 'true', tabindex:'0', role:'button',
    'aria-label': t.title + ' — listede göster', title:'Listede göstermek için tıklayın' + (isDone ? '' : ' • durumu değiştirmek için başka sütuna sürükleyin'),
    onclick:function(){ goTask(t.id); },
    onkeydown:function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goTask(t.id); } } }, [
    multi ? el('div', { class:'bproj' }, [ pdot(p), tx(p.title) ]) : null,

    ]),
    items.length ? el('div', { class:'bar', 'aria-hidden':'true' }, [ el('span', { style:'width:' + Math.round(done / items.length * 100) + '%' }) ]) : null
  ]);
  card.addEventListener('dragstart', function(e){ dragTid = t.id; try { e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move'; } catch(x){} });
  card.addEventListener('dragend', function(){ dragTid = null; });
  return card;
}
function renderBoard(shown){
  var cols = [ ['todo','Başlamadı'], ['doing','Devam ediyor'], ['blocked','Bloklu'], ['done','Tamamlandı'] ];
  var buckets = { todo:[], doing:[], blocked:[], done:[] }, multi = shown.length > 1;
  shown.forEach(function(p){
    sortBy(p.tasks).forEach(function(t){
      if(t.archived && !showArchivedTasks) return;
      var k = taskIsDone(t) ? 'done' : (buckets[t.status] ? t.status : 'todo');
      buckets[k].push({ p:p, t:t });
    });
  });
  var board = el('div', { class:'board', 'aria-label':'Pano görünümü' });
  cols.forEach(function(c){
    var col = el('div', { class:'bcol', 'data-st': c[0] }, [
      el('div', { class:'bcolh' }, [ el('span', { class:'stpill st-' + c[0], text: c[1] }), el('span', { class:'tcount', text: String(buckets[c[0]].length) }) ])
    ]);
    if(c[0] !== 'done'){
      col.addEventListener('dragover', function(e){ if(dragTid){ e.preventDefault(); col.classList.add('drop'); } });
      col.addEventListener('dragleave', function(e){ if(!col.contains(e.relatedTarget)) col.classList.remove('drop'); });
      col.addEventListener('drop', function(e){
        e.preventDefault(); col.classList.remove('drop');
        var x = dragTid && findTaskById(dragTid); dragTid = null;
        if(x && !taskIsDone(x.t) && x.t.status !== c[0]){ x.t.status = c[0]; commit(); }
      });
    }
    buckets[c[0]].forEach(function(x){ col.appendChild(boardCard(x.p, x.t, multi)); });
    if(!buckets[c[0]].length) col.appendChild(el('div', { class:'empty', style:'padding:6px 4px', text: c[0] === 'done' ? 'Tamamlanan iş yok.' : 'Buraya iş sürükleyin.' }));
    board.appendChild(col);
  });
  return board;
}

      if(alarms.length) lbl.push(alarms.length + ' hatırlatıcı');

      grid.appendChild(el('button', { type:'button', class:'day' + (key === tk ? ' today' : '') + (key === selDay ? ' sel' : ''),
        'data-day': key, 'aria-label': lbl.join(', '), 'aria-current': key === tk ? 'date' : null,

          alarms.length ? el('span', { class:'dmark al', text:'⏰ ' + alarms.length }) : null,

        ])

        el('button', { class:'small', text:'→ Git', onclick:function(){ goTask((x.it || x.t).id); } })

var manual = { pid:'', tid:'__new__', msg:'', ok:true, when:'', open:false };
function manualForm(){
  if(manual.pid && !findProject(manual.pid)) manual.pid = '';
  if(!manual.pid && activeProjects().length) manual.pid = activeProjects()[0].id;

  var det = el('details', { class:'manual' });
  if(manual.open) det.setAttribute('open', '');
  det.addEventListener('toggle', function(){ manual.open = det.open; });
  det.appendChild(el('summary', null, [ el('span', { text:'➕ Manuel yapılan iş ekle' }),
    el('span', { class:'count', text:'geçmişe dönük kayıt' }) ]));
  if(!activeProjects().length){
    det.appendChild(el('div', { class:'empty', text:'Önce "İşler" sekmesinden bir proje ekleyin.' }));
    return det;
  }
  var form = el('form', { novalidate:'novalidate' });
  function field(label, node, wide){ return el('div', { class:'mfield' + (wide ? ' wide' : '') }, [ el('label', { text:label }), node ]); }

  var selP = el('select', { 'aria-label':'Proje' }, activeProjects().map(function(p){ return el('option', { value:p.id, text:p.title }); }));
  selP.value = manual.pid;
  var selT = el('select', { 'aria-label':'İş' });
  var newTask = el('input', { type:'text', maxlength:'100', autocomplete:'off', placeholder:'Yeni iş adı (örn. Tasarım)' });
  var newTaskField = field('Yeni iş adı', newTask);
  function fillTasks(){
    var p = findProject(selP.value);
    clear(selT);
    selT.appendChild(el('option', { value:'__new__', text:'➕ Yeni iş oluştur…' }));
    (p ? activeTasks(p) : []).forEach(function(t){ selT.appendChild(el('option', { value:t.id, text:t.title })); });
    var ok = p && manual.tid !== '__new__' && p.tasks.some(function(t){ return t.id === manual.tid && !t.archived; });
    if(!ok) manual.tid = (p && activeTasks(p).length) ? activeTasks(p)[0].id : '__new__';
    selT.value = manual.tid;
    newTaskField.hidden = (manual.tid !== '__new__');
  }
  selP.addEventListener('change', function(){ manual.pid = selP.value; manual.tid = ''; fillTasks(); });
  selT.addEventListener('change', function(){ manual.tid = selT.value; newTaskField.hidden = (manual.tid !== '__new__'); });
  fillTasks();

  var text = el('input', { type:'text', maxlength:'200', autocomplete:'off', placeholder:'Yapılan işi yazın…' });
  var when = dtInput({ 'aria-label':'Tarih ve saat' });
  when.value = manual.when || localInputValue(Date.now());      /* girilen tarih korunur */
  when.addEventListener('change', function(){ manual.when = when.value; });
  var dur = el('input', { type:'text', maxlength:'40', autocomplete:'off', placeholder:'örn. 2 saat, 90 dk, 1:30 (isteğe bağlı)' });
  var note = el('textarea', { rows:'2', maxlength:'2000', placeholder:'İsteğe bağlı not…' });
  var msg = el('span', { class:'mmsg' + (manual.msg ? (manual.ok ? ' ok' : ' err') : ''), text: manual.msg });

  form.appendChild(el('div', { class:'mgrid' }, [
    field('Proje', selP), field('İş', selT), newTaskField,
    field('Yapılan iş', text, true),
    field('Tamamlanma tarihi / saati', when), field('Çalışma süresi', dur),
    field('Not', note, true)
  ]));
  form.appendChild(el('div', { class:'mactions' }, [ el('button', { type:'submit', class:'primary', text:'Kaydet' }), msg ]));
  form.addEventListener('submit', function(e){
    e.preventDefault();
    function fail(m){ msg.className = 'mmsg err'; msg.textContent = m; manual.msg = m; manual.ok = false; }
    var p = findProject(selP.value);
    if(!p) return fail('Proje seçin.');
    var v = text.value.trim();
    if(!v) return fail('Yapılan işi yazın.');
    var ts = parseWhen(when.value);
    if(ts === null) return fail('Geçerli bir tarih girin.');
    var mins = parseDuration(dur.value);
    if(mins === null) return fail('Süre anlaşılamadı. Örnekler: 4 saat, 90 dk, 1 sa 30 dk, 1:30.');
    var t;
    if(manual.tid === '__new__'){
      var tn = newTask.value.trim();
      if(!tn) return fail('Yeni iş için bir ad yazın.');
      t = { id: uid(), title: tn, createdAt: ts, items: [], status:'doing', priority:0, archived:null };
      p.tasks.push(t);
      manual.tid = t.id;
    } else {
      t = findTask(p.id, manual.tid);
      if(!t) return fail('İş seçin.');
    }
    var it = { id: uid(), text: v, done:true, createdAt: ts, doneAt: ts, priority:0, archived:null };
    if(mins !== 'empty') it.minutes = mins;
    var nt = note.value.trim(); if(nt) it.note = nt;
    t.items.push(it);
    manual.pid = p.id; manual.when = when.value; manual.open = true;
    manual.msg = '✓ Eklendi: ' + snip(v, 40); manual.ok = true;
    commit();
    toast('Eklendi: ' + snip(v, 40));
  });
  det.appendChild(form);
  return det;
}

function rangeBounds(){
  var rFrom = dashRange.on && dashRange.from ? keyToDate(dashRange.from).getTime() : null;
  var rTo = dashRange.on && dashRange.to ? keyToDate(dashRange.to).getTime() + 86400000 - 1 : null;
  var swapped = false;
  if(rFrom !== null && rTo !== null && rFrom > rTo){
    swapped = true;
    var f = keyToDate(dashRange.to).getTime(), t = keyToDate(dashRange.from).getTime() + 86400000 - 1;
    rFrom = f; rTo = t;
  }
  return { from:rFrom, to:rTo, active: rFrom !== null || rTo !== null, swapped: swapped };
}
function renderDashboard(){
  var root = clear(document.getElementById('dashView'));
  if(dashFilter && !findProject(dashFilter)) dashFilter = '';
  var byProject = allDone().filter(function(x){ return !dashFilter || x.p.id === dashFilter; });
  var R = rangeBounds();
  var rows = byProject.filter(function(x){
    if(!R.active) return true;
    var ts = x.it.doneAt; if(!ts) return false;
    return (R.from === null || ts >= R.from) && (R.to === null || ts <= R.to);
  });

  /* filtreler */
  var sel = el('select', { 'aria-label':'Proje filtresi', onchange:function(e){ dashFilter = e.target.value; render(); } },
    [ el('option', { value:'', text:'Tüm projeler' }) ].concat(state.projects.map(function(p){
      return el('option', { value:p.id, text:p.title + (p.archived ? ' (arşiv)' : '') });
    })));
  sel.value = dashFilter;
  root.appendChild(el('div', { class:'dashbar' }, [ el('span', { class:'stats', text:'Proje:' }), sel ]));

  var rOn = el('input', { type:'checkbox', id:'rangeOn', 'aria-label':'Tarih aralığı filtresini etkinleştir' });
  rOn.checked = dashRange.on;
  rOn.addEventListener('change', function(){ dashRange.on = rOn.checked; render(); });
  var fromI = el('input', { type:'date', 'aria-label':'Başlangıç tarihi' });
  var toI = el('input', { type:'date', 'aria-label':'Bitiş tarihi' });
  fromI.value = dashRange.from; toI.value = dashRange.to;
  fromI.disabled = toI.disabled = !dashRange.on;
  fromI.addEventListener('change', function(){ dashRange.from = fromI.value; render(); });
  toI.addEventListener('change', function(){ dashRange.to = toI.value; render(); });
  function quick(label, fn){
    var b = el('button', { type:'button', class:'small', text:label, onclick:function(){
      var r = fn(); dashRange.on = true; dashRange.from = r[0]; dashRange.to = r[1]; render();
    } });
    b.disabled = !dashRange.on;
    return b;
  }
  var clearBtn = el('button', { type:'button', class:'small', text:'Temizle',
    onclick:function(){ dashRange.from = ''; dashRange.to = ''; render(); } });
  clearBtn.disabled = !dashRange.from && !dashRange.to;
  root.appendChild(el('div', { class:'dashbar' }, [
    el('label', { class:'stats', for:'rangeOn', style:'display:flex;align-items:center;gap:6px;cursor:pointer' }, [ rOn, el('span', { text:'Tarih aralığı:' }) ]),
    fromI, el('span', { class:'stats', text:'–' }), toI,
    quick('Bu hafta', function(){ var k = mondayKey(Date.now()); return [ k, shiftKey(k, 6) ]; }),
    quick('Bu ay', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), 1).getTime()), dayKey(new Date(n.getFullYear(), n.getMonth() + 1, 0).getTime()) ]; }),
    quick('Geçen ay', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime()), dayKey(new Date(n.getFullYear(), n.getMonth(), 0).getTime()) ]; }),
    quick('Son 30 gün', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 29).getTime()), dayKey(n.getTime()) ]; }),
    clearBtn
  ]));
  var rangeLabel = '';
  if(dashRange.on && !R.active){
    root.appendChild(el('div', { class:'empty', text:'Filtre açık ama tarih seçilmedi; tüm tarihler gösteriliyor.' }));
  } else if(R.active){
    var lblF = R.from !== null ? new Date(R.from).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'başlangıç';
    var lblT = R.to !== null ? new Date(R.to).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'bugün ve sonrası';
    rangeLabel = lblF + ' – ' + lblT;
    var rmins = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
    root.appendChild(el('div', { class:'daysum', text:'🔎 ' + rangeLabel + ' aralığı: ' + rows.length + ' madde' + (rmins ? ' • ' + fmtMin(rmins) : '') + (R.swapped ? ' (başlangıç bitişten sonraydı, yer değiştirildi)' : '') }));
  }

  /* dışa aktarma */
  root.appendChild(el('div', { class:'dashbar' }, [
    el('span', { class:'stats', text:'Dışa aktar:' }),
    el('button', { class:'small', text:'⬇ CSV (seçili aralık)', title:'Excel\'de açılabilir; proje ve tarih filtresi uygulanır', onclick:function(){ exportDoneCsv(rows); } }),
    el('button', { class:'small', text:'⬇ CSV (tüm maddeler)', title:'Açık ve tamamlanmış bütün maddeler', onclick: exportAllCsv }),
    el('button', { class:'small', text:'🖨 Puantaj yazdır / PDF', onclick:function(){ printTimesheet(rows, rangeLabel); } })
  ]));

  root.appendChild(manualForm());

  /* kutucuklar: "bugün / son 7 gün / bu hafta" her zaman tarih aralığından bağımsızdır */
  var tk = todayKey();
  var d7 = new Date(); d7.setHours(0, 0, 0, 0); d7.setDate(d7.getDate() - 6);
  var cToday = 0, c7 = 0, wkMinsMap = {}, dayMinsMap = {};
  byProject.forEach(function(x){
    var ts = x.it.doneAt; if(!ts) return;
    if(dayKey(ts) === tk) cToday++;
    if(ts >= d7.getTime()) c7++;
    if(x.it.minutes){
      var w = mondayKey(ts); wkMinsMap[w] = (wkMinsMap[w] || 0) + x.it.minutes;
      var dk = dayKey(ts); dayMinsMap[dk] = (dayMinsMap[dk] || 0) + x.it.minutes;
    }
  });
  var mins = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
  var noDur = rows.filter(function(x){ return !x.it.minutes; }).length;
  var wkMins = wkMinsMap[mondayKey(Date.now())] || 0;
  var overdue = dueItems().filter(function(x){ return dayDiff(x.due, tk) < 0 && (!dashFilter || x.p.id === dashFilter); }).length;

  function tile(v, l, cls){ return el('div', { class:'tile' + (cls ? ' ' + cls : '') }, [ el('div', { class:'v', text:v }), el('div', { class:'l', text:l }) ]); }
  root.appendChild(el('div', { class:'tiles' }, [
    tile(String(rows.length), R.active ? 'Aralıktaki tamamlanan' : 'Toplam tamamlanan'),
    tile(String(cToday), 'Bugün tamamlanan'),
    tile(String(c7), 'Son 7 gün'),
    tile(mins ? fmtMin(mins) : '—', R.active ? 'Aralıktaki çalışma süresi' : 'Toplam çalışma süresi'),
    tile(wkMins ? fmtMin(wkMins) : '—', 'Bu hafta çalışma süresi'),
    tile(String(noDur), 'Süresi girilmemiş'),
    tile(String(overdue), 'Geciken iş', overdue ? 'alert' : null),
    tile(fmtDays(leaveTotal()), 'Kalan izin')
  ]));

  /* son 14 gün grafiği (tarih aralığından bağımsız) */
  var counts = {};
  byProject.forEach(function(x){ if(x.it.doneAt){ var k = dayKey(x.it.doneAt); counts[k] = (counts[k] || 0) + 1; } });
  var days = [], max = 1;
  for(var i = 13; i >= 0; i--){
    var dd = new Date(); dd.setDate(dd.getDate() - i);
    var k = dayKey(dd.getTime()), c = counts[k] || 0;
    if(c > max) max = c;
    days.push({ key:k, day:dd.getDate(), count:c, mins: dayMinsMap[k] || 0 });
  }
  var chart = el('div', { class:'chart', role:'img',
    'aria-label':'Son 14 günde tamamlanan madde sayısı: ' + days.map(function(x){ return fmtDayShort(x.key) + ' ' + x.count; }).join(', ') });
  days.forEach(function(x){
    chart.appendChild(el('div', { class:'cc', title: fmtDay(x.key) + ': ' + x.count + ' madde' + (x.mins ? ' • ' + fmtMin(x.mins) : '') }, [
      el('span', { class:'val', text: x.count ? String(x.count) : '' }),
      el('div', { class:'bar' + (x.count ? '' : ' zero'), style:'height:' + (x.count ? Math.max(4, Math.round(x.count / max * 100)) : 2) + 'px' }),
      el('span', { class:'lbl', text:String(x.day) })
    ]));
  });
  root.appendChild(el('div', { class:'panel' }, [ el('h2', { text:'Son 14 günde tamamlanan maddeler' }), chart ]));

  /* haftalık süre grafiği */
  var wdata = [], wmax = 1, curWk = mondayKey(Date.now()), anyWk = false;
  for(var wi = 7; wi >= 0; wi--){
    var wk = shiftKey(curWk, -7 * wi), wm = wkMinsMap[wk] || 0;
    if(wm > wmax) wmax = wm;
    if(wm) anyWk = true;
    wdata.push({ key:wk, m:wm });
  }
  var wchart = el('div', { class:'chart', role:'img',
    'aria-label':'Son 8 haftada girilen çalışma süresi: ' + wdata.map(function(w){ return fmtDayShort(w.key) + ' haftası ' + (w.m ? fmtMin(w.m) : '0'); }).join(', ') });
  wdata.forEach(function(w){
    wchart.appendChild(el('div', { class:'cc', title: fmtDayShort(w.key) + ' – ' + fmtDayShort(shiftKey(w.key, 6)) + ' haftası: ' + (w.m ? fmtMin(w.m) : 'süre girilmemiş') }, [
      el('span', { class:'val', text: w.m ? fmtHours(w.m) + ' sa' : '' }),
      el('div', { class:'bar' + (w.m ? '' : ' zero'), style:'height:' + (w.m ? Math.max(4, Math.round(w.m / wmax * 100)) : 2) + 'px' }),
      el('span', { class:'lbl', text: fmtDayShort(w.key) })
    ]));
  });
  root.appendChild(el('div', { class:'panel' }, [
    el('h2', { text:'Haftalık toplam çalışma süresi (son 8 hafta)' }), wchart,
    anyWk ? null : el('div', { class:'empty', text:'Bu haftalarda süre girilmiş madde yok.' })
  ]));

  /* proje özeti — proje filtresi de uygulanır */
  var agg = {};
  rows.forEach(function(x){
    var a = agg[x.p.id] = agg[x.p.id] || { p:x.p, n:0, m:0, last:0 };
    a.n++; if(x.it.minutes) a.m += x.it.minutes;
    if((x.it.doneAt || 0) > a.last) a.last = x.it.doneAt || 0;
  });
  var aggList = Object.keys(agg).map(function(k){ return agg[k]; }).sort(function(a, b){ return b.n - a.n; });
  root.appendChild(el('h2', { text:'Proje özeti' + (R.active ? ' (seçili aralık)' : '') }));
  if(aggList.length){
    var tb = el('tbody');
    aggList.forEach(function(a){
      tb.appendChild(el('tr', null, [
        el('td', { text:a.p.title }), el('td', { class:'nw', text:String(a.n) }),
        el('td', { class:'nw', text: a.m ? fmtMin(a.m) : '—' }), el('td', { class:'nw', text: fmt(a.last) })
      ]));
    });
    root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Proje' }), el('th', { text:'Tamamlanan' }), el('th', { text:'Çalışma süresi' }), el('th', { text:'Son tamamlanma' }) ]) ]),
      tb,
      el('tfoot', null, [ el('tr', null, [ el('td', { text:'Toplam' }), el('td', { class:'nw', text:String(rows.length) }),
        el('td', { class:'nw', text: mins ? fmtMin(mins) : '—' }), el('td', { text:'' }) ]) ])
    ]) ]));
  } else {
    root.appendChild(el('div', { class:'empty', text: R.active ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
  }

  /* tamamlanan maddeler tablosu */
  root.appendChild(el('h2', { text:'Tamamlanan işler' }));
  if(rows.length){
    var sorted = rows.slice().sort(function(a, b){ return (b.it.doneAt || 0) - (a.it.doneAt || 0); });
    var cap = 300, shown = sorted.slice(0, cap);
    var body = el('tbody');
    shown.forEach(function(x){
      var editingDate = editKey === 'd:' + x.it.id;
      var itemCell = el('td', null, editKey === 'i:' + x.it.id
        ? [ editForm(x.it.text, 200, function(v){ editItem(x.p.id, x.t.id, x.it.id, v); }) ]
        : [ el('div', { text:x.it.text }),
            el('div', { class:'rowacts' }, [
              x.it.archived ? el('span', { class:'tag', text:'arşiv' }) : null,
              el('button', { class:'icon', text: x.it.note ? '📝 Not' : '📝 Not ekle', onclick:function(){ startEdit('n:' + x.it.id); } }),
              el('button', { class:'icon', text:'✎ Düzenle', onclick:function(){ startEdit('i:' + x.it.id); } })
            ]),
            noteBlock(x.it) ]);
      body.appendChild(el('tr', null, [
        el('td', { class: editingDate ? '' : 'nw' }, [ editingDate ? dateForm(x.it) : dateBtn(x.it, false) ]),
        el('td', { text:x.p.title }), el('td', { text:x.t.title }), itemCell,
        el('td', null, [ editKey === 'm:' + x.it.id ? durForm(x.it) : durBtn(x.it) ])
      ]));
    });
    root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Tamamlanma' }), el('th', { text:'Proje' }), el('th', { text:'İş' }), el('th', { text:'Madde' }), el('th', { text:'Süre' }) ]) ]),
      body
    ]) ]));
    if(sorted.length > cap){
      root.appendChild(el('div', { class:'empty', text:'Tabloda en yeni ' + cap + ' kayıt gösteriliyor (toplam ' + sorted.length + '). Tamamı için CSV\'ye aktarın ya da tarih aralığı seçin.' }));
    }
  } else {
    root.appendChild(el('div', { class:'empty', text: R.active ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
  }
}

/* --- CSV / puantaj ------------------------------------------------------- */
function exportDoneCsv(rows){
  var out = [[ 'Tarih','Saat','Proje','İş','Madde','Süre (dk)','Süre','Öncelik','Son tarih','Durum','Not' ]];
  rows.slice().sort(function(a, b){ return (a.it.doneAt || 0) - (b.it.doneAt || 0); }).forEach(function(x){
    out.push([
      x.it.doneAt ? new Date(x.it.doneAt).toLocaleDateString('tr-TR') : '',
      x.it.doneAt ? fmtTime(x.it.doneAt) : '',
      x.p.title, x.t.title, x.it.text,
      x.it.minutes || '', x.it.minutes ? fmtMin(x.it.minutes) : '',
      PRIO[x.it.priority || 0] || '', isDayKey(x.it.due) ? x.it.due : '',
      x.it.archived ? 'arşiv' : 'tamamlandı', x.it.note || ''
    ]);
  });
  var total = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
  out.push([]);
  out.push([ 'TOPLAM', '', '', '', rows.length + ' madde', total, total ? fmtMin(total) : '', '', '', '', '' ]);
  downloadCsv(out, 'is-takip-tamamlanan-' + todayKey() + '.csv');
  toast(rows.length + ' satır CSV olarak indirildi.');
}
function exportAllCsv(){
  var out = [[ 'Proje','Proje durumu','İş','İş durumu','Madde','Durum','Oluşturma','Tamamlanma','Süre (dk)','Süre','Öncelik','Son tarih','Gecikme (gün)','Not' ]];
  allItems().forEach(function(x){
    var di = dueInfo(x.it.due, x.it.done);
    out.push([
      x.p.title, x.p.archived ? 'arşiv' : 'aktif',
      x.t.title, x.t.archived ? 'arşiv' : (TSTATUS.filter(function(s){ return s[0] === (x.t.status || 'todo'); })[0] || ['','?'])[1],
      x.it.text,
      x.it.archived ? 'arşiv' : (x.it.done ? 'tamamlandı' : 'açık'),
      x.it.createdAt ? new Date(x.it.createdAt).toLocaleString('tr-TR') : '',
      x.it.doneAt ? new Date(x.it.doneAt).toLocaleString('tr-TR') : '',
      x.it.minutes || '', x.it.minutes ? fmtMin(x.it.minutes) : '',
      PRIO[x.it.priority || 0] || '', isDayKey(x.it.due) ? x.it.due : '',
      (di && di.overdue) ? -di.days : '',
      x.it.note || ''
    ]);
  });
  downloadCsv(out, 'is-takip-tum-maddeler-' + todayKey() + '.csv');
  toast((out.length - 1) + ' satır CSV olarak indirildi.');
}
function printTimesheet(rows, rangeLabel){
  var sheet = clear(document.getElementById('printSheet'));
  var list = rows.slice();
  var label = rangeLabel;
  if(!label){
    var n = new Date();
    var from = new Date(n.getFullYear(), n.getMonth(), 1).getTime(), to = new Date(n.getFullYear(), n.getMonth() + 1, 0).getTime() + 86400000 - 1;
    list = list.filter(function(x){ return x.it.doneAt && x.it.doneAt >= from && x.it.doneAt <= to; });
    label = MONTHS[n.getMonth()] + ' ' + n.getFullYear();
  }
  var proj = dashFilter ? (findProject(dashFilter) || {}).title : 'Tüm projeler';
  sheet.appendChild(el('h2', { text:'İş Takip — Puantaj' }));
  sheet.appendChild(el('div', { text:'Dönem: ' + label + '  •  Proje: ' + proj + '  •  Çıktı: ' + fmt(Date.now()) }));

  var byDay = {};
  list.forEach(function(x){ if(!x.it.doneAt) return; var k = dayKey(x.it.doneAt); (byDay[k] = byDay[k] || []).push(x); });
  var keys = Object.keys(byDay).sort();
  var grand = 0, gcount = 0;
  var tb = el('tbody');
  keys.forEach(function(k){
    var dayRows = byDay[k].sort(function(a, b){ return a.it.doneAt - b.it.doneAt; });
    var dm = 0;
    dayRows.forEach(function(x, i){
      dm += x.it.minutes || 0;
      tb.appendChild(el('tr', { class:'pbrk' }, [
        el('td', { text: i === 0 ? fmtDay(k) : '' }),
        el('td', { text: fmtTime(x.it.doneAt) }),
        el('td', { text: x.p.title }),
        el('td', { text: x.t.title }),
        el('td', { text: x.it.text }),
        el('td', { text: x.it.minutes ? fmtMin(x.it.minutes) : '—' })
      ]));
    });
    grand += dm; gcount += dayRows.length;
    tb.appendChild(el('tr', null, [
      el('td', { text:'' }), el('td', { text:'' }), el('td', { text:'' }), el('td', { text:'' }),
      el('td', { text: dayRows.length + ' madde — gün toplamı' }),
      el('td', { text: dm ? fmtMin(dm) : '—' })
    ]));
  });
  if(!keys.length){
    sheet.appendChild(el('div', { text:'Bu dönemde tamamlanmış kayıt yok.' }));
  } else {
    sheet.appendChild(el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Gün' }), el('th', { text:'Saat' }), el('th', { text:'Proje' }), el('th', { text:'İş' }), el('th', { text:'Yapılan' }), el('th', { text:'Süre' }) ]) ]),
      tb,
      el('tfoot', null, [ el('tr', null, [
        el('td', { text:'TOPLAM' }), el('td', { text:'' }), el('td', { text:'' }), el('td', { text:'' }),
        el('td', { text: gcount + ' madde / ' + keys.length + ' gün' }),
        el('td', { text: grand ? fmtMin(grand) + ' (' + fmtHours(grand) + ' sa)' : '—' })
      ]) ])
    ]));
  }
  var L = leaveData();
  sheet.appendChild(el('div', { style:'margin-top:10px', text:'Kazanılan izin: ' + fmtDays(leaveEarned()) + '  •  Kullanılan: ' + fmtDays(leaveUsed()) + '  •  Kalan: ' + fmtDays(leaveTotal()) }));
  var lk = Object.keys(L.days).sort();
  if(lk.length){
    sheet.appendChild(el('div', { style:'margin-top:4px', text:'Fazla çalışılan günler: ' + lk.map(function(k){ return k + ' (+' + fmtNum(L.days[k].amount) + ')'; }).join(', ') }));
  }
  setTimeout(function(){ window.print(); }, 60);
}
/* --- Hatırlatıcı sekmesi ------------------------------------------------- */
function renderAlarms(){
  var root = clear(document.getElementById('alarmView'));
  lastRenderedAlarmKey = dueAlarms().map(function(a){ return a.id + ':' + a.at; }).join('|');
  var text = el('input', { type:'text', maxlength:'300', autocomplete:'off', placeholder:'Neyi hatırlatayım? (örn. Müşteriyi ara)', 'aria-label':'Hatırlatma notu', 'data-key':'alarm' });
  var when = dtInput({ 'aria-label':'Hatırlatma zamanı' });
  when.value = defaultAlarmValue(60);
  var err = el('span', { class:'err' });

  if(notifyOK()){
    var perm = Notification.permission, nb;
    if(perm === 'granted'){
      nb = [ el('span', { text:'🔔 Bildirimler açık' }), el('span', { class:'nsub', text:'Zamanı gelince, uygulama arka planda açıkken bilgisayar/telefon bildirimi gelir. Uygulama tamamen kapalıysa bildirim gelmez; açtığınızda üstte uyarı çıkar.' }) ];
    } else if(perm === 'denied'){
      nb = [ el('span', { text:'🔕 Bildirimler engelli' }), el('span', { class:'nsub', text:'Tarayıcı bu siteye bildirimi engellemiş. Adres çubuğundaki 🔒 simgesi → Bildirimler → İzin ver, sonra sayfayı yenileyin.' }) ];
    } else {
      nb = [ el('button', { type:'button', class:'primary small', text:'🔔 Bildirimleri aç', onclick:function(){
        try { var r = Notification.requestPermission(function(){ render(); }); if(r && r.then) r.then(function(){ render(); }); } catch(e){ render(); }
      } }), el('span', { class:'nsub', text:'Hatırlatma zamanı gelince sistem bildirimi göndermek için izin gerekir.' }) ];
    }
    root.appendChild(el('div', { class:'notebar' }, nb));
  }
  root.appendChild(el('div', { class:'panel' }, [
    el('h2', { text:'Yeni hatırlatıcı' }),
    el('form', { class:'aform', onsubmit:function(e){
      e.preventDefault();
      var t = text.value.trim(), ts = parseWhen(when.value);
      if(!t){ err.textContent = 'Bir not yazın.'; return; }
      if(ts === null){ err.textContent = 'Geçerli bir tarih ve saat girin.'; return; }
      if(ts <= Date.now()){ err.textContent = 'Gelecekte bir zaman girin.'; return; }
      addAlarm(t, ts);
    } }, [ text, when, el('button', { type:'submit', class:'primary', text:'Ekle' }), err ])
  ]));

  var list = alarmList().slice().sort(function(a, b){ return a.at - b.at; });
  var now = Date.now();
  var panel = el('div', { class:'panel', style:'margin-top:14px' }, [ el('h2', { text:'Hatırlatıcılar (' + list.length + ')' }) ]);
  if(!list.length){
    panel.appendChild(el('div', { class:'empty', text:'Henüz hatırlatıcı yok. Zamanı gelince sayfanın en üstünde uyarı çıkar; Onayla derseniz silinir, Ertele derseniz yeni zaman girersiniz. Bir iş maddesinin ⋯ menüsünden de hatırlatıcı kurabilirsiniz.' }));
  } else {
    var ul = el('ul');
    list.forEach(function(a){
      var due = a.at <= now;
      if(editKey === 'a:' + a.id){
        var et = el('input', { type:'text', maxlength:'300', autocomplete:'off', 'data-edit':'1', 'aria-label':'Not' });
        et.value = a.text;
        var ew = dtInput({ 'aria-label':'Zaman' });
        ew.value = localInputValue(a.at);
        var eerr = el('span', { class:'err' });
        [et, ew].forEach(function(i){ i.addEventListener('keydown', escCancel); });
        ul.appendChild(el('li', { 'data-sid': a.id }, [
          el('form', { class:'aform', style:'flex:1 0 100%', onsubmit:function(e){
            e.preventDefault();
            var t = et.value.trim(), ts = parseWhen(ew.value);
            if(!t){ eerr.textContent = 'Bir not yazın.'; return; }
            if(ts === null){ eerr.textContent = 'Geçerli bir tarih ve saat girin.'; return; }
            editKey = null; setAlarm(a.id, t, ts);
          } }, [ et, ew, el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
            el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit }), eerr ])
        ]));
        return;
      }
      var refTxt = '';
      if(a.ref){
        var loc = a.ref.iid ? locateItem(a.ref.iid) : null;
        var pp = findProject(a.ref.pid);
        refTxt = loc ? (loc.p.title + ' › ' + loc.t.title) : (pp ? pp.title : 'bağlı kayıt silinmiş');
      }
      ul.appendChild(el('li', { class:'arow-item' + (due ? ' due' : ''), 'data-sid': a.id }, [
        el('span', { class:'txt rtxt', text:a.text }),
        refTxt ? el('span', { class:'linkchip', title:'Bağlı olduğu iş', text:'🔗 ' + snip(refTxt, 40) }) : null,
        el('span', { class:'created-tag atime', title:'Hatırlatma zamanı', text:(due ? '⏰ Zamanı geldi • ' : '') + fmt(a.at) }),

var searchQ = '', searchGroup = 'all', searchStatus = 'all', searchArchived = false;
var FOLDMAP = { 'ı':'i','İ':'i','ç':'c','Ç':'c','ğ':'g','Ğ':'g','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u','â':'a','Â':'a','î':'i','û':'u' };
function fold(x){
  x = str(x); var o = '';
  for(var i = 0; i < x.length; i++){
    var c = x.charAt(i), m = FOLDMAP[c];
    if(m){ o += m; continue; }
    var l = c.toLowerCase(); o += (l.length === 1 ? l : c);
  }
  return o;
}
function searchWords(q){ return fold(q).split(/\s+/).filter(Boolean); }
function matches(words, text){
  var f = fold(text);
  return words.every(function(w){ return f.indexOf(w) >= 0; });
}
function hl(text, words, maxLen){
  text = str(text);
  var f = fold(text), first = -1;
  words.forEach(function(w){ var i = f.indexOf(w); if(i >= 0 && (first < 0 || i < first)) first = i; });
  var start = 0, end = text.length, pre = '', post = '';
  if(maxLen && text.length > maxLen){
    start = Math.max(0, (first < 0 ? 0 : first) - 40);
    end = Math.min(text.length, start + maxLen);
    if(start > 0) pre = '…';
    if(end < text.length) post = '…';
  }
  var mask = new Array(end - start + 1).join('0').split('');
  words.forEach(function(w){
    var from = start;
    while(true){
      var i = f.indexOf(w, from);
      if(i < 0 || i >= end) break;
      for(var k = i; k < Math.min(end, i + w.length); k++) mask[k - start] = '1';
      from = i + Math.max(1, w.length);
    }
  });
  var frag = document.createDocumentFragment();
  if(pre) frag.appendChild(document.createTextNode(pre));
  var i2 = 0, seg = text.slice(start, end);
  while(i2 < seg.length){
    var on = mask[i2] === '1', j = i2;
    while(j < seg.length && (mask[j] === '1') === on) j++;
    var part = seg.slice(i2, j);
    if(on) frag.appendChild(el('mark', { class:'hl', text: part }));
    else frag.appendChild(document.createTextNode(part));
    i2 = j;
  }
  if(post) frag.appendChild(document.createTextNode(post));
  return frag;
}
function flashEl(node){
  if(!node) return;
  try { node.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){ node.scrollIntoView(); }
  node.classList.remove('flash'); void node.offsetWidth; node.classList.add('flash');
  setTimeout(function(){ node.classList.remove('flash'); }, 2300);
}
function findBySid(id){
  var all = document.querySelectorAll('[data-sid]');

}

function collectResults(words){
  var G = { proje:[], is:[], madde:[], hat:[], hafta:[], izin:[], alarm:[], not:[] };
  var wantOpen = searchStatus === 'open', wantDone = searchStatus === 'done';
  state.projects.forEach(function(p){
    if(p.archived && !searchArchived) return;
    if(matches(words, p.title + ' ' + (p.note || ''))){
      G.proje.push({ main:p.title, note:p.note, meta: p.tasks.length + ' iş' + (p.archived ? ' • arşiv' : ''), go:function(){ goTask(p.id); } });
    }
    remList(p).forEach(function(r){
      if(matches(words, r.text)) G.hat.push({ main:r.text, meta: p.title + (r.createdAt ? ' • ' + fmt(r.createdAt) : ''), go:function(){ goTask(r.id, p.id); } });
    });
    p.tasks.forEach(function(t){
      if(t.archived && !searchArchived) return;
      var tdone = taskIsDone(t);
      if(matches(words, t.title + ' ' + (t.note || '')) && !(wantOpen && tdone) && !(wantDone && !tdone)){
        G.is.push({ main:t.title, note:t.note,
          meta: p.title + ' • ' + (tdone ? 'tamamlandı' : (TSTATUS.filter(function(s){ return s[0] === (t.status || 'todo'); })[0] || ['','?'])[1]) +
                (isDayKey(t.due) ? ' • son tarih ' + t.due : '') + (t.archived ? ' • arşiv' : ''),
          go:function(){ goTask(t.id); } });
      }
      t.items.forEach(function(it){
        if(it.archived && !searchArchived) return;
        if(wantOpen && it.done) return;
        if(wantDone && !it.done) return;
        if(matches(words, it.text + ' ' + (it.note || ''))){
          G.madde.push({ main:it.text, note:it.note,
            meta: p.title + ' › ' + t.title + ' • ' + (it.done ? 'Tamamlandı' + (it.doneAt ? ' ' + fmt(it.doneAt) : '') : 'Açık') +
                  (isDayKey(it.due) ? ' • son tarih ' + it.due : '') + (it.minutes ? ' • ' + fmtMin(it.minutes) : '') + (it.archived ? ' • arşiv' : ''),
            go:function(){ goTask(it.id); } });
        }
      });
    });
  });
  var wl = {}; WSTATUS.forEach(function(o){ wl[o[0]] = o[1]; });
  Object.keys(state.weekly || {}).sort().reverse().forEach(function(wk){
    (state.weekly[wk] || []).forEach(function(it){
      if(matches(words, it.text + ' ' + (it.note || ''))){
        G.hafta.push({ main:it.text, note:it.note, meta: fmtDay(wk) + ' haftası • ' + (wl[it.status || 'planned'] || ''), go:function(){ goDay(wk, it.id); } });
      }
    });
  });
  alarmList().slice().sort(function(a, b){ return a.at - b.at; }).forEach(function(a){
    if(matches(words, a.text)){
      G.alarm.push({ main:a.text, meta: fmt(a.at) + (a.at <= Date.now() ? ' • zamanı geldi' : ''),
        go:function(){ switchTab('alarm'); flashEl(findBySid(a.id)); } });
    }
  });
  noteList().slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).forEach(function(n){
    if(!matches(words, n.title + ' ' + n.body)) return;
    G.not.push({ main: n.title || n.body, note: n.title ? n.body : null,
      meta: (n.title ? '' : 'Başlıksız not • ') + (n.updatedAt ? fmt(n.updatedAt) : ''),
      go:function(){ switchTab('notebook'); flashEl(findBySid(n.id)); } });
  });
  var L = leaveData();
  Object.keys(L.notes).sort().reverse().forEach(function(k){
    if(matches(words, L.notes[k] + ' ' + fmtDay(k))){
      G.izin.push({ main:L.notes[k], meta: fmtDay(k) + (L.days[k] ? ' • ' + (LEAVE_TYPES[L.days[k].type] || 'Fazla çalışma') : ''), go:function(){ goDay(k); } });
    }
  });
  L.ledger.forEach(function(e){
    if(e.note && matches(words, e.note)){
      G.izin.push({ main:e.note, meta: fmtDay(e.at) + ' • ' + (e.amount > 0 ? '+' : '') + fmtNum(e.amount) + ' gün', go:function(){ goDay(e.at); } });
    }
  });
  var all = [
    ['proje','📁 Projeler', G.proje], ['is','🗂 İşler', G.is], ['madde','✅ Maddeler', G.madde],
    ['not','📓 Not defteri', G.not],
    ['hat','📌 Hatırlatmalar', G.hat], ['alarm','⏰ Hatırlatıcılar', G.alarm],
    ['hafta','🗓 Haftalık plan', G.hafta], ['izin','★ İzin kayıtları', G.izin]
  ];
  return all.filter(function(g){ return searchGroup === 'all' || searchGroup === g[0]; });
}

  if(tab !== 'search') prevTab = tab;
  tab = 'search'; editKey = null; render();
  var i = document.getElementById('searchInput'); i.focus(); i.select();
}

/* --- genel çatı ---------------------------------------------------------- */
function updateStats(){
  var open = 0, done = 0;
  state.projects.forEach(function(p){ p.tasks.forEach(function(t){ t.items.forEach(function(i){
    if(i.archived) return;
    if(i.done) done++; else open++;
  }); }); });
  var over = dueItems().filter(function(x){ return dayDiff(x.due, todayKey()) < 0; }).length;
  document.getElementById('stats').textContent = open + ' açık • ' + done + ' tamamlandı' + (over ? ' • ' + over + ' geciken' : '');
}
var TABS = ['tasks','cal','dash','alarm','notebook','archive','search'];
function switchTab(t){
  if(t === tab) return;
  prevTab = tab; tab = t; editKey = null;
  render();
  if(t === 'search'){ var si = document.getElementById('searchInput'); si.focus(); si.select(); }
}
function render(focusKey){
  try { renderInner(focusKey); }
  catch(e){
    setNotice({ bad:true, sticky:true, text:'Ekran çizilirken bir hata oluştu: ' + errMsg(e) + ' — verileriniz bellekte duruyor, hemen yedek alın.',
      buttons:[ { label:'📤 Yedeği indir', primary:true, fn: downloadBackup } ] });
    try { console.error(e); } catch(e2){}
  }
}
function renderInner(focusKey){
  updateStats();
  TABS.forEach(function(k){ document.getElementById('tab-' + k).hidden = (k !== tab); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false');
  });
  if(tab === 'tasks') renderTasks();
  else if(tab === 'cal') renderCalendar();
  else if(tab === 'dash') renderDashboard();
  else if(tab === 'alarm') renderAlarms();
  else if(tab === 'notebook') renderNotebook();
  else if(tab === 'archive') renderArchive();
  else if(tab === 'search') renderSearch();
  renderAlarmBar();
  renderNotice();
  renderSides();

  var target = null;
  if(editKey){
    target = document.querySelector('[data-edit]');
    if(target){
      if(target.tagName === 'TEXTAREA'){ var n = target.value.length; target.setSelectionRange(n, n); }
      else if(target.select) target.select();
    }
  } else if(focusKey){
    target = document.querySelector('[data-key="' + focusKey + '"]');
  }
  if(target) target.focus();
}
/* ----------------------------------------------------------------- 6. AÇILIŞ */

/* tema: otomatik / açık / koyu */
var THEMES = [ ['auto','🌓 Otomatik'], ['light','☀ Açık'], ['dark','🌙 Koyu'] ];
function applyTheme(){
  var t = lsGet('is-takip-theme') || 'auto';
  document.documentElement.setAttribute('data-theme', t);
  var found = THEMES.filter(function(x){ return x[0] === t; })[0] || THEMES[0];
  ['themeBtn', 'themeBtn2'].forEach(function(id){
    var b = document.getElementById(id);
    b.textContent = found[1];
    b.setAttribute('aria-label', 'Görünüm: ' + found[1].replace(/^\S+\s/, ''));
  });
}
['themeBtn', 'themeBtn2'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(){
  var t = lsGet('is-takip-theme') || 'auto';
  var i = THEMES.findIndex(function(x){ return x[0] === t; });
  lsSet('is-takip-theme', THEMES[(i + 1) % THEMES.length][0]);
  applyTheme();
}); });

/* pencere genişliği eşiği geçince düzeni yeniden kur */
if(wideMQ){
  /* "change" olayı bazı ortamlarda gelmiyor; resize ile de yakalanır, iki kez çizilmez */
  var lastWide = isWide();
  var onWide = function(){ if(isWide() === lastWide) return; lastWide = isWide(); render(); updateBar(); };
  if(wideMQ.addEventListener) wideMQ.addEventListener('change', onWide);
  else if(wideMQ.addListener) wideMQ.addListener(onWide);
  window.addEventListener('resize', onWide);
}

/* sekmeler */
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
  b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
});
document.getElementById('tabs').addEventListener('keydown', function(e){
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var i = TABS.indexOf(tab);
  if(i < 0) return;
  e.preventDefault();
  var j = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
  switchTab(TABS[j]);
  var nb = document.getElementById('tabbtn-' + TABS[j]);
  if(nb) nb.focus();
});

/* proje ekleme */
document.getElementById('projectForm').addEventListener('submit', function(e){
  e.preventDefault();
  var inp = document.getElementById('projectInput');
  addProject(inp.value);
  inp.value = '';
});
/* sol menü: arama kutusu ve yeni proje */
document.getElementById('sideSearch').addEventListener('click', function(){ openSearch(); });
document.getElementById('sideAddProj').addEventListener('click', function(){
  sideProjAdd = !sideProjAdd; renderSideProjects();
  var i = document.querySelector('[data-key="side-proj"]'); if(i) i.focus();
});

/* arama */
document.getElementById('searchInput').addEventListener('input', function(e){ searchQ = e.target.value; renderSearch(); });
document.getElementById('searchInput').addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  e.preventDefault();
  if(searchQ){ searchQ = ''; renderSearch(); }
  else switchTab(prevTab && prevTab !== 'search' ? prevTab : 'tasks');
});
document.addEventListener('keydown', function(e){
  var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openSearch(); return; }
  if(e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); openSearch(); return; }
  /* takvimde ok tuşlarıyla gezinme */
  if(t && t.classList && t.classList.contains('day') && e.key.indexOf('Arrow') === 0){
    var step = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' ? -7 : 7;
    e.preventDefault();
    var k = shiftKey(t.getAttribute('data-day'), step), d = keyToDate(k);
    selDay = k; calYear = d.getFullYear(); calMonth = d.getMonth(); weekKey = mondayKey(d.getTime());
    render();
    var nb = document.querySelector('[data-day="' + k + '"]');
    if(nb) nb.focus();
  }
});
/* açık satır menüsünü dışarı tıklayınca kapat */
document.addEventListener('click', function(e){
  Array.prototype.forEach.call(document.querySelectorAll('details.rowmenu[open]'), function(d){
    if(!d.contains(e.target)) d.removeAttribute('open');
  });
}, true);

/* içe aktarma (dosya seçici desteklenmeyen tarayıcılar ve Drive kipi) */
document.getElementById('importFileInput').addEventListener('change', function(e){
  var file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  readJsonFileObject(file).then(function(data){
    applyImported(data, '"' + file.name + '"');
  }).catch(function(err){ toast(errMsg(err), { bad:true }); });
});

/* kaydetme güvenliği: sayfa gizlenirken / kapanırken bekleyen yazmaları boşalt */
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushSaves();
  else { alarmTick(); driveSync(false); }
});
window.addEventListener('beforeunload', function(e){
  var unsaved = driveDirty() || (canWrite && dirty) || (!canWrite && !drive.on && dirty);
  if(unsaved){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('error', function(ev){
  if(notice && notice.bad) return;
  setNotice({ bad:true, sticky:true, text:'Beklenmeyen bir hata oluştu: ' + (ev && ev.message ? ev.message : 'bilinmiyor') + ' — verileriniz bellekte duruyor, yedek almanız önerilir.',
    buttons:[ { label:'📤 Yedeği indir', primary:true, fn: downloadBackup } ] });
});

setInterval(alarmTick, 15000);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* başlangıç durumu */
var now0 = new Date();
calYear = now0.getFullYear(); calMonth = now0.getMonth(); selDay = dayKey(now0.getTime());
weekKey = mondayKey(now0.getTime());
applyTheme();
render();
updateBar();

/* Drive kullanılıyorsa Google giriş betiğini hemen yüklemeye başla:
   otomatik bağlantı, yerel kopyanın okunmasını beklemesin. */
if(driveFlag() && driveClientId()) loadGis().catch(function(){});

/* Önce bu cihazdaki kopya (anında açılış ve çökme sigortası), sonra bağlı
   dosya / Drive. IndexedDB yavaşlar ya da engellenirse açılış takılmasın
   diye okuma en fazla 2,5 saniye bekletilir. */
Promise.race([
  loadSnapshot().catch(function(){ return null; }),
  new Promise(function(res){ setTimeout(function(){ res(null); }, 2500); })
]).then(function(snap){
  if(snap && !isEmptyState(snap.data) && isEmptyState(state)){
    state = snap.data;
    dirty = !!snap.dirty;
    render();
    if(snap.dirty) announce('Bu cihazda saklanan son kopya yüklendi.');
  }
}).catch(function(){}).then(function(){
  booted = true;
  /* İkisi birbirinden bağımsız başlar: biri hata verse de diğeri çalışır. */
  try { driveInit(); } catch(e){ drive.err = 'Drive başlatılamadı: ' + errMsg(e); updateBar(); }
  try { initFileHandle(); } catch(e){ updateBar(); }
});
})();
</script>
</body>
