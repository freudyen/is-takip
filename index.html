<!doctype html>
<html lang="tr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Takip</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b6cf6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --sub:#f7f8fa; --text:#1f2430; --muted:#5d6471; --line:#e3e6ec;
    --accent:#3b6cf6; --accent-text:#fff; --ok:#15803d; --ok-bg:#e8f6ee; --danger:#c81e1e; --warn:#92400e;
    --mark:#fde68a; --mark-text:#1f2430; --alarm-bg:#fff4d6; --shadow:0 8px 24px rgba(16,20,30,.14);
    --p1:#b45309; --p1-bg:#fef3c7; --p2:#b91c1c; --p2-bg:#fee2e2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161b; --card:#1d2027; --sub:#23272f; --text:#e8eaef; --muted:#a1a9b8; --line:#2c303a;
      --accent:#6b8cff; --accent-text:#0e1220; --ok:#4ade80; --ok-bg:#16281d; --danger:#f87171; --warn:#fbbf24;
      --mark:#854d0e; --mark-text:#fff7d6; --alarm-bg:#3a2c0a; --shadow:0 8px 24px rgba(0,0,0,.5);
      --p1:#fbbf24; --p1-bg:#3a2c0a; --p2:#f87171; --p2-bg:#3b1718;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --card:#1d2027; --sub:#23272f; --text:#e8eaef; --muted:#a1a9b8; --line:#2c303a;
    --accent:#6b8cff; --accent-text:#0e1220; --ok:#4ade80; --ok-bg:#16281d; --danger:#f87171; --warn:#fbbf24;
    --mark:#854d0e; --mark-text:#fff7d6; --alarm-bg:#3a2c0a; --shadow:0 8px 24px rgba(0,0,0,.5);
    --p1:#fbbf24; --p1-bg:#3a2c0a; --p2:#f87171; --p2-bg:#3b1718;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1150px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{margin:0;font-size:24px}
  .htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stats{color:var(--muted);font-size:14px}
  .savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}
  .savebar .status{flex:1;min-width:180px}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--danger)}
  .fixbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--alarm-bg);border:2px solid var(--warn)}
  .fixbar .ftxt{flex:1 1 240px}
  .fixbar.bad{background:var(--p2-bg);border-color:var(--danger)}

  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tabs button:hover{border-bottom-color:var(--accent)}
  .tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

  .newproject{display:flex;gap:8px;margin-bottom:18px}
  input[type=text],input[type=search],select{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
  .newproject input[type=text]{flex:1}
  input[type=date],input[type=datetime-local],input[type=number],textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;min-height:34px}
  button:hover{border-color:var(--accent)}
  button:focus-visible,summary:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}
  button:disabled:hover{border-color:var(--line)}
  .primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
  .danger{color:var(--danger);border-color:var(--danger)}
  .layout{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  .col{display:flex;flex-direction:column;gap:16px}
  .project{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .phead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .phead h3{margin:0;font-size:18px;flex:1;min-width:120px;word-break:break-word}
  .task{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .thead{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .thead h4{margin:0;font-size:15px;flex:1;min-width:120px;word-break:break-word}
  .thead h4::before{content:"▸ ";color:var(--muted)}
  .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:20px;padding:2px 8px;white-space:nowrap}
  .icon{padding:5px 9px;font-size:13px;color:var(--muted)}
  .icon.del:hover{color:var(--danger);border-color:var(--danger)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  li:first-child{border-top:0}
  li .txt{flex:1 1 160px;word-break:break-word}
  li .editform,li .noteform,li .inlineform{flex:1 0 100%}
  .done-btn{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600;font-size:13px;padding:6px 10px;white-space:nowrap}
  .done-btn:hover{border-color:var(--ok)}
  .add{display:flex;gap:8px;margin-top:8px}
  .add input{padding:9px 11px;flex:1}
  .addtask{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}
  .done-card .txt{text-decoration:line-through;color:var(--muted)}
  .tag{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 6px;white-space:nowrap}
  .created-tag{font-size:11px;color:var(--muted);background:transparent;padding:1px 4px;white-space:nowrap}
  .small{font-size:13px;padding:5px 9px}
  .editform{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
  .editform input[type=text]{padding:7px 10px;min-width:140px;flex:1}
  .editform .err,.inlineform .err{flex:1 0 100%;color:var(--danger);font-size:13px}
  .editform .err:empty,.inlineform .err:empty{display:none}
  .dur{font-size:12px;padding:4px 8px;color:var(--muted);white-space:nowrap}
  .dur.set{background:var(--sub);color:var(--text);font-weight:600;border-color:var(--accent)}

  /* Öncelik ve son tarih */
  .prio{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .prio.p1{color:var(--p1);background:var(--p1-bg)}
  .prio.p2{color:var(--p2);background:var(--p2-bg)}
  .due{font-size:12px;border-radius:6px;padding:2px 7px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .due.soon{color:var(--warn);border-color:var(--warn)}
  .due.over{color:var(--danger);border-color:var(--danger);font-weight:600}
  .due.ok{color:var(--ok)}
  .linkchip{font-size:12px;border-radius:6px;padding:2px 7px;white-space:nowrap;background:var(--bg);color:var(--accent);border:1px solid var(--line)}

  /* Satır işlemleri menüsü */
  .rowmenu{position:relative;flex:0 0 auto}
  .rowmenu > summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:32px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:15px;background:var(--card)}
  .rowmenu > summary::-webkit-details-marker{display:none}
  .rowmenu > summary:hover{border-color:var(--accent)}
  .rowmenu[open] > summary{border-color:var(--accent);color:var(--accent)}
  .rowmenu .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:40;min-width:208px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
  .rowmenu .menu button{border:0;background:none;text-align:left;padding:9px 10px;min-height:40px;border-radius:7px;color:var(--text)}
  .rowmenu .menu button:hover{background:var(--sub)}
  .rowmenu .menu button.del{color:var(--danger)}
  .rowmenu .menu .mrow{display:flex;align-items:center;gap:6px;padding:4px 10px}
  .rowmenu .menu .mrow label{font-size:12px;color:var(--muted);flex:0 0 auto}
  .rowmenu .menu .mrow select,.rowmenu .menu .mrow input{flex:1;min-width:0;padding:6px 8px;font-size:13px}
  .rowmenu .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

  .note{white-space:pre-wrap;word-break:break-word;flex:1 0 100%;font-size:13px;color:var(--muted);background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:6px 10px;margin:4px 0}
  .noteform{display:flex;flex-direction:column;gap:6px;margin:4px 0}
  .noteform textarea{width:100%}
  .noteactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .noteactions .hintx,.remform .hintx{font-size:12px;color:var(--muted)}
  .inlineform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px;margin:4px 0}
  .inlineform .lbl{font-size:12px;color:var(--muted);flex:0 0 auto}
  .inlineform input[type=text]{flex:1 1 180px}

  .calwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  @media (max-width:860px){.calwrap{grid-template-columns:1fr}}
  .calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .calhead h3{margin:0;font-size:18px;flex:1;text-align:center;min-width:140px}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
  .blank{min-height:64px}
  .day{min-height:64px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:flex-start;background:var(--card)}
  .day .num{font-weight:600;font-size:14px}
  .day .chips{display:flex;flex-wrap:wrap;gap:3px}
  .day .badge{font-size:11px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:1px 5px;font-weight:600}
  .day .dmark{font-size:11px;border-radius:10px;padding:1px 5px;font-weight:600;background:var(--bg);color:var(--muted)}
  .day .dmark.over{color:var(--danger)}
  .day .dmark.al{color:var(--warn)}
  .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .day.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .day.sel .badge,.day.sel .dmark,.day.sel .xmark{background:var(--accent-text);color:var(--accent)}
  @media (max-width:520px){.day,.blank{min-height:52px;padding:4px}}
  .daytitle{margin:0 0 4px;font-size:18px}
  .daysum{color:var(--muted);font-size:14px;margin-bottom:12px}
  .day .xmark{font-size:11px;background:var(--bg);color:var(--warn);border-radius:10px;padding:1px 5px;font-weight:600}

  .dashbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile .v{font-size:26px;font-weight:700;line-height:1.2}
  .tile .l{font-size:13px;color:var(--muted)}
  .tile.alert .v{color:var(--danger)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}
  .panel h2{margin-bottom:8px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:140px}
  .chart .cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .chart .bar{width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0}
  .chart .bar.zero{background:var(--line)}
  .chart .val{font-size:11px;color:var(--muted);height:16px;line-height:16px}
  .chart .lbl{font-size:11px;color:var(--muted);margin-top:4px}
  .srdesc{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
  thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  td.nw{white-space:nowrap}
  tfoot td{font-weight:700;background:var(--sub)}
  .rowacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
  .weekly{margin-top:28px}
  .wtxt.st-done{text-decoration:line-through;color:var(--ok)}
  .wtxt.st-failed,.wtxt.st-cancelled{text-decoration:line-through;color:var(--muted)}
  .wtxt.st-postponed{color:var(--warn)}
  .wsel{flex:0 0 auto;padding:6px 8px;font-size:13px}
  .wsel.st-done{color:var(--ok);border-color:var(--ok)}
  .wsel.st-postponed{color:var(--warn);border-color:var(--warn)}
  .wsel.st-failed{color:var(--danger);border-color:var(--danger)}
  .wsel.st-cancelled{color:var(--muted)}
  .tsel{flex:0 0 auto;padding:5px 8px;font-size:12px}
  .tsel.st-doing{color:var(--accent);border-color:var(--accent)}
  .tsel.st-blocked{color:var(--danger);border-color:var(--danger)}
  .manual summary{cursor:pointer;font-weight:600;color:var(--text);list-style:none;display:flex;align-items:center;gap:8px}
  .manual summary::-webkit-details-marker{display:none}
  .manual summary::before{content:"▸";color:var(--muted)}
  .manual[open] summary::before{content:"▾"}
  .manual{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
  .mfield{display:flex;flex-direction:column;gap:4px;min-width:0}
  .mfield.wide{grid-column:1/-1}
  .mfield label{font-size:12px;color:var(--muted)}
  .mfield select,.mfield input,.mfield textarea{width:100%;padding:9px 11px}
  .mactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .mmsg{font-size:13px}
  .mmsg.ok{color:var(--ok)} .mmsg.err{color:var(--danger)}
  .xbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:14px}
  .xbox select,.xbox input[type=number]{flex:0 0 auto;padding:6px 8px;font-size:13px}
  .xbox input[type=text]{flex:1 1 180px;padding:6px 8px;font-size:13px}
  .leavetop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .leaveval{font-size:30px;font-weight:700;line-height:1.2}
  .lrow .dt{flex:0 0 auto;min-width:150px}
  .lrow input[type=text]{flex:1 1 200px;padding:7px 10px}
  .leaveuse{align-items:center;flex-wrap:wrap}
  .leaveuse input[type=text]{flex:0 0 90px;padding:8px 10px}
  .ledger li{font-size:14px}
  .ledger .amt{font-weight:700;flex:0 0 auto;min-width:72px}
  .ledger .amt.plus{color:var(--ok)}
  .ledger .amt.minus{color:var(--danger)}
  .reminders{background:var(--sub);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
  .reminders summary,.agenda summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .reminders summary::-webkit-details-marker,.agenda summary::-webkit-details-marker{display:none}
  .reminders summary::before,.agenda summary::before{content:"▸";font-size:11px}
  .reminders[open] summary::before,.agenda[open] summary::before{content:"▾"}
  .reminders ul{margin-top:6px}
  .reminders li{font-size:14px}
  .agenda{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:16px}
  .agenda.clean{border-left-color:var(--ok)}
  .agenda summary{font-size:14px;color:var(--text)}
  .agenda .gsec{margin-top:8px}
  .agenda .gsec h4{margin:0 0 2px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .hint{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
  .rtxt{white-space:pre-wrap}
  .remform{display:flex;flex-direction:column;gap:6px;margin-top:8px;flex:1 0 100%}
  .remform textarea{width:100%;min-height:64px}
  .remform .rbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .searchbox{margin-bottom:10px}
  .searchbox input{width:100%;padding:12px 14px;font-size:16px;border-radius:10px}
  .sfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
  .sfilters select{padding:6px 8px;font-size:13px}
  .sfilters label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .sgroup{margin-bottom:18px}
  .sgroup h3{margin:0 0 8px;font-size:15px}
  .sgroup h3 .count{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .sres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .sres li{display:block;padding:0;border:0}
  .sres button.sitem{display:block;width:100%;text-align:left;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;cursor:pointer}
  .sres button.sitem:hover,.sres button.sitem:focus-visible{border-color:var(--accent)}
  .sres .smain{display:block;word-break:break-word;white-space:pre-wrap}
  .sres .smeta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .sres .snote{display:block;font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--accent);padding-left:8px}
  mark.hl{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 1px}
  @keyframes flashbg{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
  .flash{animation:flashbg 2.2s ease-out;border-radius:8px}
  .alarmbar{position:sticky;top:0;z-index:60;display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .alarmbar:empty{display:none}
  .alarm{background:var(--alarm-bg);border:2px solid var(--warn);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
  .alarm .arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .alarm .atext{flex:1 1 200px;font-weight:600;white-space:pre-wrap;word-break:break-word}
  .alarm .awhen{font-size:12px;color:var(--muted)}
  .alarm form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .alarm .err,.aform .err{flex:1 0 100%;color:var(--danger);font-size:13px}
  .alarm .err:empty,.aform .err:empty{display:none}
  .aform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
  .aform input[type=text]{flex:1 1 220px;padding:9px 11px}
  .arow-item.due .atime{color:var(--danger);font-weight:600}
  .notebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}

  .toast .ttxt{flex:1;word-break:break-word}

  /* Arşiv & çöp */
  .arcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* Yazdırma */
  #printSheet{display:none}
  .psheet h2{color:var(--text)}
  @media print{
    :root{--bg:#fff;--card:#fff;--sub:#fff;--text:#000;--muted:#444;--line:#999}
    body{background:#fff}

  @media (prefers-reduced-motion: reduce){
    .flash{animation:none;box-shadow:0 0 0 3px var(--accent)}
  }
</style>

<script>
/* ============================================================================
   İş Takip — tek dosyalık çalışma takibi
   Bölümler:  1) çekirdek yardımcılar   2) veri modeli + göç (migration)
              3) saklama (yerel kopya / JSON dosyası / Google Drive)
              4) iş mantığı            5) arayüz                6) açılış
   Veri dosyası biçimi geriye dönük uyumludur: eski sürümle yazılmış
   is-takip-data.json dosyaları kayıpsız okunur ve sürüm 2'ye taşınır.
   ========================================================================= */
(function(){
'use strict';

/* ---------------------------------------------------------------- 1. ÇEKİRDEK */

var SCHEMA = 2;
var TRASH_DAYS = 30;          /* çöp kutusunda saklama süresi */
var DONE_LIMIT = 40;          /* "Tamamlandı" sütununda gösterilen madde sayısı */

var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
var PRIO = { 0:'', 1:'Önemli', 2:'Acil' };
var TSTATUS = [ ['todo','Başlamadı'], ['doing','Devam ediyor'], ['blocked','Bloklu'] ];
var WSTATUS = [ ['planned','Bekliyor'], ['done','Tamamlandı'], ['postponed','Ertelendi'], ['failed','Yapılamadı'], ['cancelled','İptal oldu'] ];
var LEAVE_TYPES = { weekend:'Hafta sonu çalışması', holiday:'Resmi tatil çalışması' };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function round2(n){ return Math.round(n * 100) / 100; }
function num(v, d){ var n = +v; return isFinite(n) ? n : d; }
function str(v){ return typeof v === 'string' ? v : (v == null ? '' : String(v)); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function snip(x, n){ x = str(x).replace(/\s+/g, ' ').trim(); return x.length > n ? x.slice(0, n - 1) + '…' : x; }

/* 2000 öncesi değerler gerçek bir tarih değil (eski kayıtlarda 0/1 gibi
   kalıntılar var); bunları "yok" sayarak 01.01.1970 görüntüsünü önler. */
function okTime(v){ var n = num(v, 0); return n >= 946684800000 ? n : null; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function keyToDate(k){ var a = str(k).split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
function isDayKey(k){ return /^\d{4}-\d{2}-\d{2}$/.test(str(k)) && !isNaN(keyToDate(k).getTime()); }
function todayKey(){ return dayKey(Date.now()); }
function shiftKey(key, days){ var d = keyToDate(key); d.setDate(d.getDate() + days); return dayKey(d.getTime()); }
function mondayKey(ts){
  var d = new Date(ts);
  d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
  return dayKey(d.getTime());
}
function dayDiff(a, b){ return Math.round((keyToDate(a).getTime() - keyToDate(b).getTime()) / 86400000); }

function fmt(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }) : ''; }
function fmtDay(k){ return keyToDate(k).toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function fmtDayShort(k){ return keyToDate(k).toLocaleDateString('tr-TR', { day:'numeric', month:'short' }); }
function fmtMin(m){
  var h = Math.floor(m / 60), r = m % 60;
  if(h && r) return h + ' sa ' + r + ' dk';
  if(h) return h + ' sa';
  return r + ' dk';
}
function fmtHours(m){ return String(Math.round(m / 6) / 10).replace('.', ','); }
function fmtDays(n){ return String(round2(n)).replace('.', ',') + ' gün'; }
function fmtNum(n){ return String(round2(n)).replace('.', ','); }
function localInputValue(ts){
  var d = new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function parseWhen(v){ var t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; }

/* Son tarih etiketi: bugüne göre okunabilir metin + durum sınıfı */
function dueInfo(due, done){
  if(!isDayKey(due)) return null;
  var d = dayDiff(due, todayKey());
  var label;
  if(d === 0) label = 'Bugün';
  else if(d === 1) label = 'Yarın';
  else if(d === -1) label = '1 gün gecikti';
  else if(d < -1) label = (-d) + ' gün gecikti';
  else if(d <= 7) label = d + ' gün kaldı';
  else label = fmtDayShort(due);
  var cls = done ? 'ok' : (d < 0 ? 'over' : (d <= 2 ? 'soon' : ''));
  return { days:d, label:label, cls:cls, overdue: !done && d < 0, today: d === 0 };
}

/* Süre metni → dakika. '4 saat', '90 dk', '1 sa 30 dk', '1:30', '1,5' */
function parseDuration(s){
  s = str(s).toLowerCase().replace(/,/g, '.').trim();
  if(!s) return 'empty';
  function fin(n){ return (n > 0 && n <= 60000) ? n : null; }
  var m = s.match(/^(\d+):(\d{1,2})$/);
  if(m){ if(+m[2] > 59) return null; return fin(+m[1] * 60 + +m[2]); }
  if(/^\d+(\.\d+)?$/.test(s)) return fin(Math.round(parseFloat(s) * 60));
  var re = /(\d+(?:\.\d+)?)\s*(saat|sa|s|h|hr|hrs|hours?|dakika|dk|d|m|min|mins|minutes?)(?![a-zçğıöşü])/g;
  var total = 0, found = false, x;
  while((x = re.exec(s)) !== null){
    found = true;
    var v = parseFloat(x[1]);
    total += /^(saat|sa|s|h|hr|hrs|hour|hours)$/.test(x[2]) ? v * 60 : v;
  }
  if(!found) return null;
  var rest = s.replace(re, '').replace(/çalışıldı|çalışma|harcandı|ve|[\s+,()]/g, '');
  if(rest) return null;
  return fin(Math.round(total));
}

/* DOM kurucu: null / undefined / false nitelikler atlanır (eski sürümde
   setAttribute(k, null) niteliği "null" değeriyle eklediği için
   disabled:null düğmeyi yanlışlıkla devre dışı bırakıyordu). */
function el(tag, props, children){
  var n = document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v = props[k];
      if(v === null || v === undefined || v === false) return;
      if(k === 'text') n.textContent = v;
      else if(k === 'class') n.className = v;
      else if(k === 'html') n.innerHTML = '';
      else if(k.indexOf('on') === 0 && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if(v === true) n.setAttribute(k, '');
      else n.setAttribute(k, v);
    });
  }
  (children || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); return node; }

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
function errMsg(e){ return e && e.message ? e.message : String(e); }

/* Bildirim çubuğu (geri alma düğmesiyle) */
var toastTimers = [];
function toast(msg, opts){
  opts = opts || {};
  var box = document.getElementById('toasts');
  var node = el('div', { class:'toast' + (opts.bad ? ' err' : ''), role:'status' }, [ el('span', { class:'ttxt', text:msg }) ]);
  var life = opts.ms || (opts.action ? 9000 : 4500);
  function close(){ if(node.parentNode) node.parentNode.removeChild(node); }
  if(opts.action){
    node.appendChild(el('button', { type:'button', class:'small primary', text: opts.actionLabel || 'Geri al',
      onclick:function(){ close(); opts.action(); } }));
  }
  node.appendChild(el('button', { type:'button', class:'small', text:'✕', 'aria-label':'Kapat', onclick: close }));
  box.appendChild(node);
  var t = setTimeout(close, life);
  toastTimers.push(t);
  if(toastTimers.length > 20) clearTimeout(toastTimers.shift());
  return close;
}
function announce(msg){ var n = document.getElementById('srLive'); if(n) n.textContent = msg; }

/* Üstteki kalıcı uyarı bandı (göç bilgisi, kurtarma teklifi, çökme uyarısı) */
var notice = null;
function setNotice(n){ notice = n; renderNotice(); }
function renderNotice(){
  var bar = document.getElementById('noticeBar');
  clear(bar);
  if(!notice){ bar.hidden = true; return; }
  bar.hidden = false;
  bar.className = 'fixbar' + (notice.bad ? ' bad' : '');
  bar.appendChild(el('span', { class:'ftxt', text: notice.text }));
  (notice.buttons || []).forEach(function(b){
    bar.appendChild(el('button', { class:'small' + (b.primary ? ' primary' : ''), text:b.label, onclick:b.fn }));
  });
  if(!notice.sticky){
    bar.appendChild(el('button', { class:'small', text:'Kapat', onclick:function(){ setNotice(null); } }));
  }
}

/* ------------------------------------------------- 2. VERİ MODELİ + GÖÇ (v1→v2)
   Eski dosyalarda bulunmayan alanlar tamamlanır, tanınmayan alanlar aynen
   korunur, dönüşüm tekrar tekrar çalıştırılmaya uygundur (idempotent). */

var migrationInfo = null;     /* { from, projects, tasks, items } */

function emptyState(){
  return { schemaVersion: SCHEMA, projects: [], weekly: {}, leave: { days:{}, notes:{}, ledger:[], adjust:0 }, alarms: [], notebook: [], trash: [] };
}

function normItem(raw){
  if(!raw || typeof raw !== 'object') return null;
  var o = Object.assign({}, raw);
  o.id = str(o.id) || uid();
  o.text = str(o.text != null ? o.text : o.title);
  o.done = !!o.done;
  o.createdAt = okTime(o.createdAt);
  o.doneAt = o.done ? (okTime(o.doneAt) || o.createdAt || Date.now()) : okTime(o.doneAt);
  var mn = num(o.minutes, 0);
  if(mn > 0) o.minutes = Math.round(mn); else delete o.minutes;
  if(str(o.note).trim()) o.note = str(o.note); else delete o.note;
  o.priority = [0,1,2].indexOf(num(o.priority, 0)) >= 0 ? num(o.priority, 0) : 0;
  if(!isDayKey(o.due)) delete o.due;
  o.archived = num(o.archived, 0) || null;
  return o;
}
function normTask(raw){
  if(!raw || typeof raw !== 'object') return null;
  var o = Object.assign({}, raw);
  o.id = str(o.id) || uid();
  o.title = str(o.title != null ? o.title : o.text) || 'Adsız iş';
  o.createdAt = okTime(o.createdAt);
  o.items = (Array.isArray(o.items) ? o.items : []).map(normItem).filter(Boolean);
  if(str(o.note).trim()) o.note = str(o.note); else delete o.note;
  var st = str(o.status);
  o.status = TSTATUS.some(function(x){ return x[0] === st; }) ? st : 'todo';
  o.priority = [0,1,2].indexOf(num(o.priority, 0)) >= 0 ? num(o.priority, 0) : 0;
  if(!isDayKey(o.due)) delete o.due;
  o.archived = num(o.archived, 0) || null;
  return o;
}
function normProject(raw){
  if(!raw || typeof raw !== 'object') return null;
  var o = Object.assign({}, raw);
  o.id = str(o.id) || uid();
  o.title = str(o.title != null ? o.title : o.name) || 'Adsız proje';
  o.tasks = (Array.isArray(o.tasks) ? o.tasks : []).map(normTask).filter(Boolean);
  o.reminders = (Array.isArray(o.reminders) ? o.reminders : []).map(function(r){
    if(!r || typeof r !== 'object') return null;
    var x = Object.assign({}, r);
    x.id = str(x.id) || uid(); x.text = str(x.text);
    x.createdAt = okTime(x.createdAt);
    return x.text ? x : null;
  }).filter(Boolean);
  if(str(o.note).trim()) o.note = str(o.note); else delete o.note;
  o.archived = num(o.archived, 0) || null;
  return o;
}
function normWeekly(raw){
  var out = {};
  if(!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  Object.keys(raw).forEach(function(k){
    if(!isDayKey(k) || !Array.isArray(raw[k])) return;
    var list = raw[k].map(function(it){
      if(!it || typeof it !== 'object') return null;
      var x = Object.assign({}, it);
      x.id = str(x.id) || uid();
      x.text = str(x.text != null ? x.text : x.title);
      var st = str(x.status);
      x.status = WSTATUS.some(function(w){ return w[0] === st; }) ? st : 'planned';
      x.createdAt = okTime(x.createdAt);
      if(str(x.note).trim()) x.note = str(x.note); else delete x.note;
      if(!x.ref || typeof x.ref !== 'object') delete x.ref;
      return x.text ? x : null;
    }).filter(Boolean);
    if(list.length) out[k] = list;          /* boş hafta anahtarları temizlenir */
  });
  return out;
}
/* İzin: eski {days:{key:'weekend'}, adjust:n, notes:{}} biçimi defter modeline taşınır */
function normLeave(raw){
  var lv = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  var out = Object.assign({}, lv);
  var days = {};
  var src = (lv.days && typeof lv.days === 'object' && !Array.isArray(lv.days)) ? lv.days : {};
  Object.keys(src).forEach(function(k){
    if(!isDayKey(k)) return;
    var v = src[k], type, amount;
    if(typeof v === 'string'){ type = LEAVE_TYPES[v] ? v : 'weekend'; amount = 1; }
    else if(v && typeof v === 'object'){ type = LEAVE_TYPES[str(v.type)] ? str(v.type) : 'weekend'; amount = num(v.amount, 1); }
    else if(v){ type = 'weekend'; amount = 1; }
    else return;
    if(!(amount > 0)) amount = 1;
    days[k] = { type: type, amount: round2(amount) };
  });
  out.days = days;
  var notes = {};
  var ns = (lv.notes && typeof lv.notes === 'object' && !Array.isArray(lv.notes)) ? lv.notes : {};
  Object.keys(ns).forEach(function(k){ if(isDayKey(k) && str(ns[k]).trim()) notes[k] = str(ns[k]); });
  out.notes = notes;
  out.ledger = (Array.isArray(lv.ledger) ? lv.ledger : []).map(function(e){
    if(!e || typeof e !== 'object') return null;
    var x = Object.assign({}, e);
    x.id = str(x.id) || uid();
    x.amount = num(x.amount, 0);
    x.kind = (x.kind === 'used' || x.kind === 'adjust') ? x.kind : 'adjust';
    x.at = isDayKey(x.at) ? x.at : todayKey();
    x.createdAt = okTime(x.createdAt);
    if(str(x.note).trim()) x.note = str(x.note); else delete x.note;
    return x.amount ? x : null;
  }).filter(Boolean);
  /* eski tek sayılık "adjust" alanını bir defter kaydına çevir */
  var adj = num(lv.adjust, 0);
  if(adj){
    out.ledger.push({ id: uid(), kind:'adjust', amount: round2(adj), at: todayKey(), createdAt: Date.now(),
      note: 'Önceki sürümden aktarılan düzeltme / kullanılan izin' });
  }
  out.adjust = 0;              /* alan uyumluluk için kalır, değeri her zaman 0 */
  return out;
}
function normAlarms(raw){
  return (Array.isArray(raw) ? raw : []).map(function(a){
    if(!a || typeof a !== 'object') return null;
    var x = Object.assign({}, a);
    x.id = str(x.id) || uid();
    x.text = str(x.text);
    x.at = num(x.at, NaN);
    x.createdAt = okTime(x.createdAt);
    if(x.ref && typeof x.ref === 'object'){
      x.ref = { pid: str(x.ref.pid), tid: str(x.ref.tid), iid: str(x.ref.iid) };
      if(!x.ref.pid) delete x.ref;
    } else delete x.ref;
    return (x.text && isFinite(x.at)) ? x : null;
  }).filter(Boolean);
}
/* Not defteri: işlerden bağımsız serbest notlar (başlık isteğe bağlı) */
function normNotebook(raw){
  return (Array.isArray(raw) ? raw : []).map(function(n){
    if(!n || typeof n !== 'object') return null;
    var x = Object.assign({}, n);
    x.id = str(x.id) || uid();
    x.title = str(x.title);
    x.body = str(x.body != null ? x.body : x.text);
    x.createdAt = okTime(x.createdAt);
    x.updatedAt = okTime(x.updatedAt) || x.createdAt;
    return (x.title.trim() || x.body.trim()) ? x : null;
  }).filter(Boolean);
}
function normTrash(raw){
  var cut = Date.now() - TRASH_DAYS * 86400000;
  return (Array.isArray(raw) ? raw : []).map(function(t){
    if(!t || typeof t !== 'object' || !t.data) return null;
    var x = Object.assign({}, t);
    x.id = str(x.id) || uid();
    x.at = num(x.at, 0) || Date.now();
    x.kind = str(x.kind);
    x.label = str(x.label);
    x.loc = (x.loc && typeof x.loc === 'object') ? x.loc : {};
    return x.kind ? x : null;
  }).filter(function(x){ return x && x.at >= cut; });
}

function normalize(raw){
  var s = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  var out = Object.assign({}, s);                 /* tanınmayan alanlar korunur */
  var from = num(s.schemaVersion, 1);
  out.projects = (Array.isArray(s.projects) ? s.projects : []).map(normProject).filter(Boolean);
  out.weekly = normWeekly(s.weekly);
  out.leave = normLeave(s.leave);
  out.alarms = normAlarms(s.alarms);
  out.notebook = normNotebook(s.notebook);
  out.trash = normTrash(s.trash);
  out.schemaVersion = SCHEMA;
  var nt = 0, ni = 0;
  out.projects.forEach(function(p){ nt += p.tasks.length; p.tasks.forEach(function(t){ ni += t.items.length; }); });
  migrationInfo = { from: from, upgraded: from < SCHEMA, projects: out.projects.length, tasks: nt, items: ni,
                    alarms: out.alarms.length, weeks: Object.keys(out.weekly).length, leaveDays: Object.keys(out.leave.days).length };
  return out;
}
function dataSummary(s){
  var nt = 0, ni = 0;
  (s.projects || []).forEach(function(p){ nt += p.tasks.length; p.tasks.forEach(function(t){ ni += t.items.length; }); });
  return (s.projects || []).length + ' proje, ' + nt + ' iş, ' + ni + ' madde, ' +
         (s.alarms || []).length + ' hatırlatıcı, ' + (s.notebook || []).length + ' not, ' +
         Object.keys(s.leave && s.leave.days || {}).length + ' izin günü';
}
function isEmptyState(s){
  return !(s && ((s.projects || []).length || (s.alarms || []).length || (s.notebook || []).length ||
    Object.keys(s.weekly || {}).length || Object.keys((s.leave && s.leave.days) || {}).length ||
    ((s.leave && s.leave.ledger) || []).length));
}
/* ------------------------------------------------------------- 3. SAKLAMA
   Üç katman:
     a) yerel kopya  — IndexedDB'de her değişiklikte tutulur (çökme/kapanma sigortası)
     b) JSON dosyası — File System Access API ile seçilen dosya/klasör
     c) Google Drive — İş Takip klasörü + günlük yedekler
   Klasör/dosya adları, localStorage ve IndexedDB anahtarları önceki sürümle
   aynıdır; mevcut kurulum olduğu gibi çalışmaya devam eder. */

var state = emptyState();
var jsonHandle = null, folderHandle = null;
var AUTO_NAME = 'is-takip-data.json';
var canWrite = false, needsPermission = false, dirty = false, saveError = '';
var saveTimer = null, snapTimer = null;
var hasFS = typeof window.showOpenFilePicker === 'function';
var booted = false;

/* --- a) yerel kopya ------------------------------------------------------ */
function idb(){
  return new Promise(function(res, rej){
    var r = indexedDB.open('is-takip-json-db', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('h'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(key){
  return idb().then(function(db){
    return new Promise(function(res){
      var q = db.transaction('h').objectStore('h').get(key || 'json_file');
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ res(null); };
    });
  }).catch(function(){ return null; });
}
function idbSet(h, key){
  return idb().then(function(db){
    return new Promise(function(res){
      var tx = db.transaction('h', 'readwrite');
      tx.objectStore('h').put(h, key || 'json_file');
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ res(false); };
    });
  }).catch(function(){ return false; });
}
function saveSnapshot(){
  clearTimeout(snapTimer);
  snapTimer = setTimeout(function(){
    try {
      idbSet({ json: JSON.stringify(state), at: Date.now(), dirty: dirty || driveDirty() }, 'snapshot');
    } catch(e){}
  }, 400);
}
function loadSnapshot(){
  return idbGet('snapshot').then(function(s){
    if(!s || !s.json) return null;
    try { return { data: normalize(JSON.parse(s.json)), at: s.at, dirty: !!s.dirty }; } catch(e){ return null; }
  });
}

/* --- ortak kaydetme akışı ------------------------------------------------ */
function stateText(){ return JSON.stringify(state, null, 2); }
function changed(){
  dirty = true; saveError = '';
  updateBar();
  saveSnapshot();
  if(canWrite){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeToJsonFile, 250);
  }
  if(drive.on) driveQueue();
}
function flushSaves(){
  clearTimeout(saveTimer); clearTimeout(snapTimer);
  try { idbSet({ json: JSON.stringify(state), at: Date.now(), dirty: dirty || driveDirty() }, 'snapshot'); } catch(e){}
  if(canWrite && dirty) writeToJsonFile();
  if(drive.on && driveDirty()){ clearTimeout(drive.timer); driveSave(); }
}
function writeToJsonFile(){
  if(!jsonHandle || !canWrite) return Promise.resolve(false);
  return jsonHandle.createWritable().then(function(w){
    return w.write(stateText()).then(function(){ return w.close(); });
  }).then(function(){
    dirty = false; saveError = ''; updateBar(); saveSnapshot(); return true;
  }).catch(function(e){
    saveError = 'JSON dosyasına yazılamadı: ' + errMsg(e);
    updateBar();
    setNotice({ bad:true, sticky:true, text:'Veriler dosyaya yazılamıyor. Yedeği hemen indirip güvenceye alın.',
      buttons:[ { label:'📤 Yedeği indir', primary:true, fn: downloadBackup } ] });
    return false;
  });
}

/* Yeni veri kümesini devral; cihazda kaydedilmemiş iş varsa üzerine yazmadan sor. */
function adoptData(data, label){
  var localWork = !isEmptyState(state) && dirty;
  var same = JSON.stringify(data) === JSON.stringify(state);
  if(localWork && !same){
    var backup = clone(state);
    state = data; afterLoad(label);
    setNotice({ text: label + ' yüklendi, ancak bu cihazda kaydedilmemiş değişiklikler vardı.',
      buttons: [ { label:'↩ Cihazdakini geri yükle', primary:true, fn:function(){
        state = backup; setNotice(null); changed(); render();
        toast('Bu cihazdaki sürüm geri yüklendi.');
      } } ] });
    return;
  }
  state = data; afterLoad(label);
}
/* Veri yüklendikten sonraki ortak adımlar */
function afterLoad(label){
  editKey = null;
  if(migrationInfo && migrationInfo.upgraded && !isEmptyState(state)){
    /* Taşınan biçimi kaynağa geri yaz. Yazılmazsa dosya eski biçimde kalır,
       uygulama her açılışta yeniden taşır ve aynı uyarı tekrar tekrar çıkar. */
    dirty = true;
    changed();
    /* Uyarı cihaz başına bir kez gösterilir (yazma başarısız olsa bile
       kullanıcıyı her açılışta rahatsız etmesin). */
    if(lsGet('is-takip-migrated') !== String(SCHEMA)){
      lsSet('is-takip-migrated', String(SCHEMA));
      setNotice({ text:'Veriler eski sürümden yeni biçime taşındı (' + dataSummary(state) + ') ve bu biçimde kaydedildi. Bu uyarı bir daha çıkmayacak; yine de bir yedek almanız iyi olur.',
        buttons:[ { label:'📤 Yedeği indir', fn: downloadBackup } ] });
    }
  }
  render();
  updateBar();
  if(label) announce(label + ' yüklendi.');
}

/* --- b) JSON dosyası ----------------------------------------------------- */
function createNewJsonFile(){
  window.showSaveFilePicker({
    suggestedName: AUTO_NAME,
    types: [{ description: 'JSON Veri Dosyası', accept: { 'application/json': ['.json'] } }]
  }).then(function(h){
    jsonHandle = h; canWrite = true; needsPermission = false;
    return idbSet(h).then(function(){
      dirty = true;
      return writeToJsonFile().then(function(){ render(); toast('Veriler artık "' + h.name + '" dosyasına kaydediliyor.'); });
    });
  }).catch(function(e){
    if(e && e.name === 'AbortError') return;
    saveError = 'Dosya oluşturulmadı.'; updateBar();
  });
}
function connectExistingJsonFile(){
  window.showOpenFilePicker({
    multiple: false,
    types: [{ description: 'JSON Veri Dosyası', accept: { 'application/json': ['.json'] } }]
  }).then(function(arr){
    var h = arr[0];
    return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
      var data = null;
      if(txt.trim()){
        try { data = normalize(JSON.parse(txt)); } catch(e){
          saveError = '"' + h.name + '" geçerli bir JSON dosyası değil.'; updateBar(); return;
        }
      }
      jsonHandle = h; canWrite = true; needsPermission = false; saveError = '';
      return idbSet(h).then(function(){
        if(data && !isEmptyState(data)) adoptData(data, '"' + h.name + '" dosyası');
        else { dirty = true; writeToJsonFile(); render(); }
        updateBar();
      });
    });
  }).catch(function(e){
    if(e && e.name === 'AbortError') return;
    saveError = 'Dosyaya bağlanılamadı: ' + errMsg(e); updateBar();
  });
}
function attachFile(fh, writeNow){
  jsonHandle = fh; canWrite = true; needsPermission = false; saveError = ''; dirty = !!writeNow;
  return idbSet(fh, 'json_file').then(function(){
    if(writeNow) return writeToJsonFile();
    updateBar(); return true;
  }).then(function(){ render(); return true; });
}
function connectFolderFile(dir, allowCreate){
  return dir.getFileHandle(AUTO_NAME).then(function(fh){
    return fh.getFile().then(function(f){ return f.text(); }).then(function(txt){
      var data = null;
      if(txt.trim()){
        try { data = normalize(JSON.parse(txt)); } catch(e){
          saveError = '"' + AUTO_NAME + '" geçerli bir JSON dosyası değil.'; updateBar(); return false;
        }
      }
      jsonHandle = fh; canWrite = true; needsPermission = false; saveError = '';
      return idbSet(fh, 'json_file').then(function(){
        if(data && !isEmptyState(data)) adoptData(data, '"' + AUTO_NAME + '"');
        else { render(); updateBar(); }
        return true;
      });
    });
  }, function(err){
    if(err && err.name === 'NotFoundError' && allowCreate){
      if(!confirm('Seçtiğiniz klasörde "' + AUTO_NAME + '" bulunamadı. Mevcut verilerle yeni bir dosya oluşturulsun mu?')) return false;
      return dir.getFileHandle(AUTO_NAME, { create: true }).then(function(fh){ return attachFile(fh, true); });
    }
    return false;
  });
}
function connectFolder(){
  window.showDirectoryPicker({ id: 'is-takip-folder', mode: 'readwrite' }).then(function(dir){
    folderHandle = dir;
    return idbSet(dir, 'folder').then(function(){ return connectFolderFile(dir, true); });
  }).catch(function(e){
    if(e && e.name === 'AbortError') return;
    saveError = (e && e.name === 'SecurityError')
      ? 'Tarayıcı bu klasörü engelliyor (Masaüstü / Belgeler / İndirilenler klasörünün kendisi seçilemez). Bir alt klasör kullanın.'
      : 'Klasöre bağlanılamadı: ' + errMsg(e);
    updateBar();
  });
}
function enablePermission(){
  if(!jsonHandle && folderHandle){
    folderHandle.requestPermission({ mode: 'readwrite' }).then(function(p){
      if(p === 'granted') return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok){ needsPermission = false; updateBar(); } });
      updateBar();
    }).catch(function(){ updateBar(); });
    return;
  }
  if(!jsonHandle) return;
  jsonHandle.requestPermission({ mode: 'readwrite' }).then(function(p){
    if(p !== 'granted'){ updateBar(); return; }
    canWrite = true; needsPermission = false;
    return jsonHandle.getFile().then(function(f){ return f.text(); }).then(function(txt){
      var data = null;
      if(txt.trim()){ try { data = normalize(JSON.parse(txt)); } catch(e){} }
      /* İzin verilirken kullanıcı bu arada veri girmiş olabilir: üzerine yazma, sor. */
      if(data && !isEmptyState(data)) adoptData(data, 'Dosyadaki veriler');
      else if(dirty) writeToJsonFile();
      render(); updateBar();
    }).catch(function(){
      jsonHandle = null; canWrite = false;
      if(folderHandle) return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok){ needsPermission = false; updateBar(); } });
      needsPermission = false; updateBar();
    });
  }).catch(function(){ updateBar(); });
}
function initFileHandle(){
  if(!hasFS || driveFlag()){ updateBar(); return Promise.resolve(); }
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  var autoAsk = function(e){
    if(needsPermission && !(e.target.closest && e.target.closest('#savebar'))) enablePermission();
    if(canWrite) document.removeEventListener('click', autoAsk, true);
  };
  document.addEventListener('click', autoAsk, true);
  function tryFolder(){
    if(!folderHandle){ updateBar(); return Promise.resolve(); }
    return folderHandle.queryPermission({ mode: 'readwrite' }).then(function(p){
      if(p === 'granted') return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok) updateBar(); });
      needsPermission = true; updateBar();
    });
  }
  return idbGet('folder').then(function(d){
    folderHandle = d || null;
    return idbGet('json_file');
  }).then(function(h){
    if(!h) return tryFolder();
    jsonHandle = h;
    return h.queryPermission({ mode: 'readwrite' }).then(function(p){
      if(p !== 'granted'){ needsPermission = true; updateBar(); return; }
      canWrite = true;
      return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var data = null;
        if(txt.trim()){ try { data = normalize(JSON.parse(txt)); } catch(e){
          saveError = 'Bağlı dosya okunamadı (geçersiz JSON).'; } }
        if(data && !isEmptyState(data)) adoptData(data, 'Dosyadaki veriler');
        else { render(); updateBar(); }
      }).catch(function(){ jsonHandle = null; canWrite = false; return tryFolder(); });
    });
  }).catch(function(){ updateBar(); });
}

/* --- içe / dışa aktarma -------------------------------------------------- */
function applyImported(data, name){
  var before = JSON.stringify(state);
  idbSet({ json: before, at: Date.now() }, 'preimport');
  state = data;
  dirty = true;
  afterLoad(name || 'Yedek');
  changed();
  toast('Yüklendi: ' + dataSummary(state), { ms: 12000, actionLabel:'↩ İçe aktarmayı geri al', action: function(){
    try { state = normalize(JSON.parse(before)); } catch(e){ return; }
    changed(); render(); toast('Önceki veriler geri yüklendi.');
  } });
}
function readJsonFileObject(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(ev){
      try { res(normalize(JSON.parse(ev.target.result))); }
      catch(err){ rej(new Error('Seçilen dosya geçerli bir JSON değil.')); }
    };
    r.onerror = function(){ rej(new Error('Dosya okunamadı.')); };
    r.readAsText(file);
  });
}
function importJsonFile(){
  /* Dosya seçicinin olduğu yerde onu kullan (dosya aynı zamanda bağlanabilir),
     diğer tarayıcılarda klasik dosya girdisine düş. */
  if(hasFS && !driveFlag()){
    window.showOpenFilePicker({ multiple:false, types:[{ description:'JSON Veri Dosyası', accept:{ 'application/json':['.json'] } }] })
      .then(function(arr){
        var h = arr[0];
        return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
          var data;
          try { data = normalize(JSON.parse(txt)); } catch(err){ toast('Seçilen dosya geçerli bir JSON değil.', { bad:true }); return; }
          jsonHandle = h; canWrite = true; needsPermission = false; saveError = '';
          return idbSet(h).then(function(){
            applyImported(data, '"' + h.name + '"');
            toast('"' + h.name + '" bağlandı; bundan sonra otomatik buraya kaydedilecek.');
          });
        });
      }).catch(function(e){
        if(e && e.name === 'AbortError') return;
        toast('Dosya içe aktarılamadı: ' + errMsg(e), { bad:true });
      });
    return;
  }
  document.getElementById('importFileInput').click();
}
function downloadBackup(){
  var blob = new Blob([stateText()], { type: 'application/json;charset=utf-8' });
  downloadBlob(blob, 'is-takip-yedek-' + todayKey() + '.json');
}
function downloadBlob(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function downloadCsv(rows, name){
  /* Excel'in ayırıcıyı doğru seçmesi için sep satırı + BOM */
  var sep = ';';
  var body = rows.map(function(r){
    return r.map(function(c){
      var v = str(c).replace(/"/g, '""');
      return /[";\n\r]/.test(v) ? '"' + v + '"' : v;
    }).join(sep);
  }).join('\r\n');
  var blob = new Blob(['﻿' + 'sep=' + sep + '\r\n' + body], { type:'text/csv;charset=utf-8' });
  downloadBlob(blob, name);
}

/* --- c) Google Drive ----------------------------------------------------- */
var GOOGLE_CLIENT_ID = '';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
var DRIVE_FOLDER = 'İş Takip', DRIVE_BACKUPS = 'Yedekler', DRIVE_FILE = 'is-takip-data.json', DRIVE_KEEP = 30;
var drive = {
  on:false, busy:false, connecting:false, needsLogin:false, again:false, retried:false, loginReason:'',
  err:'', info:'', working:'', choice:null, setup:false, picker:null,
  token:null, exp:0, tokenP:null, gisP:null,
  folderId:null, backupsId:null, fileId:null, md5:null, revId:null,
  rev:0, savedRev:0, timer:null, backupDay:''
};
function driveClientId(){ return (GOOGLE_CLIENT_ID || lsGet('is-takip-gcid') || '').trim(); }
function driveFlag(){ return lsGet('is-takip-drive') === '1'; }
function driveDirty(){ return drive.on && drive.rev !== drive.savedRev; }
function authErr(m){ var e = new Error(m); e.auth = true; return e; }

/* Google giriş betiği yalnızca Drive gerçekten kullanılınca yüklenir. */
function loadGis(){
  if(window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve(window.google.accounts.oauth2);
  if(drive.gisP) return drive.gisP;
  drive.gisP = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      var n = 0;
      (function chk(){
        if(window.google && window.google.accounts && window.google.accounts.oauth2) return res(window.google.accounts.oauth2);
        if(++n > 60) return rej(authErr('Google giriş betiği yüklendi ama başlatılamadı.'));
        setTimeout(chk, 100);
      })();
    };
    s.onerror = function(){ drive.gisP = null; rej(authErr('Google giriş betiği yüklenemedi. İnternet bağlantınızı kontrol edin.')); };
    document.head.appendChild(s);
  });
  return drive.gisP;
}
/* Yüklü uygulama penceresi (standalone) Google'ın sessiz giriş akışını
   engelliyor; tarayıcı sekmesinde aynı sorun çıkmıyor. Bu yüzden alınan
   yetki belgesi süresi dolana kadar cihazda saklanır: uygulama yeniden
   açıldığında Google'a hiç gidilmeden bağlantı kurulur. */
function isStandalone(){
  try { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ||
               (window.matchMedia && matchMedia('(display-mode: window-controls-overlay)').matches) ||
               navigator.standalone === true; } catch(e){ return false; }
}
function storedToken(){
  try {
    var o = JSON.parse(lsGet('is-takip-gtok') || 'null');
    if(o && o.t && o.exp && o.cid === driveClientId() && Date.now() < o.exp - 120000) return o;
  } catch(e){}
  return null;
}
function keepToken(t, ms){
  drive.token = t; drive.exp = Date.now() + ms;
  lsSet('is-takip-gtok', JSON.stringify({ t: t, exp: drive.exp, cid: driveClientId() }));
}
function dropToken(){ drive.token = null; drive.exp = 0; lsSet('is-takip-gtok', null); }
function driveToken(interactive){
  if(drive.token && Date.now() < drive.exp - 60000) return Promise.resolve(drive.token);
  var st = storedToken();
  if(st){ drive.token = st.t; drive.exp = st.exp; return Promise.resolve(st.t); }
  if(drive.tokenP) return drive.tokenP;
  var id = driveClientId();
  if(!id) return Promise.reject(authErr('Google istemci kimliği girilmemiş.'));
  drive.tokenP = loadGis().then(function(oauth){
    return new Promise(function(res, rej){
      var tc = oauth.initTokenClient({
        client_id: id, scope: DRIVE_SCOPE,
        callback: function(r){
          if(!r || r.error || !r.access_token) return rej(authErr((r && r.error) || 'Giriş yapılamadı.'));
          keepToken(r.access_token, (+r.expires_in || 3600) * 1000);
          res(r.access_token);
        },
        error_callback: function(e){ rej(authErr((e && (e.type || e.message)) || 'Giriş yapılamadı.')); }
      });
      tc.requestAccessToken({ prompt: interactive ? '' : 'none' });
    });
  }).then(function(t){ drive.tokenP = null; return t; }, function(e){ drive.tokenP = null; throw e; });
  return drive.tokenP;
}
function driveFetch(url, opts, interactive, retried){
  return driveToken(!!interactive).then(function(t){
    var o = Object.assign({}, opts || {});
    o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + t });
    return fetch(url, o);
  }).then(function(r){
    if(r.status === 401 && !retried){ dropToken(); return driveFetch(url, opts, interactive, true); }
    if(!r.ok){ var e = new Error('Drive hatası (' + r.status + ')'); e.status = r.status; throw e; }
    return r;
  });
}
var D_API = 'https://www.googleapis.com/drive/v3/files';
var D_UP = 'https://www.googleapis.com/upload/drive/v3/files';
function dEsc(s){ return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function dList(q, extra){
  var fields = 'nextPageToken,files(id,name,md5Checksum,createdTime,size)';
  function page(token, acc){
    return driveFetch(D_API + '?spaces=drive&pageSize=100&fields=' + encodeURIComponent(fields) +
      '&q=' + encodeURIComponent(q) + (extra || '') + (token ? '&pageToken=' + encodeURIComponent(token) : ''))
      .then(function(r){ return r.json(); })
      .then(function(j){
        acc = acc.concat(j.files || []);
        return (j.nextPageToken && acc.length < 500) ? page(j.nextPageToken, acc) : acc;
      });
  }
  return page(null, []);
}
function dFolder(name, parent){
  var q = "mimeType='application/vnd.google-apps.folder' and name='" + dEsc(name) + "' and trashed=false and '" + (parent || 'root') + "' in parents";
  return dList(q).then(function(fs){
    if(fs.length) return fs[0].id;
    var meta = { name: name, mimeType: 'application/vnd.google-apps.folder' };
    if(parent) meta.parents = [parent];
    return driveFetch(D_API + '?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(meta) })
      .then(function(r){ return r.json(); }).then(function(j){ return j.id; });
  });
}
function dCreate(name, parent, text){
  var b = 'ist' + uid();
  var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify({ name: name, parents: [parent], mimeType: 'application/json' }) +
    '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + text + '\r\n--' + b + '--';
  return driveFetch(D_UP + '?uploadType=multipart&fields=id,md5Checksum', { method:'POST', headers:{ 'Content-Type':'multipart/related; boundary=' + b }, body: body })
    .then(function(r){ return r.json(); });
}
function driveEnsure(){
  if(drive.folderId && drive.backupsId) return Promise.resolve();
  return dFolder(DRIVE_FOLDER).then(function(fid){
    drive.folderId = fid; return dFolder(DRIVE_BACKUPS, fid);
  }).then(function(bid){
    drive.backupsId = bid;
    return dList("name='" + dEsc(DRIVE_FILE) + "' and '" + drive.folderId + "' in parents and trashed=false");
  }).then(function(fs){
    if(fs.length){ drive.fileId = fs[0].id; drive.md5 = fs[0].md5Checksum; }
  });
}
function driveRead(id){ return driveFetch(D_API + '/' + (id || drive.fileId) + '?alt=media').then(function(r){ return r.text(); }); }
function driveMeta(id){
  return driveFetch(D_API + '/' + (id || drive.fileId) + '?fields=id,md5Checksum,trashed,headRevisionId,modifiedTime')
    .then(function(r){ return r.json(); });
}
function driveWrite(text){
  function create(){ return dCreate(DRIVE_FILE, drive.folderId, text).then(function(m){ drive.fileId = m.id; return m; }); }
  if(!drive.fileId) return create();
  return driveFetch(D_UP + '/' + drive.fileId + '?uploadType=media&fields=id,md5Checksum,headRevisionId', { method:'PATCH', headers:{ 'Content-Type':'application/json; charset=UTF-8' }, body: text })
    .then(function(r){ return r.json(); })
    .catch(function(e){ if(e.status === 404){ drive.fileId = null; return create(); } throw e; });
}
function drivePrune(prefix){
  return dList("'" + drive.backupsId + "' in parents and trashed=false", '&orderBy=' + encodeURIComponent('createdTime desc')).then(function(fs){
    fs = fs.filter(function(f){ return f.name.indexOf(prefix) === 0; });
    return fs.slice(DRIVE_KEEP).reduce(function(p, f){
      return p.then(function(){ return driveFetch(D_API + '/' + f.id, { method:'DELETE' }).catch(function(){}); });
    }, Promise.resolve());
  });
}
function driveDailyBackup(){
  var day = todayKey();
  if(drive.backupDay === day || !drive.fileId) return Promise.resolve();
  var name = 'is-takip-yedek-' + day + '.json';
  return dList("name='" + dEsc(name) + "' and '" + drive.backupsId + "' in parents and trashed=false").then(function(fs){
    if(fs.length){ drive.backupDay = day; return; }
    return driveRead().then(function(txt){
      if(!txt || !txt.trim()){ drive.backupDay = day; return; }
      return dCreate(name, drive.backupsId, txt).then(function(){ drive.backupDay = day; return drivePrune('is-takip-yedek-'); });
    });
  }).catch(function(e){ if(e.status === 404){ drive.fileId = null; return; } throw e; });
}
function driveSnapshotRemote(prefix){
  if(!drive.fileId) return Promise.resolve();
  prefix = prefix || 'is-takip-onceki-';
  return driveRead().then(function(txt){
    if(!txt || !txt.trim()) return;
    return dCreate(prefix + todayKey() + '-' + Date.now().toString(36) + '.json', drive.backupsId, txt)
      .then(function(){ return drivePrune(prefix); });
  });
}
function driveFail(e){
  if(e && (e.auth || e.status === 401 || e.status === 403)) drive.needsLogin = true;
  drive.err = 'Drive\'a kaydedilemedi: ' + errMsg(e);
}
/* Yazmadan önce uzaktaki sürüm değişmiş mi diye bak: başka bir cihazın
   kaydını sessizce ezmeyi önler. */
function driveGuard(){
  if(!drive.fileId || !drive.revId) return Promise.resolve(true);
  return driveMeta().then(function(m){
    if(!m.headRevisionId || m.headRevisionId === drive.revId) return true;
    return driveSnapshotRemote('is-takip-cakisma-').then(function(){
      drive.choice = { type:'conflict' };
      return false;
    });
  });
}
function driveSave(){
  if(!drive.on || drive.choice) return Promise.resolve();
  if(drive.busy){ drive.again = true; return Promise.resolve(); }
  drive.busy = true; drive.err = '';
  var rev = drive.rev, text = stateText();
  updateBar();
  return driveToken(false).then(driveEnsure).then(driveGuard).then(function(ok){
    if(!ok) return;
    return driveDailyBackup().then(function(){ return driveWrite(text); }).then(function(m){
      if(m.md5Checksum && m.headRevisionId) return m;
      return driveMeta();
    }).then(function(m){
      drive.md5 = m.md5Checksum || null;
      drive.revId = m.headRevisionId || null;
      drive.savedRev = rev; drive.needsLogin = false;
      /* Drive'a yazıldıysa veri güvende: aradan yeni bir değişiklik
         geçmediyse "kaydedilmemiş" işaretini kaldır. */
      if(drive.rev === rev && !canWrite) dirty = false;
      saveSnapshot();
    });
  }).catch(driveFail).then(function(){
    drive.busy = false; updateBar();
    if(drive.again){ drive.again = false; setTimeout(driveSave, 300); }
  });
}
function driveQueue(){
  drive.info = '';
  drive.rev++;
  clearTimeout(drive.timer);
  drive.timer = setTimeout(driveSave, 1500);
}
function driveBackupNow(){
  if(!drive.on || drive.working) return Promise.resolve();
  drive.working = 'Drive\'a yedek alınıyor…'; drive.err = ''; drive.info = ''; updateBar();
  var d = new Date(), name = 'is-takip-elle-' + todayKey() + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.json';
  var text = stateText();
  return driveToken(true).then(driveEnsure).then(function(){
    return dCreate(name, drive.backupsId, text);
  }).then(function(){ return drivePrune('is-takip-elle-'); }).then(function(){
    drive.info = '✓ Yedek alındı: ' + DRIVE_FOLDER + ' › ' + DRIVE_BACKUPS + ' › ' + name;
  }).catch(function(e){ drive.err = 'Yedek alınamadı: ' + errMsg(e); if(e && e.auth) drive.needsLogin = true; })
    .then(function(){ drive.working = ''; updateBar(); });
}
/* Drive'daki yedeklerden geri yükleme */
function driveOpenPicker(){

function driveRestoreBackup(id, name){

function driveAdopt(remoteState, meta){
  drive.md5 = meta && meta.md5Checksum || null;
  drive.revId = meta && meta.headRevisionId || null;
  drive.on = true; drive.choice = null; drive.needsLogin = false; drive.err = '';
  drive.rev = 0; drive.savedRev = 0; dirty = false;
  lsSet('is-takip-drive', '1');

  saveSnapshot();
}
function driveLoadRemote(){
  return driveMeta().then(function(meta){
    return driveRead().then(function(txt){
      var r;
      try { r = normalize(JSON.parse(txt)); } catch(e){ throw new Error('Drive\'daki dosya geçerli bir JSON değil.'); }
      driveAdopt(r, meta);
    });
  });
}
function driveKeepLocal(){
  return driveSnapshotRemote().then(function(){ return drive.fileId ? driveMeta() : { md5Checksum:null, headRevisionId:null }; }).then(function(m){
    drive.md5 = m.md5Checksum; drive.revId = m.headRevisionId;
    drive.on = true; drive.choice = null; drive.needsLogin = false; drive.err = '';
    lsSet('is-takip-drive', '1');
    drive.rev++;
    return driveSave();
  });
}
function driveConnect(){
  drive.err = ''; drive.connecting = true; updateBar();
  return driveToken(true).then(driveEnsure).then(function(){
    if(!drive.fileId) return driveKeepLocal();
    return driveRead().then(function(txt){
      var remote = null; try { remote = normalize(JSON.parse(txt)); } catch(e){}
      var localEmpty = isEmptyState(state);
      if(remote && (localEmpty || JSON.stringify(remote) === JSON.stringify(normalize(clone(state))))) return driveLoadRemote();
      drive.choice = { type:'connect', remoteOk: !!remote };
    });
  }).catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
}
function driveChoose(what){
  var c = drive.choice; if(!c) return;
  drive.err = ''; drive.connecting = true; updateBar();
  var p;
  if(what === 'cancel'){ drive.choice = null; if(c.type === 'connect') drive.on = false; p = Promise.resolve(); }
  else if(what === 'remote'){ drive.choice = null; p = driveLoadRemote(); }
  else { drive.choice = null; p = driveKeepLocal(); }
  return p.catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
}
function driveReconnect(){
  if(!drive.on) return driveConnect();
  drive.connecting = true; drive.err = ''; updateBar();
  return driveToken(true).then(function(){
    drive.needsLogin = false; drive.loginReason = '';
    /* Drive'da dosya varsa ve burada kaydedilmemiş bir şey yoksa önce onu oku. */
    return driveEnsure().then(function(){
      if(drive.fileId && !driveDirty() && !dirty) return driveLoadRemote();
      drive.on = true;
      return driveSave();
    });
  }).catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
}
function driveDisconnect(){
  clearTimeout(drive.timer);
  if(drive.token){
    try { if(window.google && google.accounts && google.accounts.oauth2 && google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(drive.token); } catch(e){}
  }
  drive.on = false; drive.choice = null; drive.needsLogin = false; drive.err = ''; drive.picker = null;
  drive.folderId = drive.backupsId = drive.fileId = drive.md5 = drive.revId = null;
  dropToken();
  lsSet('is-takip-drive', null);
  updateBar();
}
function driveSyncNow(){
  if(driveDirty()) return driveSave();
  return driveSync(true);
}
function driveSync(manual){
  if(!drive.on || drive.busy || drive.connecting || drive.choice || !drive.fileId) return Promise.resolve();
  if(!manual && (driveDirty() || editKey)) return Promise.resolve();
  return driveToken(false).then(function(){ return driveMeta(); }).then(function(m){
    var changedRemote = (m.headRevisionId && drive.revId) ? (m.headRevisionId !== drive.revId)
      : (m.md5Checksum && drive.md5 ? String(m.md5Checksum) !== String(drive.md5) : false);
    if(!changedRemote) return;
    if(driveDirty()){ drive.choice = { type:'conflict' }; return; }
    return driveLoadRemote();
  }).catch(function(e){
    if(e && e.auth) drive.needsLogin = true;
    else if(manual) drive.err = 'Eşitlenemedi: ' + errMsg(e);
  }).then(updateBar);
}
function driveInit(){
  if(!driveFlag() || !driveClientId()) return;
  drive.connecting = true; updateBar();
  driveToken(false).then(driveEnsure).then(function(){
    if(dirty && !isEmptyState(state)){ drive.choice = { type:'connect', remoteOk: !!drive.fileId }; return; }
    if(!drive.fileId){ drive.on = true; return; }
    return driveLoadRemote();
  }).catch(function(e){
    drive.on = false; drive.needsLogin = true;
    drive.loginReason = errMsg(e);
    if(!e.auth) drive.err = 'Drive bağlantısı kurulamadı: ' + errMsg(e);
    /* Sessiz giriş ilk denemede sık sık boşa çıkar (Google betiği ya da
       oturum henüz hazır değildir): bir kez daha dene. */
    if(!drive.retried){
      drive.retried = true;
      setTimeout(function(){ if(drive.needsLogin && !drive.on) driveInit(); }, 2000);
    }
  }).then(function(){ drive.connecting = false; updateBar(); });
}

/* Tüm maddeler (arşivdekiler dahil): geçmiş istatistikleri bozulmasın diye

function allItems(){

/* --- sıralama ------------------------------------------------------------ */
function sortBy(list){
  var arr = list.slice();
  if(sortMode === 'prio'){
    arr.sort(function(a, b){
      var d = (b.priority || 0) - (a.priority || 0);
      if(d) return d;
      return dueRank(a) - dueRank(b);
    });
  } else if(sortMode === 'due'){
    arr.sort(function(a, b){ var d = dueRank(a) - dueRank(b); return d || (b.priority || 0) - (a.priority || 0); });
  }
  return arr;
}
function dueRank(o){ return isDayKey(o.due) ? keyToDate(o.due).getTime() : 8640000000000; }
/* Elle sıralama: hedef, aynı kümedeki (örn. iki açık madde arasında
   tamamlanmış bir madde varsa onu atlayarak) görünür komşudur. */
function neighborIndex(arr, i, delta, sameFn){
  var j = i + delta;
  while(j >= 0 && j < arr.length && sameFn && !sameFn(arr[j], arr[i])) j += delta;
  return (j >= 0 && j < arr.length) ? j : -1;
}
function moveInArray(arr, id, delta, sameFn){
  var i = arr.findIndex(function(x){ return x.id === id; });
  if(i < 0) return false;
  var j = neighborIndex(arr, i, delta, sameFn);
  if(j < 0) return false;
  var x = arr.splice(i, 1)[0];
  arr.splice(j, 0, x);
  return true;
}
function canMove(arr, id, delta, sameFn){
  if(sortMode !== 'manual') return false;          /* sıralama otomatikken taşıma anlamsız */
  var i = arr.findIndex(function(x){ return x.id === id; });
  return i >= 0 && neighborIndex(arr, i, delta, sameFn) >= 0;
}
function sameVisibility(a, b){ return (!a.archived) === (!b.archived); }
function sameItemGroup(a, b){ return !!a.done === !!b.done && (!a.archived) === (!b.archived); }

/* --- çöp kutusu (30 gün) ------------------------------------------------- */
var KIND_LABEL = { project:'Proje', task:'İş', item:'Madde', reminder:'Hatırlatma', weekly:'Haftalık plan', alarm:'Hatırlatıcı', leaveday:'İzin günü', ledger:'İzin hareketi', note:'Not' };
function trashPush(kind, label, data, loc){
  if(!Array.isArray(state.trash)) state.trash = [];
  var entry = { id: uid(), at: Date.now(), kind: kind, label: snip(label, 90), data: clone(data), loc: loc || {} };
  state.trash.unshift(entry);
  return entry;
}
function deletedToast(entry, extra){
  toast((KIND_LABEL[entry.kind] || 'Kayıt') + ' silindi: ' + entry.label + (extra ? ' (' + extra + ')' : ''), {
    actionLabel:'↩ Geri al',
    action: function(){ restoreTrash(entry.id, true); }
  });
}
function restoreTrash(id, quiet){
  var i = state.trash.findIndex(function(t){ return t.id === id; });
  if(i < 0) return;
  var e = state.trash[i], ok = true, where = '';
  function ins(arr, idx, val){ arr.splice(Math.min(Math.max(num(idx, arr.length), 0), arr.length), 0, val); }
  if(e.kind === 'project') ins(state.projects, e.loc.index, e.data);
  else if(e.kind === 'task'){
    var p = findProject(e.loc.pid);
    if(p) ins(p.tasks, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu proje artık yok.'; }
  } else if(e.kind === 'item'){
    var t = findTask(e.loc.pid, e.loc.tid);
    if(t) ins(t.items, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu iş artık yok.'; }
  } else if(e.kind === 'reminder'){
    var pr = findProject(e.loc.pid);
    if(pr) ins(pr.reminders, e.loc.index, e.data); else { ok = false; where = 'Bağlı olduğu proje artık yok.'; }
  } else if(e.kind === 'weekly'){
    if(!state.weekly[e.loc.weekKey]) state.weekly[e.loc.weekKey] = [];
    ins(state.weekly[e.loc.weekKey], e.loc.index, e.data);
  } else if(e.kind === 'alarm') state.alarms.push(e.data);
  else if(e.kind === 'leaveday'){
    state.leave.days[e.data.key] = e.data.value;
    if(e.data.note) state.leave.notes[e.data.key] = e.data.note;
  } else if(e.kind === 'ledger') state.leave.ledger.push(e.data);
  else if(e.kind === 'note') ins(noteList(), e.loc.index, e.data);
  if(!ok){ toast('Geri yüklenemedi. ' + where, { bad:true }); return; }
  state.trash.splice(i, 1);
  commit();
  if(!quiet) toast('Geri yüklendi: ' + e.label);
}
function purgeTrash(id){
  state.trash = state.trash.filter(function(t){ return t.id !== id; });
  commit();
}
function emptyTrash(){
  if(!state.trash.length) return;
  if(!confirm('Çöp kutusundaki ' + state.trash.length + ' kayıt kalıcı olarak silinsin mi?\n\nBu işlem geri alınamaz.')) return;
  state.trash = [];
  commit();
  toast('Çöp kutusu boşaltıldı.');
}

/* --- projeler ------------------------------------------------------------ */
function addProject(title){
  title = str(title).trim(); if(!title) return;
  tasksFilter = '';
  var p = { id: uid(), title: title, createdAt: Date.now(), tasks: [], reminders: [], archived: null };
  state.projects.push(p);
  commit('task:' + p.id);
}
function deleteProject(pid){
  var i = state.projects.findIndex(function(x){ return x.id === pid; });
  if(i < 0) return;
  var p = state.projects[i];
  var ni = 0; p.tasks.forEach(function(t){ ni += t.items.length; });
  var e = trashPush('project', p.title, p, { index:i });
  state.projects.splice(i, 1);
  commit();
  deletedToast(e, p.tasks.length + ' iş, ' + ni + ' madde');
}
function renameProject(pid, v){ var p = findProject(pid); if(p){ p.title = v; commit(); } }
function moveProject(pid, delta){
  if(!moveInArray(state.projects, pid, delta, sameVisibility)) return;
  var i = state.projects.findIndex(function(x){ return x.id === pid; });
  var dir = delta < 0 ? 'up' : 'down';
  if(i === 0 && dir === 'up') dir = 'down';
  else if(i === state.projects.length - 1 && dir === 'down') dir = 'up';
  commit(dir + ':' + pid);
}
function setArchived(obj, on, what, label){
  obj.archived = on ? Date.now() : null;
  commit();
  toast(label + (on ? ' arşivlendi.' : ' arşivden çıkarıldı.'), { actionLabel:'↩ Geri al', action:function(){
    obj.archived = on ? null : Date.now(); commit();
  } });
}

function addTask(pid, title){

function deleteTask(pid, tid){

function leaveData(){
  if(!state.leave || typeof state.leave !== 'object') state.leave = { days:{}, notes:{}, ledger:[], adjust:0 };
  if(!state.leave.days || typeof state.leave.days !== 'object') state.leave.days = {};
  if(!state.leave.notes || typeof state.leave.notes !== 'object') state.leave.notes = {};
  if(!Array.isArray(state.leave.ledger)) state.leave.ledger = [];

}

}
function leaveLedgerSum(){
  return round2(leaveData().ledger.reduce(function(a, e){ return a + num(e.amount, 0); }, 0));

  return round2(-leaveData().ledger.filter(function(e){ return e.amount < 0; }).reduce(function(a, e){ return a + e.amount; }, 0));

var snoozeId = null, snoozeVal = '', snoozeErr = '', lastDueKey = '', lastRenderedAlarmKey = '';
var notified = {};
try { notified = JSON.parse(lsGet('is-takip-notified') || '{}') || {}; } catch(e){ notified = {}; }
function notifyOK(){ return typeof Notification !== 'undefined'; }
function systemNotify(a){
  if(!notifyOK() || Notification.permission !== 'granted') return;
  var key = a.id + ':' + a.at;
  if(notified[key]) return;
  if(document.hasFocus()) return;
  notified[key] = Date.now();
  var keys = Object.keys(notified);
  if(keys.length > 200) keys.slice(0, keys.length - 200).forEach(function(k){ delete notified[k]; });
  lsSet('is-takip-notified', JSON.stringify(notified));
  var title = '⏰ Hatırlatıcı', opts = { body: a.text, tag: a.id, requireInteraction: true, icon:'icon-192.png', badge:'icon-192.png' };
  function fallback(){ try { new Notification(title, { body: a.text, tag: a.id, icon:'icon-192.png' }); } catch(e){} }
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(function(reg){
      if(reg && reg.showNotification) reg.showNotification(title, opts).catch(fallback); else fallback();
    }, fallback);
  } else fallback();
}
function closeNotice(id){
  if(!(navigator.serviceWorker && navigator.serviceWorker.getRegistration)) return;
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(reg && reg.getNotifications) reg.getNotifications({ tag: id }).then(function(l){ l.forEach(function(n){ n.close(); }); });
  }).catch(function(){});
}

    ]) ];

function escCancel(e){ if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); } }

function editForm(text, maxlen, onSave){
  var inp = el('input', { type:'text', maxlength:String(maxlen), autocomplete:'off', 'data-edit':'1', 'aria-label':'Metin' });
  inp.value = text;
  inp.addEventListener('keydown', escCancel);

function noteForm(obj){
  var ta = el('textarea', { rows:'3', maxlength:'2000', placeholder:'Notunuzu yazın…', 'data-edit':'1', 'aria-label':'Not' });
  ta.value = obj.note || '';
  function save(){
    var v = ta.value.trim();
    if(v) obj.note = v; else delete obj.note;
    editKey = null; commit();
  }
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
    else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
  });
  var actions = [
    el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
    el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit })
  ];
  if(obj.note) actions.push(el('button', { type:'button', class:'small', text:'Notu Sil', onclick:function(){ delete obj.note; editKey = null; commit(); } }));
  actions.push(el('span', { class:'hintx', text:'Ctrl+Enter ile kaydet' }));
  return el('form', { class:'noteform', onsubmit:function(e){ e.preventDefault(); save(); } }, [ ta, el('div', { class:'noteactions' }, actions) ]);

function remForm(text, btnText, isEdit, onSave, dataKey){
  var attrs = { rows: isEdit ? '3' : '2', maxlength:'1500', autocomplete:'off', 'aria-label':'Hatırlatma',
    placeholder: isEdit ? '' : 'Unutmamam gereken bir şey yaz… (Enter = alt satır)' };
  if(isEdit) attrs['data-edit'] = '1'; else attrs['data-key'] = dataKey;
  var ta = el('textarea', attrs);
  ta.value = text || '';
  function submit(){
    var v = ta.value.replace(/\s+$/, '').replace(/^\s*\n/, '');
    if(!v.trim()) return;
    if(isEdit) editKey = null;
    ta.value = '';
    onSave(v);
  }
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && isEdit){ e.preventDefault(); cancelEdit(); }
    else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); submit(); }
  });
  var btns = [ el('button', { type:'submit', class: isEdit ? 'primary small' : '', text: btnText }) ];
  if(isEdit) btns.push(el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit }));
  btns.push(el('span', { class:'hintx', text:'Enter: alt satır • Ctrl+Enter: ' + btnText.toLowerCase() }));
  return el('form', { class:'remform', onsubmit:function(e){ e.preventDefault(); submit(); } }, [ ta, el('div', { class:'rbtns' }, btns) ]);
}
