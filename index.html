  function renderTasks(){
    var projEl = document.getElementById('projects');
    var doneEl = document.getElementById('doneList');
    projEl.innerHTML = ''; doneEl.innerHTML = '';

    /* Proje filtresi (açılır menü) */
    if(tasksFilter && !findProject(tasksFilter)) tasksFilter = '';
    var bar = document.getElementById('taskFilterBar');
    bar.innerHTML = '';
    var fsel = el('select', { 'aria-label':'Proje filtresi', onchange:function(e){ tasksFilter = e.target.value; render(); } },
      [ el('option', { value:'', text:'Tüm projeler' }) ].concat(state.projects.map(function(p){
        return el('option', { value: p.id, text: p.title });
      })));
    fsel.value = tasksFilter;
    bar.appendChild(el('span', { class:'stats', text:'Proje:' }));
    bar.appendChild(fsel);
    bar.hidden = !state.projects.length;

    if(!state.projects.length){
      projEl.appendChild(el('div', { class:'empty', text:'Henüz proje yok. Yukarıdan bir proje ekleyerek başlayın.' }));
    }

    state.projects.forEach(function(p, pi){
      if(tasksFilter && p.id !== tasksFilter) return;
      var pOpen = 0, pDone = 0;
      var taskNodes = [];
      var doneTaskNodes = [];

      p.tasks.forEach(function(t){
        var open = t.items.filter(function(i){ return !i.done; });
        var done = t.items.filter(function(i){ return i.done; });
        pOpen += open.length; pDone += done.length;

        var thead;
        if(editKey === 't:' + t.id){
          thead = el('div', { class:'thead' }, [ editForm(t.title, 100, function(v){ renameTask(p.id, t.id, v); }) ]);
        } else {
          var completeBtn = el('button', { class:'done-btn', text:'✓ İşi Tamamla', title:'Bu işin tüm açık maddelerini tamamla',
            onclick:function(){ completeTask(p.id, t.id); } });
          if(!open.length) completeBtn.disabled = true;
          thead = el('div', { class:'thead' }, [
            el('h4', { text: t.title }),
            t.createdAt ? el('span', { class:'created-tag', title:'İş Oluşturulma Tarihi', text: fmt(t.createdAt) }) : null,
            el('span', { class:'count', text: open.length + ' açık' }),
            completeBtn, noteBtn(t), editBtn('t:' + t.id, 'İşi'),
            delBtn('İşi', function(){ deleteTask(p.id, t.id); })
          ]);
        }

        var ul = el('ul');
        open.forEach(function(it){ ul.appendChild(openRow(p, t, it)); });

        taskNodes.push(el('div', { class:'task', 'data-sid': t.id }, [
          thead, noteBlock(t),
          open.length ? ul : el('div', { class:'empty', text: t.items.length ? 'Tüm maddeler tamamlandı.' : 'Henüz iş maddesi yok.' }),
          addForm('Yeni iş maddesi ekle…', 'item:' + t.id, 200, function(v){ addItem(p.id, t.id, v); })
        ]));

        if(done.length){
          var dul = el('ul');
          done.slice().sort(function(a, b){ return (b.doneAt || 0) - (a.doneAt || 0); }).forEach(function(it){
            dul.appendChild(doneRow(p, t, it, false));
          });
          doneTaskNodes.push(el('div', { class:'task' }, [
            el('div', { class:'thead' }, [
              el('h4', { text: t.title }),
              el('span', { class:'count', text: done.length + ' tamamlandı' })
            ]),
            dul
          ]));
        }
      });

      var phead;
      if(editKey === 'p:' + p.id){
        phead = el('div', { class:'phead' }, [ editForm(p.title, 80, function(v){ renameProject(p.id, v); }) ]);
      } else {
        var upBtn = el('button', { class:'icon', title:'Projeyi yukarı al', text:'▲', 'data-key':'up:' + p.id, onclick:function(){ moveProject(p.id, -1); } });
        var downBtn = el('button', { class:'icon', title:'Projeyi aşağı al', text:'▼', 'data-key':'down:' + p.id, onclick:function(){ moveProject(p.id, 1); } });
        if(pi === 0) upBtn.disabled = true;
        if(pi === state.projects.length - 1) downBtn.disabled = true;
        phead = el('div', { class:'phead' }, [
          el('h3', { text: p.title }),
          el('span', { class:'count', text: p.tasks.length + ' iş • ' + pOpen + ' açık madde' }),
          upBtn, downBtn, noteBtn(p), editBtn('p:' + p.id, 'Projeyi'),
          delBtn('Projeyi', function(){ deleteProject(p.id); })
        ]);
      }
      var projNodes = [ phead, noteBlock(p), remindersBlock(p) ];
      if(!p.tasks.length) projNodes.push(el('div', { class:'empty', text:'Bu projede henüz iş yok.' }));
      taskNodes.forEach(function(n){ projNodes.push(n); });
      var tf = addForm('Bu projeye yeni iş ekle…', 'task:' + p.id, 100, function(v){ addTask(p.id, v); }, 'İş Ekle');
      tf.className += ' addtask';
      projNodes.push(tf);
      projEl.appendChild(el('div', { class:'project', 'data-sid': p.id }, projNodes));

      if(doneTaskNodes.length){
        var dn = [ el('div', { class:'phead' }, [
          el('h3', { text: p.title }),
          el('span', { class:'count', text: pDone + ' tamamlandı' })
        ]) ];
        doneTaskNodes.forEach(function(n){ dn.push(n); });
        doneEl.appendChild(el('div', { class:'project done-card' }, dn));
      }
    });

    if(!doneEl.children.length){
      doneEl.appendChild(el('div', { class:'empty', text:'Tamamlanan iş yok.' }));
    }
  }

  /* ---------- Haftalık Plan ---------- */
  var WSTATUS = [ ['planned','Bekliyor'], ['done','Tamamlandı'], ['postponed','Ertelendi'], ['failed','Yapılamadı'], ['cancelled','İptal oldu'] ];

  function mondayKey(ts){
    var d = new Date(ts);
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
    return dayKey(d.getTime());
  }
  function shiftKey(key, days){
    var d = keyToDate(key); d.setDate(d.getDate() + days);
    return dayKey(d.getTime());
  }
  function weekList(key, create){
    if(!state.weekly) state.weekly = {};
    if(!state.weekly[key] && create) state.weekly[key] = [];
    return state.weekly[key] || [];
  }
  function addWeekItem(text){
    text = text.trim(); if(!text) return;
    weekList(weekKey, true).push({ id: uid(), text: text, status: 'planned', createdAt: Date.now() });
    commit('week');
  }
  function setWeekEdit(id, v){
    var it = weekList(weekKey).find(function(x){ return x.id === id; });
    if(it){ it.text = v; commit(); }
  }
  function deleteWeekItem(id){
    var wi = weekList(weekKey).find(function(x){ return x.id === id; });
    if(!wi || !askDelete('Haftalık plandan bu iş silinsin mi?\n"' + snip(wi.text, 80) + '"')) return;
    state.weekly[weekKey] = weekList(weekKey).filter(function(x){ return x.id !== id; });
    commit();
  }
  function moveWeekItemNext(id){
    var cur = weekList(weekKey);
    var it = cur.find(function(x){ return x.id === id; });
    if(!it) return;
    state.weekly[weekKey] = cur.filter(function(x){ return x.id !== id; });
    it.status = 'planned';
    weekList(shiftKey(weekKey, 7), true).push(it);
    commit();
  }

  function renderWeekly(){
    var items = weekList(weekKey);
    var s = keyToDate(weekKey), e = keyToDate(shiftKey(weekKey, 6));
    var title = s.toLocaleDateString('tr-TR', { day:'numeric', month:'long' }) + ' – ' +
                e.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
    var doneCount = items.filter(function(x){ return x.status === 'done'; }).length;
    var isThis = weekKey === mondayKey(Date.now());

    var head = el('div', { class:'calhead' }, [
      el('button', { class:'small', text:'‹', title:'Önceki hafta', onclick:function(){ weekKey = shiftKey(weekKey, -7); editKey = null; render(); } }),
      el('h3', { text: title + (isThis ? ' (bu hafta)' : '') }),
      el('button', { class:'small', text:'Bu hafta', onclick:function(){ weekKey = mondayKey(Date.now()); editKey = null; render(); } }),
      el('button', { class:'small', text:'›', title:'Sonraki hafta', onclick:function(){ weekKey = shiftKey(weekKey, 7); editKey = null; render(); } })
    ]);

    var nodes = [ el('h2', { text:'Haftalık plan' }), head,
      el('div', { class:'daysum', text: items.length ? doneCount + ' / ' + items.length + ' iş tamamlandı' : 'Bu hafta için henüz iş girilmedi.' }) ];

    if(items.length){
      var ul = el('ul');
      items.forEach(function(it){
        var st = it.status || 'planned';
        if(editKey === 'w:' + it.id){
          ul.appendChild(el('li', null, [ editForm(it.text, 200, function(v){ setWeekEdit(it.id, v); }) ]));
          return;
        }
        var sel = el('select', { class:'wsel st-' + st, 'aria-label':'Durum', onchange:function(ev){ it.status = ev.target.value; commit(); } },
          WSTATUS.map(function(o){ return el('option', { value:o[0], text:o[1] }); }));
        sel.value = st;
        ul.appendChild(el('li', { 'data-sid': it.id }, [
          el('span', { class:'txt wtxt st-' + st, text: it.text }),
          sel,
          st === 'postponed' ? el('button', { class:'small', text:'→ Gelecek haftaya taşı', onclick:function(){ moveWeekItemNext(it.id); } }) : null,
          noteBtn(it), editBtn('w:' + it.id, 'İşi'),
          delBtn('İşi', function(){ deleteWeekItem(it.id); }),
          noteBlock(it)
        ]));
      });
      nodes.push(ul);
    }
    nodes.push(addForm('Bu hafta yapılması gereken işi ekle…', 'week', 200, addWeekItem));
    return el('div', { class:'panel weekly' }, nodes);
  }

  /* ---------- Fazla Çalışma Günleri / Kazanılan İzin ---------- */
  var LEAVE_TYPES = { weekend:'Hafta sonu çalışması', holiday:'Resmi tatil çalışması' };
  function round2(n){ return Math.round(n * 100) / 100; }
  function fmtDays(n){ return String(round2(n)).replace('.', ',') + ' gün'; }
  function leaveData(){
    if(!state.leave || typeof state.leave !== 'object') state.leave = { days: {}, adjust: 0 };
    if(!state.leave.days || typeof state.leave.days !== 'object') state.leave.days = {};
    if(!state.leave.notes || typeof state.leave.notes !== 'object') state.leave.notes = {};
    if(!isFinite(+state.leave.adjust)) state.leave.adjust = 0;
    return state.leave;
  }
  function leaveTotal(){
    var L = leaveData();
    return round2(Object.keys(L.days).length + (+L.adjust));
  }

  function leaveNoteInput(key){
    var inp = el('input', { type:'text', maxlength:'300', autocomplete:'off', placeholder:'Not ekle…', 'aria-label':'İzin notu' });
    inp.value = leaveData().notes[key] || '';
    inp.addEventListener('change', function(){
      var L = leaveData(), v = inp.value.trim();
      if(v) L.notes[key] = v; else delete L.notes[key];
      changed();
    });
    return inp;
  }
  function removeLeaveDay(key){
    var L = leaveData();
    if(!askDelete(fmtDay(key) + ' günündeki fazla çalışma işareti kaldırılsın mı?\n(Kazanılan izinden 1 gün düşer' + (L.notes[key] ? ', notu da silinir' : '') + '.)')) return;
    delete L.days[key]; delete L.notes[key];
    commit();
  }

  function dayLeaveBox(key){
    var L = leaveData(), cur = L.days[key], kids;
    if(cur){
      kids = [
        el('span', { text:'★ ' + (LEAVE_TYPES[cur] || 'Fazla çalışma günü') + ' — +1 gün izin' }),
        leaveNoteInput(key),
        el('button', { class:'small', text:'İşareti kaldır', onclick:function(){ removeLeaveDay(key); } })
      ];
    } else {
      var dow = keyToDate(key).getDay();
      var sel = el('select', { 'aria-label':'Gün türü' }, [
        el('option', { value:'weekend', text: LEAVE_TYPES.weekend }),
        el('option', { value:'holiday', text: LEAVE_TYPES.holiday })
      ]);
      sel.value = (dow === 0 || dow === 6) ? 'weekend' : 'holiday';
      kids = [
        el('span', { text:'Fazla çalışma günü mü?' }), sel,
        el('button', { class:'small primary', text:'İşaretle (+1 gün izin)', onclick:function(){ L.days[key] = sel.value; commit(); } })
      ];
    }
    return el('div', { class:'xbox' }, kids);
  }

  function renderLeave(){
    var L = leaveData();
    var keys = Object.keys(L.days).sort().reverse();
    var nH = 0, nW = 0;
    keys.forEach(function(k){ if(L.days[k] === 'holiday') nH++; else nW++; });
    var marked = keys.length, adj = round2(+L.adjust), total = round2(marked + adj);
    var nodes = [ el('h2', { text:'🏖 Kazanılan izin' }) ];

    if(editKey === 'leave'){
      var inp = el('input', { type:'text', inputmode:'decimal', maxlength:'8', autocomplete:'off', 'data-edit':'1', 'aria-label':'Kazanılan izin (gün)' });
      inp.value = String(total).replace('.', ',');
      inp.addEventListener('keydown', escCancel);
      var err = el('span', { class:'err' });
      nodes.push(el('form', { class:'editform', onsubmit:function(e){
        e.preventDefault();
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if(!isFinite(v)){ err.textContent = 'Geçerli bir sayı girin (örn. 3 veya 2,5).'; return; }
        L.adjust = round2(v - marked);
        editKey = null; commit();
      } }, [
        inp, el('span', { class:'stats', text:'gün' }),
        el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
        el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit }), err
      ]));
    } else {
      nodes.push(el('div', { class:'leavetop' }, [
        el('span', { class:'leaveval', text: fmtDays(total) }),
        el('button', { class:'icon', text:'✎ Düzenle', title:'Kazanılan izin toplamını düzenle', onclick:function(){ startEdit('leave'); } })
      ]));
    }

    nodes.push(el('div', { class:'daysum', text:
      LEAVE_TYPES.weekend + ': ' + nW + ' • ' + LEAVE_TYPES.holiday + ': ' + nH +
      ' • Düzeltme / kullanılan: ' + (adj > 0 ? '+' : '') + String(adj).replace('.', ',') }));

    var uinp = el('input', { type:'text', inputmode:'decimal', maxlength:'6', autocomplete:'off', 'aria-label':'Kullanılan izin (gün)' });
    uinp.value = '1';
    var uerr = el('span', { class:'err' });
    nodes.push(el('form', { class:'add leaveuse', onsubmit:function(e){
      e.preventDefault();
      var n = parseFloat(String(uinp.value).replace(',', '.'));
      if(!isFinite(n) || n <= 0){ uerr.textContent = 'Düşülecek gün sayısını girin (örn. 1 veya 0,5).'; return; }
      L.adjust = round2((+L.adjust) - n); commit();
    } }, [
      el('span', { class:'stats', text:'İzin kullandım:' }), uinp, el('span', { class:'stats', text:'gün' }),
      el('button', { type:'submit', text:'− Düş' }), uerr
    ]));

    if(keys.length){
      var ul = el('ul', { style:'margin-top:10px' });
      keys.slice(0, 12).forEach(function(k){
        ul.appendChild(el('li', { class:'lrow' }, [
          el('span', { class:'dt', text: fmtDay(k) }),
          leaveNoteInput(k),
          el('span', { class:'tag', text: LEAVE_TYPES[L.days[k]] || 'Fazla çalışma' }),
          delBtn('İşareti', function(){ removeLeaveDay(k); })
        ]));
      });
      nodes.push(ul);
      if(keys.length > 12) nodes.push(el('div', { class:'empty', text:'… ve ' + (keys.length - 12) + ' gün daha (takvimden günü seçerek kaldırabilirsiniz).' }));
    } else {
      nodes.push(el('div', { class:'empty', text:'Henüz işaretlenmiş fazla çalışma günü yok. Takvimde bir gün seçip işaretleyin.' }));
    }
    return el('div', { class:'panel weekly' }, nodes);
  }

  function renderCalendar(){
    var root = document.getElementById('calView'); root.innerHTML = '';
    var byDay = {};
    allDone().forEach(function(x){
      if(!x.it.doneAt) return;
      var k = dayKey(x.it.doneAt);
      (byDay[k] = byDay[k] || []).push(x);
    });

    var todayKey = dayKey(Date.now());
    var startOffset = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    function nav(delta){
      calMonth += delta;
      if(calMonth < 0){ calMonth = 11; calYear--; }
      if(calMonth > 11){ calMonth = 0; calYear++; }
      render();
    }

    var head = el('div', { class:'calhead' }, [
      el('button', { class:'small', text:'‹', onclick:function(){ nav(-1); } }),
      el('h3', { text: MONTHS[calMonth] + ' ' + calYear }),
      el('button', { class:'small', text:'Bugün', onclick:function(){
        var n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); selDay = dayKey(n.getTime()); weekKey = mondayKey(n.getTime()); render();
      } }),
      el('button', { class:'small', text:'›', onclick:function(){ nav(1); } })
    ]);

    var grid = el('div', { class:'calgrid' });
    DOW.forEach(function(d){ grid.appendChild(el('div', { class:'dow', text: d })); });
    for(var i = 0; i < startOffset; i++) grid.appendChild(el('div', { class:'blank' }));
    for(var d = 1; d <= daysInMonth; d++){
      (function(day){
        var key = calYear + '-' + pad(calMonth + 1) + '-' + pad(day);
        var list = byDay[key] || [];
        var cls = 'day' + (key === todayKey ? ' today' : '') + (key === selDay ? ' sel' : '');
        grid.appendChild(el('button', { type:'button', class: cls, 'data-day': key, onclick:function(){ selDay = key; weekKey = mondayKey(keyToDate(key).getTime()); render(); } }, [
          el('span', { class:'num', text: String(day) }),
          list.length ? el('span', { class:'badge', text: '✓ ' + list.length }) : null,
          leaveData().days[key] ? el('span', { class:'xmark', title: LEAVE_TYPES[leaveData().days[key]] || 'Fazla çalışma günü', text:'★ +1' }) : null
        ]));
      })(d);
    }

    var list = (byDay[selDay] || []).slice().sort(function(a, b){ return a.it.doneAt - b.it.doneAt; });
    var mins = 0;
    list.forEach(function(x){ if(x.it.minutes) mins += x.it.minutes; });
    var panel = [
      el('h3', { class:'daytitle', text: fmtDay(selDay) }),
      el('div', { class:'daysum', text: list.length ? list.length + ' madde tamamlandı' + (mins ? ' • toplam çalışma: ' + fmtMin(mins) : '') : 'Bu gün kapatılan iş yok.' })
    ];
    panel.push(dayLeaveBox(selDay));
    var groups = [], idx = {};
    list.forEach(function(x){
      var k = x.p.id + '|' + x.t.id;
      if(!(k in idx)){ idx[k] = groups.length; groups.push({ p: x.p, t: x.t, rows: [] }); }
      groups[idx[k]].rows.push(x);
    });
    groups.forEach(function(g){
      var ul = el('ul');
      g.rows.forEach(function(x){ ul.appendChild(doneRow(g.p, g.t, x.it, true)); });
      panel.push(el('div', { class:'task done-card' }, [
        el('div', { class:'thead' }, [ el('h4', { text: g.p.title + ' › ' + g.t.title }) ]),
        ul
      ]));
    });

    root.appendChild(el('div', { class:'calwrap' }, [
      el('div', null, [ head, grid ]), el('div', null, panel)
    ]));
    root.appendChild(renderLeave());
    root.appendChild(renderWeekly());
  }

  /* ---------- Dashboard: Manuel Yapılan İş Girişi ---------- */
  var manual = { pid: '', tid: '__new__', msg: '', ok: true };
  function localInputValue(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function manualForm(){
    if(manual.pid && !findProject(manual.pid)) manual.pid = '';
    if(!manual.pid && state.projects.length) manual.pid = state.projects[0].id;

    var box = el('form', { class:'manual', novalidate:'novalidate' });
    box.appendChild(el('h2', { text:'➕ Manuel yapılan iş ekle' }));

    if(!state.projects.length){
      box.appendChild(el('div', { class:'empty', text:'Önce "İşler" sekmesinden bir proje ekleyin.' }));
      return box;
    }

    function field(label, node, wide){
      return el('div', { class:'mfield' + (wide ? ' wide' : '') }, [ el('label', { text: label }), node ]);
    }

    var selP = el('select', { 'aria-label':'Proje' }, state.projects.map(function(p){
      return el('option', { value: p.id, text: p.title });
    }));
    selP.value = manual.pid;

    var selT = el('select', { 'aria-label':'İş' });
    var newTask = el('input', { type:'text', maxlength:'100', autocomplete:'off', placeholder:'Yeni iş adı (örn. Tasarım)' });
    var newTaskField = field('Yeni iş adı', newTask);

    function fillTasks(){
      var p = findProject(selP.value);
      selT.innerHTML = '';
      selT.appendChild(el('option', { value:'__new__', text:'➕ Yeni iş oluştur…' }));
      (p ? p.tasks : []).forEach(function(t){ selT.appendChild(el('option', { value: t.id, text: t.title })); });
      var ok = p && manual.tid !== '__new__' && p.tasks.some(function(t){ return t.id === manual.tid; });
      if(!ok) manual.tid = (p && p.tasks.length) ? p.tasks[0].id : '__new__';
      selT.value = manual.tid;
      newTaskField.hidden = (manual.tid !== '__new__');
    }
    selP.addEventListener('change', function(){ manual.pid = selP.value; manual.tid = ''; fillTasks(); });
    selT.addEventListener('change', function(){ manual.tid = selT.value; newTaskField.hidden = (manual.tid !== '__new__'); });
    fillTasks();

    var text = el('input', { type:'text', maxlength:'200', autocomplete:'off', placeholder:'Yapılan işi yazın…' });
    var when = el('input', { type:'datetime-local' });
    when.value = localInputValue(Date.now());
    var dur = el('input', { type:'text', maxlength:'40', autocomplete:'off', placeholder:'örn. 2 saat, 90 dk, 1:30 (isteğe bağlı)' });
    var note = el('textarea', { rows:'2', maxlength:'2000', placeholder:'İsteğe bağlı not…' });
    var msg = el('span', { class:'mmsg' + (manual.msg ? (manual.ok ? ' ok' : ' err') : ''), text: manual.msg });

    box.appendChild(el('div', { class:'mgrid' }, [
      field('Proje', selP), field('İş', selT), newTaskField,
      field('Yapılan iş', text, true),
      field('Tamamlanma tarihi / saati', when), field('Çalışma süresi', dur),
      field('Not', note, true)
    ]));
    box.appendChild(el('div', { class:'mactions' }, [
      el('button', { type:'submit', class:'primary', text:'Kaydet' }), msg
    ]));

    box.addEventListener('submit', function(e){
      e.preventDefault();
      function fail(m){ msg.className = 'mmsg err'; msg.textContent = m; manual.msg = m; manual.ok = false; }
      var p = findProject(selP.value);
      if(!p) return fail('Proje seçin.');
      var v = text.value.trim();
      if(!v) return fail('Yapılan işi yazın.');
      var ts = when.value ? new Date(when.value).getTime() : Date.now();
      if(isNaN(ts)) return fail('Geçerli bir tarih girin.');
      var mins = parseDuration(dur.value);
      if(mins === null) return fail('Süre anlaşılamadı. Örnekler: 4 saat, 90 dk, 1 sa 30 dk, 1:30.');
      var t;
      if(manual.tid === '__new__'){
        var tn = newTask.value.trim();
        if(!tn) return fail('Yeni iş için bir ad yazın.');
        t = { id: uid(), title: tn, createdAt: ts, items: [] };
        p.tasks.push(t);
        manual.tid = t.id;
      } else {
        t = findTask(p.id, manual.tid);
        if(!t) return fail('İş seçin.');
      }
      var it = { id: uid(), text: v, done: true, createdAt: ts, doneAt: ts };
      if(mins !== 'empty') it.minutes = mins;
      var nt = note.value.trim(); if(nt) it.note = nt;
      t.items.push(it);
      manual.pid = p.id; manual.msg = '✓ Eklendi: ' + v; manual.ok = true;
      commit();
    });
    return box;
  }

  function renderDashboard(){
    var root = document.getElementById('dashView'); root.innerHTML = '';
    var done = allDone();
    if(dashFilter && !findProject(dashFilter)) dashFilter = '';
    /* Tarih aralığı filtresi (isteğe bağlı): başlangıç / bitiş günleri dahil, biri boş bırakılabilir */
    var rFrom = dashRange.on && dashRange.from ? keyToDate(dashRange.from).getTime() : null;
    var rTo = dashRange.on && dashRange.to ? keyToDate(dashRange.to).getTime() + 86400000 - 1 : null;
    var swapped = false;
    if(rFrom !== null && rTo !== null && rFrom > rTo){
      swapped = true;
      var tmpF = keyToDate(dashRange.to).getTime(), tmpT = keyToDate(dashRange.from).getTime() + 86400000 - 1;
      rFrom = tmpF; rTo = tmpT;
    }
    var rangeActive = rFrom !== null || rTo !== null;
    var inRange = done.filter(function(x){
      if(!rangeActive) return true;
      var ts = x.it.doneAt; if(!ts) return false;
      return (rFrom === null || ts >= rFrom) && (rTo === null || ts <= rTo);
    });
    var rows = inRange.filter(function(x){ return !dashFilter || x.p.id === dashFilter; });

    var todayKey = dayKey(Date.now());
    var d7 = new Date(); d7.setHours(0, 0, 0, 0); d7.setDate(d7.getDate() - 6);
    var cToday = 0, c7 = 0, mins = 0, noDur = 0;
    rows.forEach(function(x){
      var ts = x.it.doneAt;
      if(ts){
        if(dayKey(ts) === todayKey) cToday++;
        if(ts >= d7.getTime()) c7++;
      }
      if(x.it.minutes) mins += x.it.minutes; else noDur++;
    });

    var wkMinsMap = {}, dayMinsMap = {};
    rows.forEach(function(x){
      var ts = x.it.doneAt; if(!ts || !x.it.minutes) return;
      var wk0 = mondayKey(ts); wkMinsMap[wk0] = (wkMinsMap[wk0] || 0) + x.it.minutes;
      var dk0 = dayKey(ts); dayMinsMap[dk0] = (dayMinsMap[dk0] || 0) + x.it.minutes;
    });
    var wkMins = wkMinsMap[mondayKey(Date.now())] || 0;

    var sel = el('select', { 'aria-label':'Proje filtresi', onchange:function(e){ dashFilter = e.target.value; render(); } },
      [ el('option', { value:'', text:'Tüm projeler' }) ].concat(state.projects.map(function(p){
        return el('option', { value: p.id, text: p.title });
      })));
    sel.value = dashFilter;
    root.appendChild(el('div', { class:'dashbar' }, [ el('span', { class:'stats', text:'Proje:' }), sel ]));

    /* Tarih aralığı çubuğu */
    var rOn = el('input', { type:'checkbox', id:'rangeOn', 'aria-label':'Tarih aralığı filtresini etkinleştir' });
    rOn.checked = dashRange.on;
    rOn.addEventListener('change', function(){ dashRange.on = rOn.checked; render(); });
    var fromI = el('input', { type:'date', 'aria-label':'Başlangıç tarihi' });
    var toI = el('input', { type:'date', 'aria-label':'Bitiş tarihi' });
    fromI.value = dashRange.from; toI.value = dashRange.to;
    fromI.disabled = toI.disabled = !dashRange.on;
    fromI.addEventListener('change', function(){ dashRange.from = fromI.value; render(); });
    toI.addEventListener('change', function(){ dashRange.to = toI.value; render(); });
    function quick(label, fn){
      var b = el('button', { type:'button', class:'small', text: label, onclick:function(){
        var r = fn(); dashRange.on = true; dashRange.from = r[0]; dashRange.to = r[1]; render();
      } });
      b.disabled = !dashRange.on;
      return b;
    }
    var rangeBar = el('div', { class:'dashbar' }, [
      el('label', { class:'stats', for:'rangeOn', style:'display:flex;align-items:center;gap:6px;cursor:pointer' }, [ rOn, el('span', { text:'Tarih aralığı:' }) ]),
      fromI, el('span', { class:'stats', text:'–' }), toI,
      quick('Bu hafta', function(){ var k = mondayKey(Date.now()); return [ k, shiftKey(k, 6) ]; }),
      quick('Bu ay', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), 1).getTime()), dayKey(new Date(n.getFullYear(), n.getMonth() + 1, 0).getTime()) ]; }),
      quick('Son 30 gün', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 29).getTime()), dayKey(n.getTime()) ]; }),
      el('button', { type:'button', class:'small', text:'Temizle', disabled: (!dashRange.from && !dashRange.to) ? 'disabled' : null,
        onclick:function(){ dashRange.from = ''; dashRange.to = ''; render(); } })
    ]);
    if(!(!dashRange.from && !dashRange.to)) rangeBar.lastChild.removeAttribute('disabled'); else rangeBar.lastChild.setAttribute('disabled', 'disabled');
    root.appendChild(rangeBar);
    if(dashRange.on && !rangeActive){
      root.appendChild(el('div', { class:'empty', text:'Filtre açık ama tarih seçilmedi; tüm tarihler gösteriliyor.' }));
    } else if(rangeActive){
      var lblF = rFrom !== null ? new Date(rFrom).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'başlangıç';
      var lblT = rTo !== null ? new Date(rTo).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'bugün ve sonrası';
      root.appendChild(el('div', { class:'daysum', text:'🔎 ' + lblF + ' – ' + lblT + ' aralığı gösteriliyor: ' + rows.length + ' madde' + (mins ? ' • ' + fmtMin(mins) : '') + (swapped ? ' (başlangıç bitişten sonraydı, yer değiştirildi)' : '') }));
    }
    root.appendChild(manualForm());

    function tile(v, l){ return el('div', { class:'tile' }, [ el('div', { class:'v', text: v }), el('div', { class:'l', text: l }) ]); }
    root.appendChild(el('div', { class:'tiles' }, [
      tile(String(rows.length), rangeActive ? 'Aralıktaki tamamlanan' : 'Toplam tamamlanan'),
      tile(String(cToday), 'Bugün'),
      tile(String(c7), 'Son 7 gün'),
      tile(mins ? fmtMin(mins) : '—', 'Toplam çalışma süresi'),
      tile(wkMins ? fmtMin(wkMins) : '—', 'Bu hafta çalışma süresi'),
      tile(String(noDur), 'Süresi girilmemiş'),
      tile(fmtDays(leaveTotal()), 'Kazanılan izin')
    ]));

    var counts = {};
    rows.forEach(function(x){ if(x.it.doneAt){ var k = dayKey(x.it.doneAt); counts[k] = (counts[k] || 0) + 1; } });
    var days = [], max = 1;
    for(var i = 13; i >= 0; i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = dayKey(d.getTime());
      var c = counts[k] || 0;
      if(c > max) max = c;
      days.push({ key: k, day: d.getDate(), count: c, mins: dayMinsMap[k] || 0 });
    }
    var chart = el('div', { class:'chart', role:'img' });
    days.forEach(function(x){
      chart.appendChild(el('div', { class:'cc', title: fmtDay(x.key) + ': ' + x.count + ' madde' + (x.mins ? ' • ' + fmtMin(x.mins) : '') }, [
        el('span', { class:'val', text: x.count ? String(x.count) : '' }),
        el('div', { class:'bar' + (x.count ? '' : ' zero'), style:'height:' + (x.count ? Math.max(4, Math.round(x.count / max * 100)) : 2) + 'px' }),
        el('span', { class:'lbl', text: String(x.day) })
      ]));
    });
    root.appendChild(el('div', { class:'panel' }, [ el('h2', { text:'Son 14 günde tamamlanan maddeler' }), chart ]));

    /* Haftalık toplam çalışma süresi (son 8 hafta) */
    var wdata = [], wmax = 1, curWk = mondayKey(Date.now());
    for(var wi = 7; wi >= 0; wi--){
      var wkKey2 = shiftKey(curWk, -7 * wi), wm = wkMinsMap[wkKey2] || 0;
      if(wm > wmax) wmax = wm;
      wdata.push({ key: wkKey2, m: wm });
    }
    var wchart = el('div', { class:'chart', role:'img' });
    var anyWk = false;
    wdata.forEach(function(w){
      if(w.m) anyWk = true;
      var ws = keyToDate(w.key), we = keyToDate(shiftKey(w.key, 6));
      var shortFmt = { day:'numeric', month:'short' };
      var lbl = ws.toLocaleDateString('tr-TR', shortFmt);
      wchart.appendChild(el('div', { class:'cc', title: lbl + ' – ' + we.toLocaleDateString('tr-TR', shortFmt) + ' haftası: ' + (w.m ? fmtMin(w.m) : 'süre girilmemiş') }, [
        el('span', { class:'val', text: w.m ? String(Math.round(w.m / 6) / 10).replace('.', ',') + ' sa' : '' }),
        el('div', { class:'bar' + (w.m ? '' : ' zero'), style:'height:' + (w.m ? Math.max(4, Math.round(w.m / wmax * 100)) : 2) + 'px' }),
        el('span', { class:'lbl', text: lbl })
      ]));
    });
    root.appendChild(el('div', { class:'panel' }, [
      el('h2', { text:'Haftalık toplam çalışma süresi (son 8 hafta)' }), wchart,
      anyWk ? null : el('div', { class:'empty', text:'Bu haftalarda süre girilmiş madde yok.' })
    ]));

    var agg = {};
    inRange.forEach(function(x){
      var a = agg[x.p.id] = agg[x.p.id] || { p: x.p, n: 0, m: 0, last: 0 };
      a.n++; if(x.it.minutes) a.m += x.it.minutes;
      if((x.it.doneAt || 0) > a.last) a.last = x.it.doneAt || 0;
    });
    var aggList = Object.keys(agg).map(function(k){ return agg[k]; }).sort(function(a, b){ return b.n - a.n; });
    root.appendChild(el('h2', { text:'Proje özeti' }));
    if(aggList.length){
      var tb = el('tbody');
      aggList.forEach(function(a){
        tb.appendChild(el('tr', null, [
          el('td', { text: a.p.title }),
          el('td', { class:'nw', text: String(a.n) }),
          el('td', { class:'nw', text: a.m ? fmtMin(a.m) : '—' }),
          el('td', { class:'nw', text: fmt(a.last) })
        ]));
      });
      root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
        el('thead', null, [ el('tr', null, [ el('th', { text:'Proje' }), el('th', { text:'Tamamlanan' }), el('th', { text:'Çalışma süresi' }), el('th', { text:'Son tamamlanma' }) ]) ]),
        tb
      ]) ]));
    } else {
      root.appendChild(el('div', { class:'empty', text: rangeActive ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
    }

    root.appendChild(el('h2', { text:'Tamamlanan işler' }));
    if(rows.length){
      var sorted = rows.slice().sort(function(a, b){ return (b.it.doneAt || 0) - (a.it.doneAt || 0); });
      var body = el('tbody');
      sorted.forEach(function(x){
        var itemCell = el('td', null, editKey === 'i:' + x.it.id
          ? [ editForm(x.it.text, 200, function(v){ editItem(x.p.id, x.t.id, x.it.id, v); }) ]
          : [ el('div', { text: x.it.text }),
              el('div', { class:'rowacts' }, [ noteBtn(x.it), editBtn('i:' + x.it.id, 'Maddeyi') ]),
              noteBlock(x.it) ]);
        var editingDate = editKey === 'd:' + x.it.id;
        body.appendChild(el('tr', null, [
          el('td', { class: editingDate ? '' : 'nw' }, [ editingDate ? dateForm(x.it) : dateBtn(x.it, false) ]),
          el('td', { text: x.p.title }),
          el('td', { text: x.t.title }),
          itemCell,
          el('td', null, [ editKey === 'm:' + x.it.id ? durForm(x.it) : durBtn(x.it) ])
        ]));
      });
      root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
        el('thead', null, [ el('tr', null, [ el('th', { text:'Tamamlanma' }), el('th', { text:'Proje' }), el('th', { text:'İş' }), el('th', { text:'Madde' }), el('th', { text:'Süre' }) ]) ]),
        body
      ]) ]));
    } else {
      root.appendChild(el('div', { class:'empty', text: rangeActive ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
    }
  }

  function updateStats(){
    var open = 0, done = 0;
    state.projects.forEach(function(p){ p.tasks.forEach(function(t){ t.items.forEach(function(i){
      if(i.done) done++; else open++;
    }); }); });
    document.getElementById('stats').textContent = open + ' açık • ' + done + ' tamamlandı';
  }

  function render(focusKey){
    updateStats();
    ['tasks', 'cal', 'dash', 'search'].forEach(function(k){ document.getElementById('tab-' + k).hidden = (k !== tab); });
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    if(tab === 'tasks') renderTasks();
    else if(tab === 'cal') renderCalendar();
    else if(tab === 'search') renderSearch();
    else renderDashboard();

    var target = null;
    if(editKey){
      target = document.querySelector('[data-edit]');
      if(target){
        if(target.tagName === 'TEXTAREA'){ var n = target.value.length; target.setSelectionRange(n, n); }
        else target.select();
      }
    } else if(focusKey){
      target = document.querySelector('[data-key="' + focusKey + '"]');
    }
    if(target) target.focus();
  }

  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.addEventListener('click', function(){
      tab = b.getAttribute('data-tab');
      editKey = null;
      render();
      if(tab === 'search'){ var si = document.getElementById('searchInput'); si.focus(); si.select(); }
    });
  });
  document.getElementById('projectForm').addEventListener('submit', function(e){
    e.preventDefault();
    var inp = document.getElementById('projectInput');
    addProject(inp.value);
    inp.value = '';
  });
  document.getElementById('clearDone').addEventListener('click', clearDone);
  document.getElementById('searchInput').addEventListener('input', function(e){ searchQ = e.target.value; renderSearch(); });
  document.getElementById('searchInput').addEventListener('keydown', function(e){
    if(e.key === 'Escape' && searchQ){ e.preventDefault(); searchQ = ''; renderSearch(); }
  });
  /* "/" veya Ctrl+K ile her yerden aramaya geç */
  document.addEventListener('keydown', function(e){
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openSearch(); }
    else if(e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); openSearch(); }
  });

  var now0 = new Date();
  calYear = now0.getFullYear(); calMonth = now0.getMonth(); selDay = dayKey(now0.getTime());
  weekKey = mondayKey(now0.getTime());

  render();
  updateBar();
  initFileHandle();
  driveInit();
})();
</script>
