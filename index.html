/* --- ajanda: geciken / bugün / bu hafta --------------------------------- */
function renderAgenda(){
  var box = document.getElementById('agendaBox');
  clear(box);
  var list = dueItems();
  if(!list.length) return;
  var tk = todayKey();
  var over = list.filter(function(x){ return dayDiff(x.due, tk) < 0; });
  var today = list.filter(function(x){ return dayDiff(x.due, tk) === 0; });
  var week = list.filter(function(x){ var d = dayDiff(x.due, tk); return d > 0 && d <= 7; });
  var det = el('details', { class:'agenda' + (over.length ? '' : ' clean') });
  if(over.length || today.length) det.setAttribute('open', '');
  det.appendChild(el('summary', null, [
    el('span', { text: over.length ? '⏳ ' + over.length + ' geciken iş' : '📅 Son tarihli işler' }),
    el('span', { class:'count', text: today.length + ' bugün • ' + week.length + ' bu hafta' })
  ]));
  function sec(title, rows, cls){
    if(!rows.length) return null;
    var ul = el('ul');
    rows.forEach(function(x){
      var d = dueInfo(x.due, false);
      ul.appendChild(el('li', null, [
        prioChip(x.it || x.t),
        el('button', { class:'sitem', style:'flex:1 1 200px;text-align:left;border:0;background:none;padding:4px 0;color:var(--text)',
          text: x.text, title:'Bulunduğu yere git', onclick:function(){ goTask((x.it || x.t).id); } }),
        el('span', { class:'due ' + d.cls, text:'📅 ' + d.label }),
        el('span', { class:'created-tag', text: x.p.title + ' › ' + x.t.title + (x.kind === 'task' ? ' (iş)' : '') })
      ]));
    });
    return el('div', { class:'gsec' }, [ el('h4', { class: cls, text: title }), ul ]);
  }
  det.appendChild(sec('Gecikenler', over) || el('span'));
  det.appendChild(sec('Bugün', today) || el('span'));
  det.appendChild(sec('Önümüzdeki 7 gün', week) || el('span'));
  box.appendChild(det);
}

      var thead;

        thead = el('div', { class:'thead' }, [ editForm(t.title, 100, function(v){ renameTask(p.id, t.id, v); }) ]);
      } else {
        var isDone = taskIsDone(t);
        var stsel = null;
        if(!isDone){
          stsel = el('select', { class:'tsel st-' + (t.status || 'todo'), 'aria-label':'İş durumu',
            onchange:function(e){ t.status = e.target.value; commit(); } },
            TSTATUS.map(function(o){ return el('option', { value:o[0], text:o[1] }); }));
          stsel.value = t.status || 'todo';
        }
        var completeBtn = el('button', { class:'done-btn', text:'✓ İşi Tamamla', title:'Bu işin tüm açık maddelerini tamamla',
          onclick:function(){ completeTask(p.id, t.id); } });
        if(!open.length) completeBtn.disabled = true;
        thead = el('div', { class:'thead' }, [
          el('h4', { text: t.title }),
          t.archived ? el('span', { class:'tag', text:'arşiv' }) : null,
          prioChip(t), dueChip(t, isDone),
          isDone ? el('span', { class:'count', style:'color:var(--ok)', text:'✓ tamamlandı' }) : stsel,
          el('span', { class:'count', text: open.length + ' açık' }),
          completeBtn,
          taskMenu(p, t)
        ]);
      }
      var ul = el('ul');
      var ordered = sortBy(open);
      ordered.forEach(function(it){ ul.appendChild(openRow(p, t, it)); });
      taskNodes.push(el('div', { class:'task', 'data-sid': t.id }, [
        thead, noteBlock(t),
        open.length ? ul : el('div', { class:'empty', text: items.length ? 'Tüm maddeler tamamlandı.' : 'Henüz iş maddesi yok.' }),
        addForm('Yeni iş maddesi ekle…', 'item:' + t.id, 200, function(v){ addItem(p.id, t.id, v); })
      ]));
    });

    var phead;
    if(editKey === 'p:' + p.id){
      phead = el('div', { class:'phead' }, [ editForm(p.title, 80, function(v){ renameProject(p.id, v); }) ]);
    } else {
      phead = el('div', { class:'phead' }, [
        el('h3', { text: p.title }),
        p.archived ? el('span', { class:'tag', text:'arşiv' }) : null,
        el('span', { class:'count', text: vis.length + ' iş • ' + pOpen + ' açık madde' }),
        projectMenu(p)
      ]);
    }
    var nodes = [ phead, noteBlock(p), remindersBlock(p) ];
    if(!vis.length) nodes.push(el('div', { class:'empty', text:'Bu projede henüz iş yok.' }));
    taskNodes.forEach(function(n){ nodes.push(n); });
    var tf = addForm('Bu projeye yeni iş ekle…', 'task:' + p.id, 100, function(v){ addTask(p.id, v); }, 'İş Ekle');
    tf.className += ' addtask';
    nodes.push(tf);
    projEl.appendChild(el('div', { class:'project', 'data-sid': p.id }, nodes));
  });

  /* Tamamlananlar: en yeniden eskiye, sınırlı sayıda */
  doneRows.sort(function(a, b){ return (b.it.doneAt || 0) - (a.it.doneAt || 0); });
  var total = doneRows.length;
  var slice = doneShowAll ? doneRows : doneRows.slice(0, DONE_LIMIT);
  if(!total) doneEl.appendChild(el('div', { class:'empty', text:'Tamamlanan iş yok.' }));
  else {
    var groups = [], idx = {};
    slice.forEach(function(x){
      var k = x.p.id + '|' + x.t.id;
      if(!(k in idx)){ idx[k] = groups.length; groups.push({ p:x.p, t:x.t, rows:[] }); }
      groups[idx[k]].rows.push(x);
    });
    groups.forEach(function(g){
      var ul = el('ul');
      g.rows.forEach(function(x){ ul.appendChild(doneRow(g.p, g.t, x.it, false)); });
      doneEl.appendChild(el('div', { class:'project done-card' }, [
        el('div', { class:'phead' }, [
          el('h3', { text: g.p.title }),
          el('span', { class:'count', text: g.t.title })
        ]), ul
      ]));
    });
    if(total > slice.length){
      doneEl.appendChild(el('button', { class:'small', text:'↓ ' + (total - slice.length) + ' tamamlanmış madde daha göster',
        onclick:function(){ doneShowAll = true; render(); } }));
    } else if(doneShowAll && total > DONE_LIMIT){
      doneEl.appendChild(el('button', { class:'small', text:'↑ Listeyi kısalt', onclick:function(){ doneShowAll = false; render(); } }));
    }
  }
}

function renderCalendar(){
  var root = clear(document.getElementById('calView'));
  var byDay = {};
  allDone().forEach(function(x){
    if(!x.it.doneAt) return;
    var k = dayKey(x.it.doneAt);
    (byDay[k] = byDay[k] || []).push(x);
  });
  var dueMap = dueByDay();
  var tk = todayKey();
  var startOffset = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  function nav(delta){
    calMonth += delta;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    render();
  }
  var head = el('div', { class:'calhead' }, [
    el('button', { class:'small', text:'‹', title:'Önceki ay', 'aria-label':'Önceki ay', onclick:function(){ nav(-1); } }),
    el('h3', { text: MONTHS[calMonth] + ' ' + calYear }),
    el('button', { class:'small', text:'Bugün', onclick:function(){
      var n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); selDay = dayKey(n.getTime()); weekKey = mondayKey(n.getTime()); render();
    } }),
    el('button', { class:'small', text:'›', title:'Sonraki ay', 'aria-label':'Sonraki ay', onclick:function(){ nav(1); } })
  ]);

  var grid = el('div', { class:'calgrid', role:'grid', 'aria-label': MONTHS[calMonth] + ' ' + calYear + ' takvimi' });
  DOW.forEach(function(d){ grid.appendChild(el('div', { class:'dow', text:d })); });
  for(var i = 0; i < startOffset; i++) grid.appendChild(el('div', { class:'blank' }));
  for(var d = 1; d <= daysInMonth; d++){
    (function(day){
      var key = calYear + '-' + pad(calMonth + 1) + '-' + pad(day);
      var list = byDay[key] || [], dues = dueMap[key] || [], alarms = alarmsForDay(key);
      var lv = leaveData().days[key];
      var over = dayDiff(key, tk) < 0;
      var lbl = [ fmtDay(key) ];
      if(list.length) lbl.push(list.length + ' madde tamamlandı');
      if(dues.length) lbl.push(dues.length + ' işin son tarihi');
      if(alarms.length) lbl.push(alarms.length + ' hatırlatıcı');
      if(lv) lbl.push((LEAVE_TYPES[lv.type] || 'Fazla çalışma') + ' +' + fmtNum(lv.amount) + ' gün');
      grid.appendChild(el('button', { type:'button', class:'day' + (key === tk ? ' today' : '') + (key === selDay ? ' sel' : ''),
        'data-day': key, 'aria-label': lbl.join(', '), 'aria-current': key === tk ? 'date' : null,
        onclick:function(){ selDay = key; weekKey = mondayKey(keyToDate(key).getTime()); render(); } }, [
        el('span', { class:'num', text:String(day) }),
        el('span', { class:'chips' }, [
          list.length ? el('span', { class:'badge', text:'✓ ' + list.length }) : null,
          dues.length ? el('span', { class:'dmark' + (over ? ' over' : ''), text:'📅 ' + dues.length }) : null,
          alarms.length ? el('span', { class:'dmark al', text:'⏰ ' + alarms.length }) : null,
          lv ? el('span', { class:'xmark', text:'★ +' + fmtNum(lv.amount) }) : null
        ])
      ]));
    })(d);
  }

  var list = (byDay[selDay] || []).slice().sort(function(a, b){ return (a.it.doneAt || 0) - (b.it.doneAt || 0); });
  var mins = 0;
  list.forEach(function(x){ if(x.it.minutes) mins += x.it.minutes; });
  var panel = [
    el('h3', { class:'daytitle', text: fmtDay(selDay) }),
    el('div', { class:'daysum', text: list.length ? list.length + ' madde tamamlandı' + (mins ? ' • toplam çalışma: ' + fmtMin(mins) : '') : 'Bu gün kapatılan iş yok.' })
  ];
  panel.push(dayLeaveBox(selDay));

  /* o güne ait son tarihler */
  var dues = dueMap[selDay] || [];
  if(dues.length){
    var dul = el('ul');
    dues.forEach(function(x){
      var di = dueInfo(x.due, false);
      dul.appendChild(el('li', null, [
        prioChip(x.it || x.t),
        el('span', { class:'txt', text: x.text }),
        el('span', { class:'due ' + di.cls, text:'📅 ' + di.label }),
        el('span', { class:'created-tag', text: x.p.title + ' › ' + x.t.title }),
        el('button', { class:'small', text:'→ Git', onclick:function(){ goTask((x.it || x.t).id); } })
      ]));
    });
    panel.push(el('div', { class:'panel' }, [ el('h2', { text:'📅 Bu günün son tarihleri (' + dues.length + ')' }), dul ]));
  }
  /* o güne ait hatırlatıcılar */
  var als = alarmsForDay(selDay);
  if(als.length){
    var aul = el('ul');
    als.forEach(function(a){
      aul.appendChild(el('li', null, [
        el('span', { class:'txt rtxt', text: a.text }),
        el('span', { class:'created-tag', text: fmtTime(a.at) }),
        a.at <= Date.now() ? el('span', { class:'tag', text:'zamanı geldi' }) : null,
        el('button', { class:'small', text:'→ Hatırlatıcılar', onclick:function(){ switchTab('alarm'); flashEl(findBySid(a.id)); } })
      ]));
    });
    panel.push(el('div', { class:'panel' }, [ el('h2', { text:'⏰ Bu günün hatırlatıcıları (' + als.length + ')' }), aul ]));
  }

  var groups = [], idx = {};
  list.forEach(function(x){
    var k = x.p.id + '|' + x.t.id;
    if(!(k in idx)){ idx[k] = groups.length; groups.push({ p:x.p, t:x.t, rows:[] }); }
    groups[idx[k]].rows.push(x);
  });
  groups.forEach(function(g){
    var ul = el('ul');
    g.rows.forEach(function(x){ ul.appendChild(doneRow(g.p, g.t, x.it, true)); });
    panel.push(el('div', { class:'task done-card' }, [
      el('div', { class:'thead' }, [ el('h4', { text: g.p.title + ' › ' + g.t.title }) ]), ul
    ]));
  });

  root.appendChild(el('div', { class:'calwrap' }, [ el('div', null, [ head, grid ]), el('div', null, panel) ]));
  root.appendChild(renderLeave());
  root.appendChild(renderWeekly());
}

function renderLeave(){
  var L = leaveData();
  var keys = Object.keys(L.days).sort().reverse();
  var nH = 0, nW = 0;
  keys.forEach(function(k){ if(L.days[k].type === 'holiday') nH++; else nW++; });
  var earned = leaveEarned(), used = leaveUsed(), total = leaveTotal();
  var nodes = [ el('h2', { text:'🏖 Kazanılan izin' }) ];

  nodes.push(el('div', { class:'leavetop' }, [
    el('span', { class:'leaveval', text: fmtDays(total) }),
    el('span', { class:'stats', text:'kalan' })
  ]));
  nodes.push(el('div', { class:'daysum', text:
    'Kazanılan: ' + fmtDays(earned) + ' (' + LEAVE_TYPES.weekend + ': ' + nW + ' gün işaret, ' + LEAVE_TYPES.holiday + ': ' + nH + ') • Kullanılan: ' + fmtDays(used) }));

  /* izin kullanımı */
  var uinp = el('input', { type:'text', inputmode:'decimal', maxlength:'6', autocomplete:'off', 'aria-label':'Kullanılan izin (gün)' });
  uinp.value = '1';
  var udate = el('input', { type:'date', 'aria-label':'İzin tarihi' });
  udate.value = todayKey();
  var unote = el('input', { type:'text', maxlength:'200', autocomplete:'off', placeholder:'Not (örn. yıllık izin)', 'aria-label':'İzin notu' });
  var uerr = el('span', { class:'err' });
  nodes.push(el('form', { class:'xbox leaveuse', onsubmit:function(e){
    e.preventDefault();
    var n = parseFloat(String(uinp.value).replace(',', '.'));
    if(!isFinite(n) || n <= 0){ uerr.textContent = 'Düşülecek gün sayısını girin (örn. 1 veya 0,5).'; return; }
    uerr.textContent = '';
    addLeaveEntry('used', -n, unote.value, isDayKey(udate.value) ? udate.value : todayKey());
    unote.value = '';
    toast('İzin kullanımı kaydedildi: ' + fmtDays(n));
  } }, [
    el('span', { class:'stats', text:'İzin kullandım:' }), uinp, el('span', { class:'stats', text:'gün •' }),
    udate, unote,
    el('button', { type:'submit', text:'− Düş' }), uerr
  ]));

  /* elle düzeltme */
  if(editKey === 'leaveadj'){
    var ainp = el('input', { type:'text', inputmode:'decimal', maxlength:'8', autocomplete:'off', 'data-edit':'1', 'aria-label':'Düzeltme (gün)' });
    ainp.value = '';
    var anote = el('input', { type:'text', maxlength:'200', autocomplete:'off', placeholder:'Açıklama', 'aria-label':'Açıklama' });
    var aerr = el('span', { class:'err' });
    ainp.addEventListener('keydown', escCancel);
    nodes.push(el('form', { class:'xbox', onsubmit:function(e){
      e.preventDefault();
      var v = parseFloat(String(ainp.value).replace(',', '.'));
      if(!isFinite(v) || !v){ aerr.textContent = 'Eklenecek / düşülecek gün sayısını girin (örn. 2 veya -1,5).'; return; }
      editKey = null;
      addLeaveEntry('adjust', v, anote.value);
    } }, [
      el('span', { class:'stats', text:'Elle düzeltme:' }), ainp, el('span', { class:'stats', text:'gün' }), anote,
      el('button', { type:'submit', class:'primary small', text:'Ekle' }),
      el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit }), aerr
    ]));
  } else {
    nodes.push(el('div', { class:'rowacts' }, [
      el('button', { class:'icon', text:'± Elle düzeltme ekle', title:'Devirden gelen izin, elle kesinti vb.', onclick:function(){ startEdit('leaveadj'); } })
    ]));
  }

  /* hareket defteri */
  if(L.ledger.length){
    var ul = el('ul', { class:'ledger', style:'margin-top:10px' });
    L.ledger.slice().sort(function(a, b){ return (b.at < a.at ? -1 : b.at > a.at ? 1 : 0); }).slice(0, 20).forEach(function(e){
      ul.appendChild(el('li', null, [
        el('span', { class:'amt ' + (e.amount > 0 ? 'plus' : 'minus'), text:(e.amount > 0 ? '+' : '') + fmtNum(e.amount) + ' gün' }),
        el('span', { class:'dt', text: fmtDay(e.at) }),
        el('span', { class:'txt', text: e.note || (e.kind === 'used' ? 'İzin kullanıldı' : 'Düzeltme') }),
        el('button', { class:'icon del', text:'🗑', title:'Hareketi sil', 'aria-label':'Hareketi sil', onclick:function(){ deleteLeaveEntry(e.id); } })
      ]));
    });
    nodes.push(el('h2', { style:'margin-top:14px', text:'Hareketler' }));
    nodes.push(ul);
    if(L.ledger.length > 20) nodes.push(el('div', { class:'empty', text:'… ve ' + (L.ledger.length - 20) + ' hareket daha.' }));
  }

  /* işaretli fazla çalışma günleri */
  if(keys.length){
    var dul = el('ul', { style:'margin-top:10px' });
    keys.slice(0, 12).forEach(function(k){
      dul.appendChild(el('li', { class:'lrow' }, [
        el('span', { class:'dt', text: fmtDay(k) }),
        el('span', { class:'amt plus', text:'+' + fmtNum(L.days[k].amount) }),
        leaveNoteInput(k),
        el('span', { class:'tag', text: LEAVE_TYPES[L.days[k].type] || 'Fazla çalışma' }),
        el('button', { class:'icon del', text:'🗑', title:'İşareti sil', 'aria-label':'İşareti sil', onclick:function(){ removeLeaveDay(k); } })
      ]));
    });
    nodes.push(el('h2', { style:'margin-top:14px', text:'Fazla çalışılan günler' }));
    nodes.push(dul);
    if(keys.length > 12) nodes.push(el('div', { class:'empty', text:'… ve ' + (keys.length - 12) + ' gün daha (takvimden günü seçerek kaldırabilirsiniz).' }));
  } else {
    nodes.push(el('div', { class:'empty', text:'Henüz işaretlenmiş fazla çalışma günü yok. Takvimde bir gün seçip işaretleyin.' }));
  }
  return el('div', { class:'panel weekly' }, nodes);
}

    el('h3', { text: title + (isThis ? ' (bu hafta)' : '') }),
    el('button', { class:'small', text:'Bu hafta', onclick:function(){ weekKey = mondayKey(Date.now()); editKey = null; render(); } }),
    el('button', { class:'small', text:'›', title:'Sonraki hafta', 'aria-label':'Sonraki hafta', onclick:function(){ weekKey = shiftKey(weekKey, 7); editKey = null; render(); } })
  ]);
  var nodes = [ el('h2', { text:'Haftalık plan' }), head,
    el('div', { class:'daysum', text: items.length ? doneCount + ' / ' + items.length + ' iş tamamlandı' : 'Bu hafta için henüz iş girilmedi.' }) ];

  if(items.length){
    var ul = el('ul');
    items.forEach(function(it){
      var st = it.status || 'planned';
      if(editKey === 'w:' + it.id){
        ul.appendChild(el('li', null, [ editForm(it.text, 200, function(v){ setWeekEdit(it.id, v); }) ]));
        return;
      }
      var sel = el('select', { class:'wsel st-' + st, 'aria-label':'Durum', onchange:function(ev){ it.status = ev.target.value; commit(); } },
        WSTATUS.map(function(o){ return el('option', { value:o[0], text:o[1] }); }));
      sel.value = st;
      ul.appendChild(el('li', { 'data-sid': it.id }, [
        el('span', { class:'txt wtxt st-' + st, text: it.text }),

        menu([
          mBtn(it.note ? '📝 Notu düzenle' : '📝 Not ekle', function(){ startEdit('n:' + it.id); }),
          mBtn('✎ Metni düzenle', function(){ startEdit('w:' + it.id); }),
          mBtn('🗑 Sil', function(){ deleteWeekItem(it.id); }, 'del')
        ]),
        noteBlock(it)
      ]));
    });
    nodes.push(ul);
  }
  nodes.push(addForm('Bu hafta yapılması gereken işi ekle…', 'week', 200, addWeekItem));
  return el('div', { class:'panel weekly' }, nodes);
}

    clear(selT);
    selT.appendChild(el('option', { value:'__new__', text:'➕ Yeni iş oluştur…' }));
    (p ? activeTasks(p) : []).forEach(function(t){ selT.appendChild(el('option', { value:t.id, text:t.title })); });
    var ok = p && manual.tid !== '__new__' && p.tasks.some(function(t){ return t.id === manual.tid && !t.archived; });
    if(!ok) manual.tid = (p && activeTasks(p).length) ? activeTasks(p)[0].id : '__new__';
    selT.value = manual.tid;
    newTaskField.hidden = (manual.tid !== '__new__');
  }
  selP.addEventListener('change', function(){ manual.pid = selP.value; manual.tid = ''; fillTasks(); });
  selT.addEventListener('change', function(){ manual.tid = selT.value; newTaskField.hidden = (manual.tid !== '__new__'); });
  fillTasks();

  var text = el('input', { type:'text', maxlength:'200', autocomplete:'off', placeholder:'Yapılan işi yazın…' });
  var when = el('input', { type:'datetime-local' });
  when.value = manual.when || localInputValue(Date.now());      /* girilen tarih korunur */
  when.addEventListener('change', function(){ manual.when = when.value; });
  var dur = el('input', { type:'text', maxlength:'40', autocomplete:'off', placeholder:'örn. 2 saat, 90 dk, 1:30 (isteğe bağlı)' });
  var note = el('textarea', { rows:'2', maxlength:'2000', placeholder:'İsteğe bağlı not…' });
  var msg = el('span', { class:'mmsg' + (manual.msg ? (manual.ok ? ' ok' : ' err') : ''), text: manual.msg });

  form.appendChild(el('div', { class:'mgrid' }, [
    field('Proje', selP), field('İş', selT), newTaskField,
    field('Yapılan iş', text, true),
    field('Tamamlanma tarihi / saati', when), field('Çalışma süresi', dur),
    field('Not', note, true)
  ]));
  form.appendChild(el('div', { class:'mactions' }, [ el('button', { type:'submit', class:'primary', text:'Kaydet' }), msg ]));
  form.addEventListener('submit', function(e){
    e.preventDefault();
    function fail(m){ msg.className = 'mmsg err'; msg.textContent = m; manual.msg = m; manual.ok = false; }
    var p = findProject(selP.value);
    if(!p) return fail('Proje seçin.');
    var v = text.value.trim();
    if(!v) return fail('Yapılan işi yazın.');
    var ts = parseWhen(when.value);
    if(ts === null) return fail('Geçerli bir tarih girin.');
    var mins = parseDuration(dur.value);
    if(mins === null) return fail('Süre anlaşılamadı. Örnekler: 4 saat, 90 dk, 1 sa 30 dk, 1:30.');
    var t;
    if(manual.tid === '__new__'){
      var tn = newTask.value.trim();
      if(!tn) return fail('Yeni iş için bir ad yazın.');
      t = { id: uid(), title: tn, createdAt: ts, items: [], status:'doing', priority:0, archived:null };
      p.tasks.push(t);
      manual.tid = t.id;
    } else {
      t = findTask(p.id, manual.tid);
      if(!t) return fail('İş seçin.');
    }
    var it = { id: uid(), text: v, done:true, createdAt: ts, doneAt: ts, priority:0, archived:null };
    if(mins !== 'empty') it.minutes = mins;
    var nt = note.value.trim(); if(nt) it.note = nt;
    t.items.push(it);
    manual.pid = p.id; manual.when = when.value; manual.open = true;
    manual.msg = '✓ Eklendi: ' + snip(v, 40); manual.ok = true;
    commit();
    toast('Eklendi: ' + snip(v, 40));
  });
  det.appendChild(form);
  return det;
}

function rangeBounds(){
  var rFrom = dashRange.on && dashRange.from ? keyToDate(dashRange.from).getTime() : null;
  var rTo = dashRange.on && dashRange.to ? keyToDate(dashRange.to).getTime() + 86400000 - 1 : null;
  var swapped = false;
  if(rFrom !== null && rTo !== null && rFrom > rTo){
    swapped = true;
    var f = keyToDate(dashRange.to).getTime(), t = keyToDate(dashRange.from).getTime() + 86400000 - 1;
    rFrom = f; rTo = t;
  }
  return { from:rFrom, to:rTo, active: rFrom !== null || rTo !== null, swapped: swapped };
}
function renderDashboard(){
  var root = clear(document.getElementById('dashView'));
  if(dashFilter && !findProject(dashFilter)) dashFilter = '';
  var byProject = allDone().filter(function(x){ return !dashFilter || x.p.id === dashFilter; });
  var R = rangeBounds();
  var rows = byProject.filter(function(x){
    if(!R.active) return true;
    var ts = x.it.doneAt; if(!ts) return false;
    return (R.from === null || ts >= R.from) && (R.to === null || ts <= R.to);
  });

  /* filtreler */
  var sel = el('select', { 'aria-label':'Proje filtresi', onchange:function(e){ dashFilter = e.target.value; render(); } },
    [ el('option', { value:'', text:'Tüm projeler' }) ].concat(state.projects.map(function(p){
      return el('option', { value:p.id, text:p.title + (p.archived ? ' (arşiv)' : '') });
    })));
  sel.value = dashFilter;
  root.appendChild(el('div', { class:'dashbar' }, [ el('span', { class:'stats', text:'Proje:' }), sel ]));

  var rOn = el('input', { type:'checkbox', id:'rangeOn', 'aria-label':'Tarih aralığı filtresini etkinleştir' });
  rOn.checked = dashRange.on;
  rOn.addEventListener('change', function(){ dashRange.on = rOn.checked; render(); });
  var fromI = el('input', { type:'date', 'aria-label':'Başlangıç tarihi' });
  var toI = el('input', { type:'date', 'aria-label':'Bitiş tarihi' });
  fromI.value = dashRange.from; toI.value = dashRange.to;
  fromI.disabled = toI.disabled = !dashRange.on;
  fromI.addEventListener('change', function(){ dashRange.from = fromI.value; render(); });
  toI.addEventListener('change', function(){ dashRange.to = toI.value; render(); });
  function quick(label, fn){
    var b = el('button', { type:'button', class:'small', text:label, onclick:function(){
      var r = fn(); dashRange.on = true; dashRange.from = r[0]; dashRange.to = r[1]; render();
    } });
    b.disabled = !dashRange.on;
    return b;
  }
  var clearBtn = el('button', { type:'button', class:'small', text:'Temizle',
    onclick:function(){ dashRange.from = ''; dashRange.to = ''; render(); } });
  clearBtn.disabled = !dashRange.from && !dashRange.to;
  root.appendChild(el('div', { class:'dashbar' }, [
    el('label', { class:'stats', for:'rangeOn', style:'display:flex;align-items:center;gap:6px;cursor:pointer' }, [ rOn, el('span', { text:'Tarih aralığı:' }) ]),
    fromI, el('span', { class:'stats', text:'–' }), toI,
    quick('Bu hafta', function(){ var k = mondayKey(Date.now()); return [ k, shiftKey(k, 6) ]; }),
    quick('Bu ay', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), 1).getTime()), dayKey(new Date(n.getFullYear(), n.getMonth() + 1, 0).getTime()) ]; }),
    quick('Geçen ay', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth() - 1, 1).getTime()), dayKey(new Date(n.getFullYear(), n.getMonth(), 0).getTime()) ]; }),
    quick('Son 30 gün', function(){ var n = new Date(); return [ dayKey(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 29).getTime()), dayKey(n.getTime()) ]; }),
    clearBtn
  ]));
  var rangeLabel = '';
  if(dashRange.on && !R.active){
    root.appendChild(el('div', { class:'empty', text:'Filtre açık ama tarih seçilmedi; tüm tarihler gösteriliyor.' }));
  } else if(R.active){
    var lblF = R.from !== null ? new Date(R.from).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'başlangıç';
    var lblT = R.to !== null ? new Date(R.to).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' }) : 'bugün ve sonrası';
    rangeLabel = lblF + ' – ' + lblT;
    var rmins = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
    root.appendChild(el('div', { class:'daysum', text:'🔎 ' + rangeLabel + ' aralığı: ' + rows.length + ' madde' + (rmins ? ' • ' + fmtMin(rmins) : '') + (R.swapped ? ' (başlangıç bitişten sonraydı, yer değiştirildi)' : '') }));
  }

  /* dışa aktarma */
  root.appendChild(el('div', { class:'dashbar' }, [
    el('span', { class:'stats', text:'Dışa aktar:' }),
    el('button', { class:'small', text:'⬇ CSV (seçili aralık)', title:'Excel\'de açılabilir; proje ve tarih filtresi uygulanır', onclick:function(){ exportDoneCsv(rows); } }),
    el('button', { class:'small', text:'⬇ CSV (tüm maddeler)', title:'Açık ve tamamlanmış bütün maddeler', onclick: exportAllCsv }),
    el('button', { class:'small', text:'🖨 Puantaj yazdır / PDF', onclick:function(){ printTimesheet(rows, rangeLabel); } })
  ]));

  root.appendChild(manualForm());

  /* kutucuklar: "bugün / son 7 gün / bu hafta" her zaman tarih aralığından bağımsızdır */
  var tk = todayKey();
  var d7 = new Date(); d7.setHours(0, 0, 0, 0); d7.setDate(d7.getDate() - 6);
  var cToday = 0, c7 = 0, wkMinsMap = {}, dayMinsMap = {};
  byProject.forEach(function(x){
    var ts = x.it.doneAt; if(!ts) return;
    if(dayKey(ts) === tk) cToday++;
    if(ts >= d7.getTime()) c7++;
    if(x.it.minutes){
      var w = mondayKey(ts); wkMinsMap[w] = (wkMinsMap[w] || 0) + x.it.minutes;
      var dk = dayKey(ts); dayMinsMap[dk] = (dayMinsMap[dk] || 0) + x.it.minutes;
    }
  });
  var mins = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
  var noDur = rows.filter(function(x){ return !x.it.minutes; }).length;
  var wkMins = wkMinsMap[mondayKey(Date.now())] || 0;
  var overdue = dueItems().filter(function(x){ return dayDiff(x.due, tk) < 0 && (!dashFilter || x.p.id === dashFilter); }).length;

  function tile(v, l, cls){ return el('div', { class:'tile' + (cls ? ' ' + cls : '') }, [ el('div', { class:'v', text:v }), el('div', { class:'l', text:l }) ]); }
  root.appendChild(el('div', { class:'tiles' }, [
    tile(String(rows.length), R.active ? 'Aralıktaki tamamlanan' : 'Toplam tamamlanan'),
    tile(String(cToday), 'Bugün tamamlanan'),
    tile(String(c7), 'Son 7 gün'),
    tile(mins ? fmtMin(mins) : '—', R.active ? 'Aralıktaki çalışma süresi' : 'Toplam çalışma süresi'),
    tile(wkMins ? fmtMin(wkMins) : '—', 'Bu hafta çalışma süresi'),
    tile(String(noDur), 'Süresi girilmemiş'),
    tile(String(overdue), 'Geciken iş', overdue ? 'alert' : null),
    tile(fmtDays(leaveTotal()), 'Kalan izin')
  ]));

  /* son 14 gün grafiği (tarih aralığından bağımsız) */
  var counts = {};
  byProject.forEach(function(x){ if(x.it.doneAt){ var k = dayKey(x.it.doneAt); counts[k] = (counts[k] || 0) + 1; } });
  var days = [], max = 1;
  for(var i = 13; i >= 0; i--){
    var dd = new Date(); dd.setDate(dd.getDate() - i);
    var k = dayKey(dd.getTime()), c = counts[k] || 0;
    if(c > max) max = c;
    days.push({ key:k, day:dd.getDate(), count:c, mins: dayMinsMap[k] || 0 });
  }
  var chart = el('div', { class:'chart', role:'img',
    'aria-label':'Son 14 günde tamamlanan madde sayısı: ' + days.map(function(x){ return fmtDayShort(x.key) + ' ' + x.count; }).join(', ') });
  days.forEach(function(x){
    chart.appendChild(el('div', { class:'cc', title: fmtDay(x.key) + ': ' + x.count + ' madde' + (x.mins ? ' • ' + fmtMin(x.mins) : '') }, [
      el('span', { class:'val', text: x.count ? String(x.count) : '' }),
      el('div', { class:'bar' + (x.count ? '' : ' zero'), style:'height:' + (x.count ? Math.max(4, Math.round(x.count / max * 100)) : 2) + 'px' }),
      el('span', { class:'lbl', text:String(x.day) })
    ]));
  });
  root.appendChild(el('div', { class:'panel' }, [ el('h2', { text:'Son 14 günde tamamlanan maddeler' }), chart ]));

  /* haftalık süre grafiği */
  var wdata = [], wmax = 1, curWk = mondayKey(Date.now()), anyWk = false;
  for(var wi = 7; wi >= 0; wi--){
    var wk = shiftKey(curWk, -7 * wi), wm = wkMinsMap[wk] || 0;
    if(wm > wmax) wmax = wm;
    if(wm) anyWk = true;
    wdata.push({ key:wk, m:wm });
  }
  var wchart = el('div', { class:'chart', role:'img',
    'aria-label':'Son 8 haftada girilen çalışma süresi: ' + wdata.map(function(w){ return fmtDayShort(w.key) + ' haftası ' + (w.m ? fmtMin(w.m) : '0'); }).join(', ') });
  wdata.forEach(function(w){
    wchart.appendChild(el('div', { class:'cc', title: fmtDayShort(w.key) + ' – ' + fmtDayShort(shiftKey(w.key, 6)) + ' haftası: ' + (w.m ? fmtMin(w.m) : 'süre girilmemiş') }, [
      el('span', { class:'val', text: w.m ? fmtHours(w.m) + ' sa' : '' }),
      el('div', { class:'bar' + (w.m ? '' : ' zero'), style:'height:' + (w.m ? Math.max(4, Math.round(w.m / wmax * 100)) : 2) + 'px' }),
      el('span', { class:'lbl', text: fmtDayShort(w.key) })
    ]));
  });
  root.appendChild(el('div', { class:'panel' }, [
    el('h2', { text:'Haftalık toplam çalışma süresi (son 8 hafta)' }), wchart,
    anyWk ? null : el('div', { class:'empty', text:'Bu haftalarda süre girilmiş madde yok.' })
  ]));

  /* proje özeti — proje filtresi de uygulanır */
  var agg = {};
  rows.forEach(function(x){
    var a = agg[x.p.id] = agg[x.p.id] || { p:x.p, n:0, m:0, last:0 };
    a.n++; if(x.it.minutes) a.m += x.it.minutes;
    if((x.it.doneAt || 0) > a.last) a.last = x.it.doneAt || 0;
  });
  var aggList = Object.keys(agg).map(function(k){ return agg[k]; }).sort(function(a, b){ return b.n - a.n; });
  root.appendChild(el('h2', { text:'Proje özeti' + (R.active ? ' (seçili aralık)' : '') }));
  if(aggList.length){
    var tb = el('tbody');
    aggList.forEach(function(a){
      tb.appendChild(el('tr', null, [
        el('td', { text:a.p.title }), el('td', { class:'nw', text:String(a.n) }),
        el('td', { class:'nw', text: a.m ? fmtMin(a.m) : '—' }), el('td', { class:'nw', text: fmt(a.last) })
      ]));
    });
    root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Proje' }), el('th', { text:'Tamamlanan' }), el('th', { text:'Çalışma süresi' }), el('th', { text:'Son tamamlanma' }) ]) ]),
      tb,
      el('tfoot', null, [ el('tr', null, [ el('td', { text:'Toplam' }), el('td', { class:'nw', text:String(rows.length) }),
        el('td', { class:'nw', text: mins ? fmtMin(mins) : '—' }), el('td', { text:'' }) ]) ])
    ]) ]));
  } else {
    root.appendChild(el('div', { class:'empty', text: R.active ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
  }

  /* tamamlanan maddeler tablosu */
  root.appendChild(el('h2', { text:'Tamamlanan işler' }));
  if(rows.length){
    var sorted = rows.slice().sort(function(a, b){ return (b.it.doneAt || 0) - (a.it.doneAt || 0); });
    var cap = 300, shown = sorted.slice(0, cap);
    var body = el('tbody');
    shown.forEach(function(x){
      var editingDate = editKey === 'd:' + x.it.id;
      var itemCell = el('td', null, editKey === 'i:' + x.it.id
        ? [ editForm(x.it.text, 200, function(v){ editItem(x.p.id, x.t.id, x.it.id, v); }) ]
        : [ el('div', { text:x.it.text }),
            el('div', { class:'rowacts' }, [
              x.it.archived ? el('span', { class:'tag', text:'arşiv' }) : null,
              el('button', { class:'icon', text: x.it.note ? '📝 Not' : '📝 Not ekle', onclick:function(){ startEdit('n:' + x.it.id); } }),
              el('button', { class:'icon', text:'✎ Düzenle', onclick:function(){ startEdit('i:' + x.it.id); } })
            ]),
            noteBlock(x.it) ]);
      body.appendChild(el('tr', null, [
        el('td', { class: editingDate ? '' : 'nw' }, [ editingDate ? dateForm(x.it) : dateBtn(x.it, false) ]),
        el('td', { text:x.p.title }), el('td', { text:x.t.title }), itemCell,
        el('td', null, [ editKey === 'm:' + x.it.id ? durForm(x.it) : durBtn(x.it) ])
      ]));
    });
    root.appendChild(el('div', { class:'tblwrap' }, [ el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Tamamlanma' }), el('th', { text:'Proje' }), el('th', { text:'İş' }), el('th', { text:'Madde' }), el('th', { text:'Süre' }) ]) ]),
      body
    ]) ]));
    if(sorted.length > cap){
      root.appendChild(el('div', { class:'empty', text:'Tabloda en yeni ' + cap + ' kayıt gösteriliyor (toplam ' + sorted.length + '). Tamamı için CSV\'ye aktarın ya da tarih aralığı seçin.' }));
    }
  } else {
    root.appendChild(el('div', { class:'empty', text: R.active ? 'Seçili aralıkta tamamlanan iş yok.' : 'Henüz tamamlanan iş yok.' }));
  }
}

/* --- CSV / puantaj ------------------------------------------------------- */
function exportDoneCsv(rows){
  var out = [[ 'Tarih','Saat','Proje','İş','Madde','Süre (dk)','Süre','Öncelik','Son tarih','Durum','Not' ]];
  rows.slice().sort(function(a, b){ return (a.it.doneAt || 0) - (b.it.doneAt || 0); }).forEach(function(x){
    out.push([
      x.it.doneAt ? new Date(x.it.doneAt).toLocaleDateString('tr-TR') : '',
      x.it.doneAt ? fmtTime(x.it.doneAt) : '',
      x.p.title, x.t.title, x.it.text,
      x.it.minutes || '', x.it.minutes ? fmtMin(x.it.minutes) : '',
      PRIO[x.it.priority || 0] || '', isDayKey(x.it.due) ? x.it.due : '',
      x.it.archived ? 'arşiv' : 'tamamlandı', x.it.note || ''
    ]);
  });
  var total = rows.reduce(function(a, x){ return a + (x.it.minutes || 0); }, 0);
  out.push([]);
  out.push([ 'TOPLAM', '', '', '', rows.length + ' madde', total, total ? fmtMin(total) : '', '', '', '', '' ]);
  downloadCsv(out, 'is-takip-tamamlanan-' + todayKey() + '.csv');
  toast(rows.length + ' satır CSV olarak indirildi.');
}
function exportAllCsv(){
  var out = [[ 'Proje','Proje durumu','İş','İş durumu','Madde','Durum','Oluşturma','Tamamlanma','Süre (dk)','Süre','Öncelik','Son tarih','Gecikme (gün)','Not' ]];
  allItems().forEach(function(x){
    var di = dueInfo(x.it.due, x.it.done);
    out.push([
      x.p.title, x.p.archived ? 'arşiv' : 'aktif',
      x.t.title, x.t.archived ? 'arşiv' : (TSTATUS.filter(function(s){ return s[0] === (x.t.status || 'todo'); })[0] || ['','?'])[1],
      x.it.text,
      x.it.archived ? 'arşiv' : (x.it.done ? 'tamamlandı' : 'açık'),
      x.it.createdAt ? new Date(x.it.createdAt).toLocaleString('tr-TR') : '',
      x.it.doneAt ? new Date(x.it.doneAt).toLocaleString('tr-TR') : '',
      x.it.minutes || '', x.it.minutes ? fmtMin(x.it.minutes) : '',
      PRIO[x.it.priority || 0] || '', isDayKey(x.it.due) ? x.it.due : '',
      (di && di.overdue) ? -di.days : '',
      x.it.note || ''
    ]);
  });
  downloadCsv(out, 'is-takip-tum-maddeler-' + todayKey() + '.csv');
  toast((out.length - 1) + ' satır CSV olarak indirildi.');
}
function printTimesheet(rows, rangeLabel){
  var sheet = clear(document.getElementById('printSheet'));
  var list = rows.slice();
  var label = rangeLabel;
  if(!label){
    var n = new Date();
    var from = new Date(n.getFullYear(), n.getMonth(), 1).getTime(), to = new Date(n.getFullYear(), n.getMonth() + 1, 0).getTime() + 86400000 - 1;
    list = list.filter(function(x){ return x.it.doneAt && x.it.doneAt >= from && x.it.doneAt <= to; });
    label = MONTHS[n.getMonth()] + ' ' + n.getFullYear();
  }
  var proj = dashFilter ? (findProject(dashFilter) || {}).title : 'Tüm projeler';
  sheet.appendChild(el('h2', { text:'İş Takip — Puantaj' }));
  sheet.appendChild(el('div', { text:'Dönem: ' + label + '  •  Proje: ' + proj + '  •  Çıktı: ' + fmt(Date.now()) }));

  var byDay = {};
  list.forEach(function(x){ if(!x.it.doneAt) return; var k = dayKey(x.it.doneAt); (byDay[k] = byDay[k] || []).push(x); });
  var keys = Object.keys(byDay).sort();
  var grand = 0, gcount = 0;
  var tb = el('tbody');
  keys.forEach(function(k){
    var dayRows = byDay[k].sort(function(a, b){ return a.it.doneAt - b.it.doneAt; });
    var dm = 0;
    dayRows.forEach(function(x, i){
      dm += x.it.minutes || 0;
      tb.appendChild(el('tr', { class:'pbrk' }, [
        el('td', { text: i === 0 ? fmtDay(k) : '' }),
        el('td', { text: fmtTime(x.it.doneAt) }),
        el('td', { text: x.p.title }),
        el('td', { text: x.t.title }),
        el('td', { text: x.it.text }),
        el('td', { text: x.it.minutes ? fmtMin(x.it.minutes) : '—' })
      ]));
    });
    grand += dm; gcount += dayRows.length;
    tb.appendChild(el('tr', null, [
      el('td', { text:'' }), el('td', { text:'' }), el('td', { text:'' }), el('td', { text:'' }),
      el('td', { text: dayRows.length + ' madde — gün toplamı' }),
      el('td', { text: dm ? fmtMin(dm) : '—' })
    ]));
  });
  if(!keys.length){
    sheet.appendChild(el('div', { text:'Bu dönemde tamamlanmış kayıt yok.' }));
  } else {
    sheet.appendChild(el('table', null, [
      el('thead', null, [ el('tr', null, [ el('th', { text:'Gün' }), el('th', { text:'Saat' }), el('th', { text:'Proje' }), el('th', { text:'İş' }), el('th', { text:'Yapılan' }), el('th', { text:'Süre' }) ]) ]),

var searchQ = '', searchGroup = 'all', searchStatus = 'all', searchArchived = false;
var FOLDMAP = { 'ı':'i','İ':'i','ç':'c','Ç':'c','ğ':'g','Ğ':'g','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u','â':'a','Â':'a','î':'i','û':'u' };
function fold(x){
  x = str(x); var o = '';
  for(var i = 0; i < x.length; i++){
    var c = x.charAt(i), m = FOLDMAP[c];
    if(m){ o += m; continue; }
    var l = c.toLowerCase(); o += (l.length === 1 ? l : c);
  }
  return o;
}
function searchWords(q){ return fold(q).split(/\s+/).filter(Boolean); }
function matches(words, text){
  var f = fold(text);
  return words.every(function(w){ return f.indexOf(w) >= 0; });
}
function hl(text, words, maxLen){
  text = str(text);
  var f = fold(text), first = -1;
  words.forEach(function(w){ var i = f.indexOf(w); if(i >= 0 && (first < 0 || i < first)) first = i; });
  var start = 0, end = text.length, pre = '', post = '';
  if(maxLen && text.length > maxLen){
    start = Math.max(0, (first < 0 ? 0 : first) - 40);
    end = Math.min(text.length, start + maxLen);
    if(start > 0) pre = '…';
    if(end < text.length) post = '…';
  }
  var mask = new Array(end - start + 1).join('0').split('');
  words.forEach(function(w){
    var from = start;
    while(true){
      var i = f.indexOf(w, from);
      if(i < 0 || i >= end) break;
      for(var k = i; k < Math.min(end, i + w.length); k++) mask[k - start] = '1';
      from = i + Math.max(1, w.length);
    }
  });
  var frag = document.createDocumentFragment();
  if(pre) frag.appendChild(document.createTextNode(pre));
  var i2 = 0, seg = text.slice(start, end);
  while(i2 < seg.length){
    var on = mask[i2] === '1', j = i2;
    while(j < seg.length && (mask[j] === '1') === on) j++;
    var part = seg.slice(i2, j);
    if(on) frag.appendChild(el('mark', { class:'hl', text: part }));
    else frag.appendChild(document.createTextNode(part));
    i2 = j;
  }
  if(post) frag.appendChild(document.createTextNode(post));
  return frag;
}

  });
  alarmList().slice().sort(function(a, b){ return a.at - b.at; }).forEach(function(a){
    if(matches(words, a.text)){
      G.alarm.push({ main:a.text, meta: fmt(a.at) + (a.at <= Date.now() ? ' • zamanı geldi' : ''),
        go:function(){ switchTab('alarm'); flashEl(findBySid(a.id)); } });
    }
  });
  noteList().slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); }).forEach(function(n){
    if(!matches(words, n.title + ' ' + n.body)) return;
    G.not.push({ main: n.title || n.body, note: n.title ? n.body : null,
      meta: (n.title ? '' : 'Başlıksız not • ') + (n.updatedAt ? fmt(n.updatedAt) : ''),
      go:function(){ switchTab('notebook'); flashEl(findBySid(n.id)); } });
  });
  var L = leaveData();
  Object.keys(L.notes).sort().reverse().forEach(function(k){
    if(matches(words, L.notes[k] + ' ' + fmtDay(k))){
      G.izin.push({ main:L.notes[k], meta: fmtDay(k) + (L.days[k] ? ' • ' + (LEAVE_TYPES[L.days[k].type] || 'Fazla çalışma') : ''), go:function(){ goDay(k); } });
    }
  });
  L.ledger.forEach(function(e){
    if(e.note && matches(words, e.note)){
      G.izin.push({ main:e.note, meta: fmtDay(e.at) + ' • ' + (e.amount > 0 ? '+' : '') + fmtNum(e.amount) + ' gün', go:function(){ goDay(e.at); } });
    }
  });
  var all = [
    ['proje','📁 Projeler', G.proje], ['is','🗂 İşler', G.is], ['madde','✅ Maddeler', G.madde],
    ['not','📓 Not defteri', G.not],
    ['hat','📌 Hatırlatmalar', G.hat], ['alarm','⏰ Hatırlatıcılar', G.alarm],
    ['hafta','🗓 Haftalık plan', G.hafta], ['izin','★ İzin kayıtları', G.izin]
  ];
  return all.filter(function(g){ return searchGroup === 'all' || searchGroup === g[0]; });
}
function renderSearchFilters(){
  var bar = clear(document.getElementById('searchFilters'));
  var gsel = el('select', { 'aria-label':'Arama kapsamı', onchange:function(e){ searchGroup = e.target.value; renderSearch(); } }, [
    el('option', { value:'all', text:'Her yerde' }), el('option', { value:'proje', text:'Projeler' }),
    el('option', { value:'is', text:'İşler' }), el('option', { value:'madde', text:'Maddeler' }),
    el('option', { value:'not', text:'Not defteri' }),
    el('option', { value:'hat', text:'Hatırlatmalar' }), el('option', { value:'alarm', text:'Hatırlatıcılar' }),
    el('option', { value:'hafta', text:'Haftalık plan' }), el('option', { value:'izin', text:'İzin kayıtları' })
  ]);
  gsel.value = searchGroup;
  var ssel = el('select', { 'aria-label':'Durum', onchange:function(e){ searchStatus = e.target.value; renderSearch(); } }, [
    el('option', { value:'all', text:'Açık + tamamlanan' }),
    el('option', { value:'open', text:'Yalnızca açık' }),
    el('option', { value:'done', text:'Yalnızca tamamlanan' })
  ]);
  ssel.value = searchStatus;
  var acb = el('input', { type:'checkbox', id:'sArc' });
  acb.checked = searchArchived;
  acb.addEventListener('change', function(){ searchArchived = acb.checked; renderSearch(); });
  bar.appendChild(el('span', { text:'Kapsam:' })); bar.appendChild(gsel);
  bar.appendChild(el('span', { text:'Durum:' })); bar.appendChild(ssel);
  bar.appendChild(el('label', { for:'sArc' }, [ acb, el('span', { text:'Arşivdekiler de' }) ]));
  bar.appendChild(el('span', { style:'margin-left:auto', text:'Esc: önceki sekmeye dön' }));
}
function renderSearch(){
  renderSearchFilters();
  var root = clear(document.getElementById('searchView'));
  var inp = document.getElementById('searchInput');
  if(inp.value !== searchQ) inp.value = searchQ;
  var words = searchWords(searchQ);
  if(!words.length){
    root.appendChild(el('div', { class:'empty', text:'Aramak için bir veya birkaç kelime yazın. Büyük/küçük harf ve Türkçe karakter (ı, ş, ğ…) fark etmez; birden fazla kelime yazarsanız hepsi geçen kayıtlar bulunur.' }));
    return;
  }
  var groups = collectResults(words), total = 0, LIMIT = 50;
  groups.forEach(function(g){
    var rows = g[2]; if(!rows.length) return;
    total += rows.length;
    var ul = el('ul', { class:'sres' });
    rows.slice(0, LIMIT).forEach(function(r){
      ul.appendChild(el('li', null, [ el('button', { type:'button', class:'sitem', title:'Bulunduğu yere git', onclick:r.go }, [
        el('span', { class:'smain' }, [ hl(r.main, words, 220) ]),
        r.note ? el('span', { class:'snote' }, [ hl(r.note, words, 200) ]) : null,
        r.meta ? el('span', { class:'smeta', text:r.meta }) : null
      ]) ]));
    });
    if(rows.length > LIMIT) ul.appendChild(el('li', { class:'empty', text:'… ve ' + (rows.length - LIMIT) + ' sonuç daha. Aramayı daraltın.' }));
    root.appendChild(el('div', { class:'sgroup' }, [
      el('h3', null, [ el('span', { text:g[1] }), el('span', { class:'count', text:String(rows.length) }) ]), ul
    ]));
  });
  if(!total) root.appendChild(el('div', { class:'empty', text:'"' + searchQ.trim() + '" için sonuç bulunamadı.' + (searchArchived ? '' : ' Arşivdekileri de aramayı deneyin.') }));
}
function openSearch(){
  if(tab !== 'search') prevTab = tab;
  tab = 'search'; editKey = null; render();
  var i = document.getElementById('searchInput'); i.focus(); i.select();
}

/* --- genel çatı ---------------------------------------------------------- */
function updateStats(){
  var open = 0, done = 0;
  state.projects.forEach(function(p){ p.tasks.forEach(function(t){ t.items.forEach(function(i){
    if(i.archived) return;
    if(i.done) done++; else open++;
  }); }); });
  var over = dueItems().filter(function(x){ return dayDiff(x.due, todayKey()) < 0; }).length;
  document.getElementById('stats').textContent = open + ' açık • ' + done + ' tamamlandı' + (over ? ' • ' + over + ' geciken' : '');
}
var TABS = ['tasks','cal','dash','alarm','notebook','archive','search'];
function switchTab(t){
  if(t === tab) return;
  prevTab = tab; tab = t; editKey = null;
  render();
  if(t === 'search'){ var si = document.getElementById('searchInput'); si.focus(); si.select(); }
}
function render(focusKey){
  try { renderInner(focusKey); }
  catch(e){
    setNotice({ bad:true, sticky:true, text:'Ekran çizilirken bir hata oluştu: ' + errMsg(e) + ' — verileriniz bellekte duruyor, hemen yedek alın.',
      buttons:[ { label:'📤 Yedeği indir', primary:true, fn: downloadBackup } ] });
    try { console.error(e); } catch(e2){}
  }
}
function renderInner(focusKey){
  updateStats();
  TABS.forEach(function(k){ document.getElementById('tab-' + k).hidden = (k !== tab); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false');
  });
  if(tab === 'tasks') renderTasks();
  else if(tab === 'cal') renderCalendar();
  else if(tab === 'dash') renderDashboard();
  else if(tab === 'alarm') renderAlarms();
  else if(tab === 'notebook') renderNotebook();
  else if(tab === 'archive') renderArchive();
  else if(tab === 'search') renderSearch();
  renderAlarmBar();
  renderNotice();

  var target = null;
  if(editKey){
    target = document.querySelector('[data-edit]');
    if(target){
      if(target.tagName === 'TEXTAREA'){ var n = target.value.length; target.setSelectionRange(n, n); }
      else if(target.select) target.select();
    }
  } else if(focusKey){
    target = document.querySelector('[data-key="' + focusKey + '"]');
  }
  if(target) target.focus();
}
/* ----------------------------------------------------------------- 6. AÇILIŞ */

/* tema: otomatik / açık / koyu */
var THEMES = [ ['auto','🌓 Otomatik'], ['light','☀ Açık'], ['dark','🌙 Koyu'] ];
function applyTheme(){
  var t = lsGet('is-takip-theme') || 'auto';
  document.documentElement.setAttribute('data-theme', t);
  var b = document.getElementById('themeBtn');
  var found = THEMES.filter(function(x){ return x[0] === t; })[0] || THEMES[0];
  b.textContent = found[1];
  b.setAttribute('aria-label', 'Görünüm: ' + found[1].replace(/^\S+\s/, ''));
}
document.getElementById('themeBtn').addEventListener('click', function(){
  var t = lsGet('is-takip-theme') || 'auto';
  var i = THEMES.findIndex(function(x){ return x[0] === t; });
  lsSet('is-takip-theme', THEMES[(i + 1) % THEMES.length][0]);
  applyTheme();
});

/* sekmeler */
Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b){
  b.addEventListener('click', function(){ switchTab(b.getAttribute('data-tab')); });
});
document.getElementById('tabs').addEventListener('keydown', function(e){
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var i = TABS.indexOf(tab);
  if(i < 0) return;
  e.preventDefault();
  var j = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
  switchTab(TABS[j]);
  var nb = document.getElementById('tabbtn-' + TABS[j]);
  if(nb) nb.focus();
});

/* proje ekleme */
document.getElementById('projectForm').addEventListener('submit', function(e){
  e.preventDefault();
  var inp = document.getElementById('projectInput');
  addProject(inp.value);
  inp.value = '';
});
document.getElementById('clearDone').addEventListener('click', archiveDoneItems);

/* arama */
document.getElementById('searchInput').addEventListener('input', function(e){ searchQ = e.target.value; renderSearch(); });
document.getElementById('searchInput').addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  e.preventDefault();
  if(searchQ){ searchQ = ''; renderSearch(); }
  else switchTab(prevTab && prevTab !== 'search' ? prevTab : 'tasks');
});
document.addEventListener('keydown', function(e){
  var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openSearch(); return; }
  if(e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); openSearch(); return; }
  /* takvimde ok tuşlarıyla gezinme */
  if(t && t.classList && t.classList.contains('day') && e.key.indexOf('Arrow') === 0){
    var step = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' ? -7 : 7;
    e.preventDefault();
    var k = shiftKey(t.getAttribute('data-day'), step), d = keyToDate(k);
    selDay = k; calYear = d.getFullYear(); calMonth = d.getMonth(); weekKey = mondayKey(d.getTime());
    render();
    var nb = document.querySelector('[data-day="' + k + '"]');
    if(nb) nb.focus();
  }
});
/* açık satır menüsünü dışarı tıklayınca kapat */
document.addEventListener('click', function(e){
  Array.prototype.forEach.call(document.querySelectorAll('details.rowmenu[open]'), function(d){
    if(!d.contains(e.target)) d.removeAttribute('open');
  });
}, true);

/* içe aktarma (dosya seçici desteklenmeyen tarayıcılar ve Drive kipi) */
document.getElementById('importFileInput').addEventListener('change', function(e){
  var file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  readJsonFileObject(file).then(function(data){
    applyImported(data, '"' + file.name + '"');
  }).catch(function(err){ toast(errMsg(err), { bad:true }); });
});

/* kaydetme güvenliği: sayfa gizlenirken / kapanırken bekleyen yazmaları boşalt */
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden') flushSaves();
  else { alarmTick(); driveSync(false); }
});
window.addEventListener('beforeunload', function(e){
  var unsaved = driveDirty() || (canWrite && dirty) || (!canWrite && !drive.on && dirty);
  if(unsaved){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('error', function(ev){
  if(notice && notice.bad) return;
  setNotice({ bad:true, sticky:true, text:'Beklenmeyen bir hata oluştu: ' + (ev && ev.message ? ev.message : 'bilinmiyor') + ' — verileriniz bellekte duruyor, yedek almanız önerilir.',
    buttons:[ { label:'📤 Yedeği indir', primary:true, fn: downloadBackup } ] });
});

setInterval(alarmTick, 15000);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* başlangıç durumu */
var now0 = new Date();
calYear = now0.getFullYear(); calMonth = now0.getMonth(); selDay = dayKey(now0.getTime());
weekKey = mondayKey(now0.getTime());
applyTheme();
render();
updateBar();

/* Drive kullanılıyorsa Google giriş betiğini hemen yüklemeye başla:
   otomatik bağlantı, yerel kopyanın okunmasını beklemesin. */
if(driveFlag() && driveClientId()) loadGis().catch(function(){});

/* Önce bu cihazdaki kopya (anında açılış ve çökme sigortası), sonra bağlı
   dosya / Drive. IndexedDB yavaşlar ya da engellenirse açılış takılmasın
   diye okuma en fazla 2,5 saniye bekletilir. */
Promise.race([
  loadSnapshot().catch(function(){ return null; }),
  new Promise(function(res){ setTimeout(function(){ res(null); }, 2500); })
]).then(function(snap){
  if(snap && !isEmptyState(snap.data) && isEmptyState(state)){
    state = snap.data;
    dirty = !!snap.dirty;
    render();
    if(snap.dirty) announce('Bu cihazda saklanan son kopya yüklendi.');
  }
}).catch(function(){}).then(function(){
  booted = true;
  /* İkisi birbirinden bağımsız başlar: biri hata verse de diğeri çalışır. */
  try { driveInit(); } catch(e){ drive.err = 'Drive başlatılamadı: ' + errMsg(e); updateBar(); }
  try { initFileHandle(); } catch(e){ updateBar(); }
});
})();
</script>
