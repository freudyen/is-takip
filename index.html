<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Takip (Modüler JSON)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --sub:#f7f8fa; --text:#1f2430; --muted:#6b7280; --line:#e3e6ec;
    --accent:#3b6cf6; --accent-text:#fff; --ok:#16a34a; --ok-bg:#e8f6ee; --danger:#dc2626; --warn:#b45309; --mark:#fde68a; --mark-text:#1f2430;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161b; --card:#1d2027; --sub:#23272f; --text:#e8eaef; --muted:#9097a5; --line:#2c303a;
      --accent:#6b8cff; --accent-text:#0e1220; --ok:#4ade80; --ok-bg:#16281d; --danger:#f87171; --warn:#fbbf24; --mark:#854d0e; --mark-text:#fff7d6;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1150px;margin:0 auto;padding:24px 16px 48px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{margin:0;font-size:24px}
  .stats{color:var(--muted);font-size:14px}
  .savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}
  .savebar .status{flex:1;min-width:180px}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--danger)}

  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tabs button:hover{border-color:transparent;border-bottom-color:var(--accent)}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

  .newproject{display:flex;gap:8px;margin-bottom:24px}
  input[type=text],select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
  select{flex:0 1 auto}
  input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button:disabled:hover{border-color:var(--line)}
  .primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
  .layout{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  .col{display:flex;flex-direction:column;gap:16px}
  .project{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .phead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .phead h3{margin:0;font-size:18px;flex:1;min-width:120px;word-break:break-word}
  .task{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
  .thead{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .thead h4{margin:0;font-size:15px;flex:1;min-width:120px;word-break:break-word}
  .thead h4::before{content:"▸ ";color:var(--muted)}
  .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:20px;padding:2px 8px;white-space:nowrap}
  .icon{padding:4px 8px;font-size:13px;color:var(--muted)}
  .icon.del:hover{color:var(--danger);border-color:var(--danger)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  li:first-child{border-top:0}
  li .txt{flex:1 1 160px;word-break:break-word}
  li .editform,li .noteform{flex:1 0 100%}
  .done-btn{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600;font-size:13px;padding:5px 10px;white-space:nowrap}
  .done-btn:hover{border-color:var(--ok)}
  .add{display:flex;gap:8px;margin-top:8px}
  .add input{padding:8px 10px}
  .addtask{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}
  .done-card .txt{text-decoration:line-through;color:var(--muted)}
  .tag{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 6px;white-space:nowrap}
  .created-tag{font-size:11px;color:var(--muted);background:transparent;padding:1px 4px;white-space:nowrap}
  .small{font-size:13px;padding:5px 9px}
  .editform{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
  .editform input{padding:6px 9px;min-width:140px}
  .editform .err{flex:1 0 100%;color:var(--danger);font-size:13px}
  .editform .err:empty{display:none}
  .dur{font-size:12px;padding:3px 8px;color:var(--muted);white-space:nowrap}
  .dur.set{background:var(--sub);color:var(--text);font-weight:600;border-color:var(--accent)}

  .note{white-space:pre-wrap;word-break:break-word;flex:1 0 100%;font-size:13px;color:var(--muted);background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:6px 10px;margin:4px 0}
  .noteform{display:flex;flex-direction:column;gap:6px;margin:4px 0}
  .noteform textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;resize:vertical}
  .noteform textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .noteactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .noteactions .hintx{font-size:12px;color:var(--muted)}

  .calwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  @media (max-width:860px){.calwrap{grid-template-columns:1fr}}
  .calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .calhead h3{margin:0;font-size:18px;flex:1;text-align:center}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
  .blank{min-height:60px}
  .day{min-height:60px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start;justify-content:flex-start;background:var(--card)}
  .day .num{font-weight:600;font-size:14px}
  .day .badge{font-size:11px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:1px 6px;font-weight:600}
  .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .day.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .day.sel .badge{background:var(--accent-text);color:var(--accent)}
  @media (max-width:520px){.day,.blank{min-height:48px;padding:4px}}
  .daytitle{margin:0 0 4px;font-size:18px}
  .daysum{color:var(--muted);font-size:14px;margin-bottom:12px}

  .dashbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .tile .v{font-size:26px;font-weight:700;line-height:1.2}
  .tile .l{font-size:13px;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}
  .panel h2{margin-bottom:8px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:140px}
  .chart .cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .chart .bar{width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0}
  .chart .bar.zero{background:var(--line)}
  .chart .val{font-size:11px;color:var(--muted);height:16px;line-height:16px}
  .chart .lbl{font-size:11px;color:var(--muted);margin-top:4px}
  .tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
  thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
  td.nw{white-space:nowrap}
  td .rnote{font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:2px}
  .editform input[type=datetime-local]{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
  .rowacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .weekly{margin-top:28px}
  .wtxt.st-done{text-decoration:line-through;color:var(--ok)}
  .wtxt.st-failed,.wtxt.st-cancelled{text-decoration:line-through;color:var(--muted)}
  .wtxt.st-postponed{color:var(--warn)}
  .wsel{flex:0 0 auto;padding:5px 8px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit}
  .wsel.st-done{color:var(--ok);border-color:var(--ok)}
  .wsel.st-postponed{color:var(--warn);border-color:var(--warn)}
  .wsel.st-failed{color:var(--danger);border-color:var(--danger)}
  .wsel.st-cancelled{color:var(--muted)}
  .manual{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}
  .manual h2{margin-bottom:10px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .mfield{display:flex;flex-direction:column;gap:4px;min-width:0}
  .mfield.wide{grid-column:1/-1}
  .mfield label{font-size:12px;color:var(--muted)}
  .mfield select,.mfield input,.mfield textarea{width:100%;flex:none;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
  .mfield textarea{resize:vertical}
  .mfield select:focus,.mfield input:focus,.mfield textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .mactions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .mmsg{font-size:13px}
  .mmsg.ok{color:var(--ok)} .mmsg.err{color:var(--danger)}
  .day .xmark{font-size:11px;background:var(--bg);color:var(--warn);border-radius:10px;padding:1px 6px;font-weight:600}
  .day.sel .xmark{background:var(--accent-text);color:var(--accent)}
  .xbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:14px}
  .xbox select{flex:0 0 auto;padding:5px 8px;font-size:13px}
  .leavetop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .leaveval{font-size:30px;font-weight:700;line-height:1.2}
  .xbox input{flex:1 1 180px;padding:5px 8px;font-size:13px}
  .lrow .dt{flex:0 0 auto;min-width:150px}
  .lrow input{flex:1 1 200px;padding:6px 9px;font-size:14px}
  .leaveuse{align-items:center;flex-wrap:wrap}
  .leaveuse input{flex:0 0 90px;padding:8px 10px}
  .reminders{background:var(--sub);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
  .reminders summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
  .reminders summary::-webkit-details-marker{display:none}
  .reminders summary::before{content:"▸";font-size:11px}
  .reminders[open] summary::before{content:"▾"}
  .reminders ul{margin-top:6px}
  .reminders li{font-size:14px}
  .hint{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
  /* Çok satırlı hatırlatma */
  .rtxt{white-space:pre-wrap}
  .remform{display:flex;flex-direction:column;gap:6px;margin-top:8px;flex:1 0 100%}
  .remform textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;resize:vertical;min-height:64px}
  .remform textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .remform .rbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .remform .hintx{font-size:12px;color:var(--muted)}
  /* Global arama */
  .searchbox{margin-bottom:14px}
  .searchbox input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit}
  .searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .sgroup{margin-bottom:18px}
  .sgroup h3{margin:0 0 8px;font-size:15px}
  .sgroup h3 .count{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .sres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .sres li{display:block;padding:0}
  .sres button.sitem{display:block;width:100%;text-align:left;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;cursor:pointer}
  .sres button.sitem:hover,.sres button.sitem:focus-visible{border-color:var(--accent)}
  .sres .smain{display:block;word-break:break-word;white-space:pre-wrap}
  .sres .smeta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .sres .snote{display:block;font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--accent);padding-left:8px}
  mark.hl{background:var(--mark);color:var(--mark-text);border-radius:3px;padding:0 1px}
  @keyframes flashbg{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
  .flash{animation:flashbg 2.2s ease-out;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 İş Takip</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="savebar" id="savebar"></div>

  <!-- Gizli Dosya Yükleme Girdisi (Import İçin) -->
  <input type="file" id="importFileInput" accept=".json" style="display:none">

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="tasks" class="active" aria-selected="true">📋 İşler</button>
    <button type="button" data-tab="cal" aria-selected="false">📅 Takvim</button>
    <button type="button" data-tab="dash" aria-selected="false">📊 Dashboard</button>
    <button type="button" data-tab="search" aria-selected="false" title="Ara ( / tuşu )">🔍 Ara</button>
  </nav>

  <div id="tab-tasks">
    <form class="newproject" id="projectForm">
      <input type="text" id="projectInput" placeholder="Yeni proje adı (örn. Web Sitesi Yenileme)" maxlength="80" autocomplete="off">
      <button class="primary" type="submit">Proje Ekle</button>
    </form>

    <div class="dashbar" id="taskFilterBar"></div>

    <div class="layout">
      <section>
        <h2>Devam Eden İşler</h2>
        <div class="col" id="projects"></div>
      </section>
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="margin:0">Tamamlandı</h2>
          <button class="small" id="clearDone">Tamamlananları Temizle</button>
        </div>
        <div class="col" id="doneList"></div>
      </section>
    </div>
  </div>

  <div id="tab-cal" hidden><div id="calView"></div></div>
  <div id="tab-dash" hidden><div id="dashView"></div></div>
  <div id="tab-search" hidden>
    <div class="searchbox"><input type="search" id="searchInput" placeholder="Ara: proje, iş, madde, not, hatırlatma, haftalık plan…" maxlength="100" autocomplete="off" aria-label="Genel arama"></div>
    <div id="searchView"></div>
  </div>

  <p class="hint">Veriler bağımsız bir <code>.json</code> dosyasında saklanır.</p>
</div>

<script>
(function(){
  var state = { projects: [], weekly: {}, leave: { days: {}, adjust: 0, notes: {} } };
  var weekKey = '';
  var tab = 'tasks';
  var editKey = null;
  var dashFilter = '';
  var dashRange = { on: false, from: '', to: '' };
  var tasksFilter = '';
  var calYear, calMonth, selDay;
  var jsonHandle = null;
  var folderHandle = null;
  var AUTO_NAME = 'is-takip-data.json';
  var canWrite = false;
  var needsPermission = false;
  var dirty = false;
  var saveError = '';
  var saveTimer = null;
  var hasFS = typeof window.showOpenFilePicker === 'function';

  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function normalize(s){
    var w = (s && s.weekly && typeof s.weekly === 'object' && !Array.isArray(s.weekly)) ? s.weekly : {};
    var lv = (s && s.leave && typeof s.leave === 'object' && !Array.isArray(s.leave)) ? s.leave : {};
    var L = {
      days: (lv.days && typeof lv.days === 'object' && !Array.isArray(lv.days)) ? lv.days : {},
      adjust: isFinite(+lv.adjust) ? +lv.adjust : 0,
      notes: (lv.notes && typeof lv.notes === 'object' && !Array.isArray(lv.notes)) ? lv.notes : {}
    };
    if(s && Array.isArray(s.projects)) return { projects: s.projects, weekly: w, leave: L };
    return { projects: [], weekly: {}, leave: { days: {}, adjust: 0, notes: {} } };
  }

  /* ---------- IndexedDB Bağlantı Hafızası ---------- */
  function idb(){
    return new Promise(function(res, rej){
      var r = indexedDB.open('is-takip-json-db', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('h'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbGet(key){
    return idb().then(function(db){
      return new Promise(function(res){
        var q = db.transaction('h').objectStore('h').get(key || 'json_file');
        q.onsuccess = function(){ res(q.result || null); };
        q.onerror = function(){ res(null); };
      });
    }).catch(function(){ return null; });
  }
  function idbSet(h, key){
    return idb().then(function(db){
      return new Promise(function(res){
        var tx = db.transaction('h', 'readwrite');
        tx.objectStore('h').put(h, key || 'json_file');
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ res(); };
      });
    }).catch(function(){});
  }

  /* ---------- JSON Dosyasına Yazma ---------- */
  function writeToJsonFile(){
    if(!jsonHandle || !canWrite) return Promise.resolve(false);
    return jsonHandle.createWritable().then(function(w){
      return w.write(JSON.stringify(state, null, 2)).then(function(){ return w.close(); });
    }).then(function(){
      dirty = false; saveError = ''; updateBar(); return true;
    }).catch(function(e){
      saveError = 'JSON dosyasına yazılamadı: ' + (e && e.message ? e.message : e);
      updateBar(); return false;
    });
  }

  function changed(){
    dirty = true; saveError = '';
    updateBar();
    if(canWrite){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(writeToJsonFile, 250);
    }
    if(drive.on) driveQueue();
  }

  /* 1. SIFIRDAN DOSYA OLUŞTURMA */
  function createNewJsonFile(){
    window.showSaveFilePicker({
      suggestedName: 'is-takip-data.json',
      types: [{ description: 'JSON Veri Dosyası', accept: { 'application/json': ['.json'] } }]
    }).then(function(h){
      jsonHandle = h; canWrite = true; needsPermission = false;
      return idbSet(h).then(function(){
        dirty = true;
        return writeToJsonFile().then(function(){ render(); });
      });
    }).catch(function(e){
      if(e && e.name === 'AbortError') return;
      saveError = 'Dosya oluşturulmadı.';
      updateBar();
    });
  }

  /* 2. VAROLAN DOSYAYA BAĞLANMA (OTOMATİK KAYIT İÇİN) */
  function connectExistingJsonFile(){
    window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'JSON Veri Dosyası', accept: { 'application/json': ['.json'] } }]
    }).then(function(arr){
      var h = arr[0];
      return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
        if(txt.trim()){
          try { state = normalize(JSON.parse(txt)); } catch(e){
            alert('Geçersiz JSON dosyası.'); return;
          }
        }
        jsonHandle = h; canWrite = true; needsPermission = false;
        return idbSet(h).then(function(){
          render();
          updateBar();
        });
      });
    }).catch(function(e){
      if(e && e.name === 'AbortError') return;
      saveError = 'Dosyaya bağlanılamadı.';
      updateBar();
    });
  }

  /* 2b. KLASÖRE BAĞLAN: seçilen klasördeki is-takip-data.json otomatik bulunur ve her açılışta bağlanır */
  function attachFile(fh, writeNow){
    jsonHandle = fh; canWrite = true; needsPermission = false; saveError = ''; dirty = !!writeNow;
    return idbSet(fh, 'json_file').then(function(){
      render();
      if(writeNow) return writeToJsonFile();
      updateBar(); return true;
    }).then(function(){ return true; });
  }
  function connectFolderFile(dir, allowCreate){
    return dir.getFileHandle(AUTO_NAME).then(function(fh){
      return fh.getFile().then(function(f){ return f.text(); }).then(function(txt){
        if(txt.trim()){
          try { state = normalize(JSON.parse(txt)); } catch(e){
            saveError = '"' + AUTO_NAME + '" geçerli bir JSON dosyası değil.'; updateBar(); return false;
          }
        }
        return attachFile(fh, false);
      });
    }, function(err){
      if(err && err.name === 'NotFoundError' && allowCreate){
        if(!confirm('Seçtiğiniz klasörde "' + AUTO_NAME + '" bulunamadı. Mevcut verilerle yeni bir dosya oluşturulsun mu?')) return false;
        return dir.getFileHandle(AUTO_NAME, { create: true }).then(function(fh){ return attachFile(fh, true); });
      }
      return false;
    });
  }
  function connectFolder(){
    window.showDirectoryPicker({ id: 'is-takip-folder', mode: 'readwrite' }).then(function(dir){
      folderHandle = dir;
      return idbSet(dir, 'folder').then(function(){ return connectFolderFile(dir, true); });
    }).catch(function(e){
      if(e && e.name === 'AbortError') return;
      saveError = (e && e.name === 'SecurityError')
        ? 'Tarayıcı bu klasörü engelliyor (Masaüstü / Belgeler / İndirilenler klasörünün kendisi seçilemez). Bir alt klasör kullanın.'
        : 'Klasöre bağlanılamadı: ' + (e && e.message ? e.message : e);
      updateBar();
    });
  }

  /* 3. İÇE AKTAR (IMPORT - YALNIZCA VERİYİ YÜKLER) */
  function importJsonFile(){
    if(driveFlag()){ document.getElementById('importFileInput').click(); return; }
    /* Dosya seçici destekleniyorsa dosyayı onunla aç: hem veri yüklenir hem
       (henüz bağlı dosya yoksa) otomatik kayıt bu dosyaya bağlanır. */
    if(hasFS){
      window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'JSON Veri Dosyası', accept: { 'application/json': ['.json'] } }]
      }).then(function(arr){
        var h = arr[0];
        return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
          var data;
          try { data = normalize(JSON.parse(txt)); } catch(err){
            alert('Hata: Seçilen dosya geçerli bir JSON formatında değil.'); return;
          }
          state = data;
          /* İçe aktarılan dosya her zaman bağlı dosya olur ve konumu hatırlanır. */
          jsonHandle = h; canWrite = true; needsPermission = false; dirty = false; saveError = '';
          return idbSet(h).then(function(){
            render(); updateBar();
            alert('Veriler yüklendi. "' + h.name + '" dosyası hatırlandı; sonraki açılışlarda otomatik bağlanacak.');
          });
        });
      }).catch(function(e){
        if(e && e.name === 'AbortError') return;
        saveError = 'Dosya içe aktarılamadı.';
        updateBar();
      });
      return;
    }
    document.getElementById('importFileInput').click();
  }

  document.getElementById('importFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = JSON.parse(evt.target.result);
        state = normalize(data);
        render();
        changed();
        alert('Veriler başarıyla yükledi!');
      } catch(err) {
        alert('Hata: Seçilen dosya geçerli bir JSON formatında değil.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* 4. DIŞA AKTAR (EXPORT / YEDEK) */
  function downloadBackup(){
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'is-takip-data.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  function enablePermission(){
    if(!jsonHandle && folderHandle){
      folderHandle.requestPermission({ mode: 'readwrite' }).then(function(p){
        if(p === 'granted') return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok){ needsPermission = false; updateBar(); } });
        updateBar();
      }).catch(function(){ updateBar(); });
      return;
    }
    if(!jsonHandle) return;
    jsonHandle.requestPermission({ mode: 'readwrite' }).then(function(p){
      if(p === 'granted'){
        canWrite = true; needsPermission = false;
        return jsonHandle.getFile().then(function(f){ return f.text(); }).then(function(txt){
          if(txt.trim()){ try { state = normalize(JSON.parse(txt)); } catch(e){} }
          render();
          updateBar();
        }).catch(function(){
          /* Dosya taşınmış / silinmiş: klasörden yeniden bulmayı dene */
          jsonHandle = null; canWrite = false;
          if(folderHandle) return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok){ needsPermission = false; updateBar(); } });
          needsPermission = false; updateBar();
        });
      } else { updateBar(); }
    }).catch(function(){ updateBar(); });
  }

  function initFileHandle(){
    if(!hasFS || driveFlag()){ updateBar(); return; }
    /* Tarayıcının kayıtlı dosya bağlantısını kendiliğinden silmesini zorlaştır. */
    try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    /* İzin her açılışta yeniden istenebilir; yazma izni için kullanıcı hareketi gerekir.
       İlk tıklamada izni otomatik iste, ayrı düğmeye basmaya gerek kalmasın. */
    var autoAsk = function(e){
      if(needsPermission && !(e.target.closest && e.target.closest('#savebar'))) enablePermission();
      if(canWrite) document.removeEventListener('click', autoAsk, true);
    };
    document.addEventListener('click', autoAsk, true);
    function tryFolder(){
      if(!folderHandle){ updateBar(); return Promise.resolve(); }
      return folderHandle.queryPermission({ mode: 'readwrite' }).then(function(p){
        if(p === 'granted') return connectFolderFile(folderHandle, false).then(function(ok){ if(!ok) updateBar(); });
        needsPermission = true; updateBar();
      });
    }
    idbGet('folder').then(function(d){
      folderHandle = d || null;
      return idbGet('json_file');
    }).then(function(h){
      if(!h) return tryFolder();
      jsonHandle = h;
      return h.queryPermission({ mode: 'readwrite' }).then(function(p){
        if(p === 'granted'){
          canWrite = true;
          return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
            if(txt.trim()){ try { state = normalize(JSON.parse(txt)); } catch(e){} }
            render();
            updateBar();
          }).catch(function(){ jsonHandle = null; canWrite = false; return tryFolder(); });
        } else {
          needsPermission = true;
          updateBar();
        }
      });
    }).catch(function(){ updateBar(); });
  }

  /* DRIVE:BEGIN ---------- Google Drive ile kayıt ---------- */
  /* Google Cloud'dan aldığınız OAuth istemci kimliğini buraya yazabilirsiniz;
     boş bırakırsanız sayfadaki "Drive ayarı" kutusundan girilir (tarayıcıda saklanır). */
  var GOOGLE_CLIENT_ID = '';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var DRIVE_FOLDER = 'İş Takip', DRIVE_BACKUPS = 'Yedekler', DRIVE_FILE = 'is-takip-data.json', DRIVE_KEEP = 30;
  var drive = {
    on: false, busy: false, connecting: false, needsLogin: false, again: false,
    err: '', info: '', working: '', choice: null, setup: false,
    token: null, exp: 0, tokenP: null,
    folderId: null, backupsId: null, fileId: null, md5: null,
    rev: 0, savedRev: 0, timer: null, backupDay: ''
  };

  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
  function errMsg(e){ return e && e.message ? e.message : String(e); }
  function authErr(m){ var e = new Error(m); e.auth = true; return e; }
  function driveClientId(){ return (GOOGLE_CLIENT_ID || lsGet('is-takip-gcid') || '').trim(); }
  function driveFlag(){ return lsGet('is-takip-drive') === '1'; }
  function driveDirty(){ return drive.on && drive.rev !== drive.savedRev; }

  function waitGis(){
    return new Promise(function(res, rej){
      var n = 0;
      (function chk(){
        if(window.google && window.google.accounts && window.google.accounts.oauth2) return res(window.google.accounts.oauth2);
        if(++n > 80) return rej(authErr('Google giriş betiği yüklenemedi. İnternet bağlantınızı kontrol edin.'));
        setTimeout(chk, 100);
      })();
    });
  }

  function driveToken(interactive){
    if(drive.token && Date.now() < drive.exp - 60000) return Promise.resolve(drive.token);
    if(drive.tokenP) return drive.tokenP;
    var id = driveClientId();
    if(!id) return Promise.reject(authErr('Google istemci kimliği girilmemiş.'));
    drive.tokenP = waitGis().then(function(oauth){
      return new Promise(function(res, rej){
        var tc = oauth.initTokenClient({
          client_id: id, scope: DRIVE_SCOPE,
          callback: function(r){
            if(!r || r.error || !r.access_token) return rej(authErr((r && r.error) || 'Giriş yapılamadı.'));
            drive.token = r.access_token; drive.exp = Date.now() + (+r.expires_in || 3600) * 1000;
            res(r.access_token);
          },
          error_callback: function(e){ rej(authErr((e && (e.type || e.message)) || 'Giriş yapılamadı.')); }
        });
        tc.requestAccessToken({ prompt: interactive ? '' : 'none' });
      });
    }).then(function(t){ drive.tokenP = null; return t; }, function(e){ drive.tokenP = null; throw e; });
    return drive.tokenP;
  }

  function driveFetch(url, opts, interactive, retried){
    return driveToken(!!interactive).then(function(t){
      var o = Object.assign({}, opts || {});
      o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + t });
      return fetch(url, o);
    }).then(function(r){
      if(r.status === 401 && !retried){ drive.token = null; return driveFetch(url, opts, interactive, true); }
      if(!r.ok){ var e = new Error('Drive hatası (' + r.status + ')'); e.status = r.status; throw e; }
      return r;
    });
  }

  var D_API = 'https://www.googleapis.com/drive/v3/files';
  var D_UP = 'https://www.googleapis.com/upload/drive/v3/files';
  function dEsc(s){ return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  function dList(q, extra){
    return driveFetch(D_API + '?spaces=drive&pageSize=100&fields=' + encodeURIComponent('files(id,name,md5Checksum,createdTime)') +
      '&q=' + encodeURIComponent(q) + (extra || '')).then(function(r){ return r.json(); }).then(function(j){ return j.files || []; });
  }
  function dFolder(name, parent){
    var q = "mimeType='application/vnd.google-apps.folder' and name='" + dEsc(name) + "' and trashed=false and '" + (parent || 'root') + "' in parents";
    return dList(q).then(function(fs){
      if(fs.length) return fs[0].id;
      var meta = { name: name, mimeType: 'application/vnd.google-apps.folder' };
      if(parent) meta.parents = [parent];
      return driveFetch(D_API + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) })
        .then(function(r){ return r.json(); }).then(function(j){ return j.id; });
    });
  }
  function dCreate(name, parent, text){
    var b = 'ist' + uid();
    var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify({ name: name, parents: [parent], mimeType: 'application/json' }) +
      '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + text + '\r\n--' + b + '--';
    return driveFetch(D_UP + '?uploadType=multipart&fields=id,md5Checksum', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: body })
      .then(function(r){ return r.json(); });
  }
  function driveEnsure(){
    if(drive.folderId && drive.backupsId) return Promise.resolve();
    return dFolder(DRIVE_FOLDER).then(function(fid){
      drive.folderId = fid; return dFolder(DRIVE_BACKUPS, fid);
    }).then(function(bid){
      drive.backupsId = bid;
      return dList("name='" + dEsc(DRIVE_FILE) + "' and '" + drive.folderId + "' in parents and trashed=false");
    }).then(function(fs){
      if(fs.length){ drive.fileId = fs[0].id; drive.md5 = fs[0].md5Checksum; }
    });
  }
  function driveRead(){ return driveFetch(D_API + '/' + drive.fileId + '?alt=media').then(function(r){ return r.text(); }); }
  function driveMeta(){ return driveFetch(D_API + '/' + drive.fileId + '?fields=id,md5Checksum,trashed').then(function(r){ return r.json(); }); }
  function driveWrite(text){
    function create(){ return dCreate(DRIVE_FILE, drive.folderId, text).then(function(m){ drive.fileId = m.id; return m; }); }
    if(!drive.fileId) return create();
    return driveFetch(D_UP + '/' + drive.fileId + '?uploadType=media&fields=id,md5Checksum', { method: 'PATCH', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: text })
      .then(function(r){ return r.json(); })
      .catch(function(e){ if(e.status === 404){ drive.fileId = null; return create(); } throw e; });
  }

  /* Günün ilk kaydında, üzerine yazılmadan önceki Drive sürümü Yedekler klasörüne kopyalanır; son 30 yedek tutulur. */
  function drivePrune(prefix){
    return dList("'" + drive.backupsId + "' in parents and trashed=false", '&orderBy=' + encodeURIComponent('createdTime desc')).then(function(fs){
      fs = fs.filter(function(f){ return f.name.indexOf(prefix) === 0; });
      return fs.slice(DRIVE_KEEP).reduce(function(p, f){
        return p.then(function(){ return driveFetch(D_API + '/' + f.id, { method: 'DELETE' }).catch(function(){}); });
      }, Promise.resolve());
    });
  }
  function driveDailyBackup(){
    var day = dayKey(Date.now());
    if(drive.backupDay === day || !drive.fileId) return Promise.resolve();
    var name = 'is-takip-yedek-' + day + '.json';
    return dList("name='" + dEsc(name) + "' and '" + drive.backupsId + "' in parents and trashed=false").then(function(fs){
      if(fs.length){ drive.backupDay = day; return; }
      return driveRead().then(function(txt){
        if(!txt || !txt.trim()){ drive.backupDay = day; return; }
        return dCreate(name, drive.backupsId, txt).then(function(){ drive.backupDay = day; return drivePrune('is-takip-yedek-'); });
      });
    }).catch(function(e){ if(e.status === 404){ drive.fileId = null; return; } throw e; });
  }
  function driveSnapshotRemote(){
    if(!drive.fileId) return Promise.resolve();
    return driveRead().then(function(txt){
      if(!txt || !txt.trim()) return;
      return dCreate('is-takip-onceki-' + dayKey(Date.now()) + '-' + Date.now().toString(36) + '.json', drive.backupsId, txt).then(function(){ return drivePrune('is-takip-onceki-'); });
    });
  }

  function driveFail(e){
    if(e && (e.auth || e.status === 401 || e.status === 403)) drive.needsLogin = true;
    drive.err = 'Drive\'a kaydedilemedi: ' + errMsg(e);
  }
  function driveSave(){
    if(!drive.on || drive.choice) return Promise.resolve();
    if(drive.busy){ drive.again = true; return Promise.resolve(); }
    drive.busy = true; drive.err = '';
    var rev = drive.rev, text = JSON.stringify(state, null, 2);
    updateBar();
    return driveToken(false).then(driveEnsure).then(function(){
      return driveDailyBackup().then(function(){ return driveWrite(text); }).then(function(m){
        if(m.md5Checksum) return m;
        return driveMeta();
      }).then(function(m){
        drive.md5 = m.md5Checksum || null; drive.savedRev = rev; drive.needsLogin = false;
      });
    }).catch(driveFail).then(function(){
      drive.busy = false; updateBar();
      if(drive.again){ drive.again = false; setTimeout(driveSave, 300); }
    });
  }
  function driveQueue(){
    drive.info = '';
    drive.rev++;
    clearTimeout(drive.timer);
    drive.timer = setTimeout(driveSave, 1500);
  }

  /* Elle yedek: o anki verinin tarihli bir kopyasını Yedekler klasörüne yazar (günlük yedekten bağımsız). */
  function driveBackupNow(){
    if(!drive.on || drive.working) return Promise.resolve();
    drive.working = 'Drive\'a yedek alınıyor…'; drive.err = ''; drive.info = ''; updateBar();
    var d = new Date(), name = 'is-takip-elle-' + dayKey(d.getTime()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.json';
    var text = JSON.stringify(state, null, 2);
    return driveToken(true).then(driveEnsure).then(function(){
      return dCreate(name, drive.backupsId, text);
    }).then(function(){
      return drivePrune('is-takip-elle-');
    }).then(function(){
      drive.info = '✓ Yedek alındı: ' + DRIVE_FOLDER + ' › ' + DRIVE_BACKUPS + ' › ' + name;
    }).catch(function(e){ drive.err = 'Yedek alınamadı: ' + errMsg(e); if(e && e.auth) drive.needsLogin = true; })
      .then(function(){ drive.working = ''; updateBar(); });
  }

  function driveAdopt(remoteState, md5){
    state = remoteState; drive.md5 = md5; drive.on = true; drive.choice = null; drive.needsLogin = false; drive.err = '';
    drive.rev = 0; drive.savedRev = 0; editKey = null; dirty = false;
    lsSet('is-takip-drive', '1');
    render();
  }
  function driveLoadRemote(){
    return driveMeta().then(function(meta){ return driveRead().then(function(txt){ return { meta: meta, txt: txt }; }); }).then(function(x){
      var txt = x.txt, meta = x.meta;
      var r; try { r = normalize(JSON.parse(txt)); } catch(e){ throw new Error('Drive\'daki dosya geçerli bir JSON değil.'); }
      return driveAdopt(r, meta.md5Checksum);
    });
  }
  function driveKeepLocal(){
    return driveSnapshotRemote().then(function(){ return drive.fileId ? driveMeta() : { md5Checksum: null }; }).then(function(m){
      drive.md5 = m.md5Checksum; drive.on = true; drive.choice = null; drive.needsLogin = false; drive.err = '';
      lsSet('is-takip-drive', '1');
      drive.rev++;
      return driveSave();
    });
  }

  function driveConnect(){
    drive.err = ''; drive.connecting = true; updateBar();
    return driveToken(true).then(driveEnsure).then(function(){
      if(!drive.fileId) return driveKeepLocal();
      return driveRead().then(function(txt){
        var remote = null; try { remote = normalize(JSON.parse(txt)); } catch(e){}
        var localEmpty = !state.projects.length && !Object.keys((state.leave && state.leave.days) || {}).length;
        if(remote && (localEmpty || JSON.stringify(remote) === JSON.stringify(normalize(state)))) return driveAdopt(remote, drive.md5);
        drive.choice = { type: 'connect', remoteOk: !!remote };
      });
    }).catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
  }
  function driveChoose(what){
    var c = drive.choice; if(!c) return;
    drive.err = ''; drive.connecting = true; updateBar();
    var p;
    if(what === 'cancel'){ drive.choice = null; if(c.type === 'connect') drive.on = false; p = Promise.resolve(); }
    else if(what === 'remote') p = driveLoadRemote();
    else p = driveKeepLocal();
    return p.catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
  }
  function driveReconnect(){
    if(!drive.on) return driveConnect();
    drive.connecting = true; drive.err = ''; updateBar();
    return driveToken(true).then(function(){ drive.needsLogin = false; return driveSave(); })
      .catch(driveFail).then(function(){ drive.connecting = false; updateBar(); });
  }
  function driveDisconnect(){
    clearTimeout(drive.timer);
    drive.on = false; drive.choice = null; drive.needsLogin = false; drive.err = '';
    drive.folderId = drive.backupsId = drive.fileId = drive.md5 = null; drive.token = null;
    lsSet('is-takip-drive', null);
    updateBar();
  }
  function driveSyncNow(){
    if(driveDirty()) return driveSave();
    return driveSync(true);
  }
  function driveSync(manual){
    if(!drive.on || drive.busy || drive.connecting || drive.choice || !drive.fileId) return Promise.resolve();
    if(!manual && (driveDirty() || editKey)) return Promise.resolve();
    return driveToken(false).then(driveMeta).then(function(m){
      if(!m.md5Checksum || !drive.md5 || String(m.md5Checksum) === String(drive.md5)) return;
      if(driveDirty()) return;
      return driveLoadRemote();
    }).catch(function(e){
      if(e && e.auth) drive.needsLogin = true;
      else if(manual) drive.err = 'Eşitlenemedi: ' + errMsg(e);
    }).then(updateBar);
  }
  function driveInit(){
    if(!driveFlag() || !driveClientId()) return;
    drive.connecting = true; updateBar();
    driveToken(false).then(driveEnsure).then(function(){
      if(dirty){ drive.choice = { type: 'connect', remoteOk: !!drive.fileId }; return; }   /* bağlanırken yerelde değişiklik yapıldı: sor */
      if(!drive.fileId){ drive.on = true; return; }
      return driveLoadRemote();
    }).catch(function(e){
      drive.on = false; drive.needsLogin = true;
      if(!e.auth) drive.err = 'Drive bağlantısı kurulamadı: ' + errMsg(e);
    }).then(function(){ drive.connecting = false; updateBar(); });
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') driveSync(false);
  });

  /* Kayıt çubuğundaki Drive bölümü */
  function driveBarParts(){
    var cls = 'status', msg, btns = [];
    function B(t, fn, primary, dis){ var b = el('button', { class: (primary ? 'primary ' : '') + 'small', text: t, onclick: fn }); if(dis) b.disabled = true; btns.push(b); }
    if(drive.err){ cls += ' err'; msg = '⚠ ' + drive.err; }
    else if(drive.choice && drive.choice.type === 'connect'){
      cls += ' warn'; msg = 'Drive\'da zaten kayıtlı veri var. Hangisi kullanılsın?';
    } else if(drive.working){ cls += ' warn'; msg = '☁ ' + drive.working; }
    else if(drive.connecting){ cls += ' warn'; msg = '☁ Google Drive\'a bağlanılıyor…'; }
    else if(drive.needsLogin){ cls += ' warn'; msg = '☁ Drive bağlantısı için yeniden giriş gerekli.'; }
    else if(drive.on && drive.busy){ cls += ' warn'; msg = '● Drive\'a yazılıyor…'; }
    else if(drive.on && driveDirty()){ cls += ' warn'; msg = '● Değişiklikler birazdan Drive\'a yazılacak…'; }
    else if(drive.on && drive.info){ cls += ' ok'; msg = drive.info; }
    else if(drive.on){ cls += ' ok'; msg = '✓ Veriler Google Drive › ' + DRIVE_FOLDER + ' klasörüne otomatik kaydediliyor. Günlük yedekler Yedekler klasöründe.'; }
    else { msg = 'Veriler henüz Google Drive\'a bağlı değil.'; }

    if(drive.choice && drive.choice.type === 'connect'){

  /* ---------- Genel Arama ---------- */
  var searchQ = '';
  var FOLDMAP = { 'ı':'i','İ':'i','ç':'c','Ç':'c','ğ':'g','Ğ':'g','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u','â':'a','Â':'a','î':'i','û':'u' };
  /* Büyük/küçük harf ve Türkçe karakterden bağımsız karşılaştırma (1:1 uzunluk korunur) */
  function fold(x){
    x = String(x == null ? '' : x); var o = '';
    for(var i = 0; i < x.length; i++){
      var c = x.charAt(i), m = FOLDMAP[c];
      if(m){ o += m; continue; }
      var l = c.toLowerCase(); o += (l.length === 1 ? l : c);
    }
    return o;
  }
  function searchWords(q){ return fold(q).split(/\s+/).filter(Boolean); }
  function matches(words, text){
    var f = fold(text);

  }
  /* Eşleşen kısımları <mark> ile vurgula; uzun metni eşleşme çevresinde kısalt */
  function hl(text, words, maxLen){
    text = String(text == null ? '' : text);
    var f = fold(text), first = -1;
    words.forEach(function(w){ var i = f.indexOf(w); if(i >= 0 && (first < 0 || i < first)) first = i; });
    var start = 0, end = text.length, pre = '', post = '';
    if(maxLen && text.length > maxLen){
      start = Math.max(0, (first < 0 ? 0 : first) - 40);
      end = Math.min(text.length, start + maxLen);
      if(start > 0) pre = '…';
      if(end < text.length) post = '…';
    }
    var mask = new Array(end - start + 1).join('0').split('');
    words.forEach(function(w){
      var from = start;
      while(true){
        var i = f.indexOf(w, from);
        if(i < 0 || i >= end) break;
        for(var k = i; k < Math.min(end, i + w.length); k++) mask[k - start] = '1';
        from = i + Math.max(1, w.length);
      }
    });
    var frag = document.createDocumentFragment();
    if(pre) frag.appendChild(document.createTextNode(pre));
    var i2 = 0, seg = text.slice(start, end);
    while(i2 < seg.length){
      var on = mask[i2] === '1', j = i2;
      while(j < seg.length && (mask[j] === '1') === on) j++;
      var part = seg.slice(i2, j);
      if(on) frag.appendChild(el('mark', { class:'hl', text: part }));
      else frag.appendChild(document.createTextNode(part));
      i2 = j;
    }
    if(post) frag.appendChild(document.createTextNode(post));
    return frag;
  }

    var G = { proje:[], is:[], madde:[], hat:[], hafta:[], izin:[] };
    state.projects.forEach(function(p){

        }
      });
      p.tasks.forEach(function(t){
        if(matches(words, t.title + ' ' + (t.note || ''))){
          G.is.push({ main:t.title, note:t.note, meta:p.title, go:function(){ goTask(t.id); } });
        }
        t.items.forEach(function(it){

    function fin(n){ return (n > 0 && n <= 60000) ? n : null; }
    var m = s.match(/^(\d+):(\d{1,2})$/);
    if(m){ if(+m[2] > 59) return null; return fin(+m[1] * 60 + +m[2]); }
    if(/^\d+(\.\d+)?$/.test(s)) return fin(Math.round(parseFloat(s) * 60));
    var re = /(\d+(?:\.\d+)?)\s*(saat|sa|s|h|hr|hrs|hours?|dakika|dk|d|m|min|mins|minutes?)(?![a-zçğıöşü])/g;
    var total = 0, found = false, x;
    while((x = re.exec(s)) !== null){
      found = true;
      var v = parseFloat(x[1]);
      total += /^(saat|sa|s|h|hr|hrs|hour|hours)$/.test(x[2]) ? v * 60 : v;
    }
    if(!found) return null;
    var rest = s.replace(re, '').replace(/çalışıldı|çalışma|harcandı|ve|[\s+,()]/g, '');
    if(rest) return null;
    return fin(Math.round(total));
  }

  function startEdit(key){ editKey = key; render(); }
  function cancelEdit(){ editKey = null; render(); }
  function escCancel(e){ if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); } }

    return el('form', { class:'editform', onsubmit:function(e){

    } }, [

    ]);
  }

  function noteBtn(obj){
    return el('button', { class:'icon', title:'Not ekle / düzenle', 'aria-label':'Not ekle veya düzenle',
      text: obj.note ? '📝 Not' : '📝 Not ekle', onclick:function(){ startEdit('n:' + obj.id); } });

  function noteForm(obj){
    var ta = el('textarea', { rows:'3', maxlength:'2000', placeholder:'Notunuzu yazın…', 'data-edit':'1' });
    ta.value = obj.note || '';
    function save(){
      var v = ta.value.trim();
      if(v) obj.note = v;
      else if(obj.note){ if(!askDelete('Not silinsin mi?\n"' + snip(obj.note, 80) + '"')) return; delete obj.note; }
      editKey = null; commit();
    }
    ta.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
      else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
    });
    var actions = [
      el('button', { type:'submit', class:'primary small', text:'Kaydet' }),
      el('button', { type:'button', class:'small', text:'İptal', onclick: cancelEdit })
    ];
    if(obj.note){
      actions.push(el('button', { type:'button', class:'small', text:'Notu Sil', onclick:function(){
        if(!askDelete('Not silinsin mi?\n"' + snip(obj.note, 80) + '"')) return;
        delete obj.note; editKey = null; commit();
      } }));
    }
    actions.push(el('span', { class:'hintx', text:'Ctrl+Enter ile kaydet' }));
    return el('form', { class:'noteform', onsubmit:function(e){ e.preventDefault(); save(); } }, [
      ta, el('div', { class:'noteactions' }, actions)
    ]);
